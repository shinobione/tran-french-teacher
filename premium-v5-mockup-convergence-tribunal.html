<!doctype html><html><head><meta charset="utf-8"><title>Premium V5.4 mockup convergence tribunal</title><style>body{margin:0}iframe{display:block;border:0;width:390px;height:844px}</style></head><body><iframe id="f" src="./index.html?uxSmoke=lesson8&fieldNavV3=1"></iframe><script>
(()=>{'use strict';
const R=document.documentElement,F=document.getElementById('f'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=async(fn,limit=16000)=>{for(let t=0;t<limit;t+=50){try{const v=fn();if(v)return v}catch{}await wait(50)}try{return fn()}catch{return null}};
const sizes=[[390,844],[430,932],[768,1024],[1280,800],[1440,900]],premiumThemes=['aurora','sunset','jade'];
/* This visual route tribunal opens real Listening sessions, which legitimately update
   the Listening session store. Keep all unrelated durable stores byte-identical here;
   Listening persistence semantics remain owned by the dedicated Listening tests. */
const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'];
const finish=(ok,msg)=>{R.dataset.premiumV5Mockup=ok?'ok':'fail';R.dataset.premiumV5MockupDetail=msg};
const visible=(w,n)=>{if(!n)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0&&r.width>1&&r.height>1};
const rect=n=>n.getBoundingClientRect();
const close=(a,b,t=8)=>Math.abs(a-b)<=t;
F.onload=()=>setTimeout(async()=>{try{
 const w=F.contentWindow,d=F.contentDocument,ready=await waitFor(()=>w.FrenchTranquilleThemes&&w.FrenchTranquilleFieldNavigation&&w.FrenchTranquilleBuild27Shell&&d.querySelector('.ux-bottom-nav'));
 if(!ready)throw Error('api-not-ready');
 const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
 const noOverflow=()=>Math.max(d.documentElement.scrollWidth,d.body.scrollWidth)<=w.innerWidth+2;
 const marker=()=>w.getComputedStyle(d.documentElement).getPropertyValue('--pv54-mockup-ready').trim();
 const settle=async(ms=70)=>{w.FrenchTranquilleFieldNavigation?.settle?.();await wait(ms)};
 const closeOverlay=async()=>{d.querySelector('body > .listening-overlay [data-listening-close]')?.click();d.querySelector('body > .b27-practice-page [data-b27-close-practice]')?.click();await wait(100)};
 const home=async()=>{if(d.querySelector('.screen-settings'))d.querySelector('.screen-settings [data-back]')?.click();await closeOverlay();await w.FrenchTranquilleFieldNavigation.go('home');await settle()};
 const progress=async()=>{await home();await w.FrenchTranquilleFieldNavigation.go('progress');await settle()};
 const practice=async()=>{await home();await w.FrenchTranquilleFieldNavigation.go('practice');await settle()};
 const listening=async()=>{await practice();const a=await waitFor(()=>d.querySelector('body > .b27-practice-page [data-b27-practice-action="listening"]'),2500);if(!a||a.disabled)throw Error('listening-unavailable');a.click();await waitFor(()=>visible(w,d.querySelector('body > .listening-overlay')),3500)};
 const settings=async()=>{await home();w.FrenchTranquilleFieldNavigation.openSettings();await settle(100)};
 const checkCommon=label=>{if(!noOverflow())throw Error(label+':overflow');if(marker()!=='1')throw Error(label+':marker')};
 const checkHome=async(width,label)=>{await home();const owner=d.querySelector('.b27-home'),main=d.querySelector('.b27-home-main'),side=d.querySelector('.b27-home-side'),logo=d.querySelector('.ft-modern-home-logo');if(!visible(w,owner)||!visible(w,main)||!visible(w,side)||!visible(w,logo))throw Error(label+':home-nodes');if(width>=1280){const o=rect(owner),m=rect(main),s=rect(side),l=rect(logo);if(o.width<1030||o.width>1195)throw Error(label+':home-width-'+Math.round(o.width));if(!(s.left>m.left+m.width-4))throw Error(label+':home-not-two-column');if(l.width>380)throw Error(label+':logo-too-wide-'+Math.round(l.width))}checkCommon(label)};
 const checkProgress=async(width,label)=>{await progress();const owner=d.querySelector('.b27-progress-page'),level=d.querySelector('.b27-level-card'),current=d.querySelector('.b27-current-card'),stage=d.querySelector('.b27-stage-card');if(![owner,level,current,stage].every(n=>visible(w,n)))throw Error(label+':progress-nodes');if(width>=1280){const o=rect(owner),l=rect(level),c=rect(current),s=rect(stage);if(o.width<1030||o.width>1195)throw Error(label+':progress-width-'+Math.round(o.width));if(l.width<o.width*.88)throw Error(label+':level-not-wide');if(!close(c.top,s.top,20)||!(s.left>c.right-4))throw Error(label+':progress-not-two-column')}checkCommon(label)};
 const checkPractice=async(width,label)=>{await practice();const page=await waitFor(()=>{const n=d.querySelector('body > .b27-practice-page');return visible(w,n)?n:null},1800),main=d.querySelector('.b27-practice-main'),list=d.querySelector('.b27-practice-list'),all=[...d.querySelectorAll('.b27-practice-list .b27-practice-action')],rec=all.find(n=>n.querySelector('em')),secondary=all.filter(n=>n!==rec);if(!page||!visible(w,main)||!visible(w,list)||!rec||secondary.length<3)throw Error(label+':practice-nodes');if(width>=1280){const lr=rect(list),rr=rect(rec),rs=secondary.slice(0,3).map(rect);if(rect(main).width<900)throw Error(label+':practice-too-narrow-'+Math.round(rect(main).width));if(rr.width<lr.width*.92)throw Error(label+':recommendation-not-wide');const top=Math.min(...rs.map(r=>r.top));if(rs.some(r=>!close(r.top,top,16)))throw Error(label+':secondary-not-one-row');const lefts=rs.map(r=>Math.round(r.left)).sort((a,b)=>a-b);if(new Set(lefts).size<3)throw Error(label+':secondary-not-three-column')}checkCommon(label)};
 const checkListening=async(width,label)=>{await listening();const shell=d.querySelector('.listening-shell'),a=d.querySelector('.listening-audio-card'),q=d.querySelector('.listening-question-card');if(!visible(w,shell)||!visible(w,a)||!visible(w,q))throw Error(label+':listening-nodes');if(width>=1280){const sr=rect(shell),ar=rect(a),qr=rect(q);if(sr.width<990||sr.width>1140)throw Error(label+':listening-width-'+Math.round(sr.width));if(!close(ar.top,qr.top,18)||!(qr.left>ar.right-4))throw Error(label+':listening-not-two-column');if(Math.min(ar.height,qr.height)<370)throw Error(label+':listening-too-shallow')}checkCommon(label);await closeOverlay()};
 const checkSettings=async(width,label)=>{await settings();const narrow=d.querySelector('.screen-settings .narrow'),note=d.querySelector('.screen-settings .ux-settings-note'),picker=d.querySelector('.screen-settings .ft-theme-settings-inline');if(!visible(w,narrow)||!visible(w,picker))throw Error(label+':settings-nodes');if(width>=1280){if(!visible(w,note))throw Error(label+':settings-note-missing');const nr=rect(narrow),r=rect(note);if(nr.width<980)throw Error(label+':settings-too-narrow-'+Math.round(nr.width));if(r.width<nr.width*.92)throw Error(label+':settings-note-not-wide')}checkCommon(label)};
 for(const[width,height]of sizes){
   F.style.width=width+'px';F.style.height=height+'px';await wait(80);
   /* Original is a strict anti-leak witness here. Its full route/motion behavior
      remains covered by V4 Global + P0; V5.4 only owns Premium geometry. */
   w.FrenchTranquilleThemes.apply('original');await wait(90);await home();if(marker())throw Error(`${width}x${height}:original:leak`);if(!noOverflow())throw Error(`${width}x${height}:original:overflow`);
   for(const theme of premiumThemes){w.FrenchTranquilleThemes.apply(theme);await wait(100);const base=`${width}x${height}:${theme}`;await checkHome(width,base+':home');await checkProgress(width,base+':progress');await checkPractice(width,base+':practice');await checkListening(width,base+':listening');await checkSettings(width,base+':settings');if(width<=430&&w.getComputedStyle(d.documentElement).getPropertyValue('--pv54-mobile-preserved').trim()!=='1')throw Error(base+':mobile-contract')}
 }
 for(const k of keys)if(before[k]!==w.localStorage.getItem(k))throw Error('store-mutated:'+k);
 w.FrenchTranquilleThemes.apply('original');await wait(60);if(marker())throw Error('original-leak-after');
 finish(true,'viewports=5;premium-themes=3;original=witness;surfaces=5;desktop=mockup-geometry;practice=3plus1;settings=intro-wide;listening=balanced;mobile=preserved;overflow=0;non-listening-stores=unchanged');
}catch(e){finish(false,e.message)}},140);
setTimeout(()=>{if(!R.dataset.premiumV5Mockup)finish(false,'timeout')},95000);
})();
</script></body></html>
