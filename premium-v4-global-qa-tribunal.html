<!doctype html>
<html><head><meta charset="utf-8"><title>Premium V4 global visual QA tribunal</title><style>body{margin:0}iframe{display:block;border:0}</style></head>
<body><iframe id="f" src="./index.html?uxSmoke=lesson8&fieldNavV3=1" style="width:390px;height:844px"></iframe>
<script>
(()=>{'use strict';
const R=document.documentElement,F=document.getElementById('f');
const sizes=[[390,844],[430,932],[768,1024],[1280,800],[1440,900]];
const themes=['original','aurora','sunset','jade'];
const screens=['home','progress','practice','listening','settings'];
const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const done=(ok,detail)=>{R.dataset.premiumV4GlobalQa=ok?'ok':'fail';R.dataset.premiumV4GlobalQaDetail=detail};
const vis=(w,n)=>{if(!n)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect(),o=parseFloat(s.opacity||'1');return s.display!=='none'&&s.visibility!=='hidden'&&o>.001&&r.width>1&&r.height>1};
const secs=v=>String(v||'0s').split(',').map(x=>parseFloat(x)||0);
const hasMotion=(w,n)=>{const s=w.getComputedStyle(n);return Math.max(...secs(s.transitionDuration),...secs(s.animationDuration))>0};
const rgba=s=>{const m=String(s).match(/rgba?\(([^)]+)\)/);if(!m)return null;const a=m[1].split(/[ ,/]+/).filter(Boolean).map(Number);return a.length>=3?[a[0],a[1],a[2],Number.isFinite(a[3])?a[3]:1]:null};
const srgb=s=>{const m=String(s).match(/color\(srgb\s+([^)]+)\)/i);if(!m)return null;const parts=m[1].trim().split(/\s*\/\s*/);const rgb=parts[0].trim().split(/\s+/).map(Number);if(rgb.length<3||rgb.some(x=>!Number.isFinite(x)))return null;const a=parts[1]===undefined?1:Number(parts[1]);return [rgb[0]*255,rgb[1]*255,rgb[2]*255,Number.isFinite(a)?a:1]};
const cssColor=s=>rgba(s)||srgb(s);
const cssColors=s=>{const text=String(s||''),out=[];for(const m of text.matchAll(/rgba?\(([^)]+)\)/g)){const c=rgba(m[0]);if(c)out.push(c)}for(const m of text.matchAll(/color\(srgb\s+([^)]+)\)/gi)){const c=srgb(m[0]);if(c)out.push(c)}return out};
const lum=c=>{const f=x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const ratio=(a,b)=>{if(!a||!b)return 0;const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return (x+.05)/(y+.05)};
const contrast=(a,b)=>ratio(cssColor(a),cssColor(b));
F.onload=()=>setTimeout(async()=>{try{
 const w=F.contentWindow,d=F.contentDocument,reduced=w.matchMedia('(prefers-reduced-motion: reduce)').matches;
 /* Original keeps its historical route fades. Chrome headless virtual-time can
    freeze those compositor transitions, so only the Original route containers
    are timing-neutralized inside this settled-layout harness. Premium route
    motion remains untouched here and is independently guarded by the atomic tribunal. */
 const stable=d.createElement('style');stable.dataset.globalQaOriginalSettle='1';stable.textContent='html[data-theme="original"] .b27-page,html[data-theme="original"] .b27-overlay,html[data-theme="original"] .listening-overlay{transition-duration:0s!important;animation-duration:0s!important}';d.head.appendChild(stable);
 const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
 const rootStyle=()=>w.getComputedStyle(d.documentElement);
 const current=()=>[...d.querySelector('#app .app-shell')?.classList||[]].find(x=>x.startsWith('screen-'))?.slice(7)||'';
 const nav=()=>d.querySelector('.ux-bottom-nav');
 const navButton=id=>d.querySelector(`.ux-bottom-nav [data-ux-nav="${id}"]`);
 const withinX=(n,pad=1)=>{const r=n.getBoundingClientRect();return r.left>=-pad&&r.right<=w.innerWidth+pad};
 const withinViewport=n=>{const r=n.getBoundingClientRect();return r.left>=-1&&r.right<=w.innerWidth+1&&r.top>=-1&&r.bottom<=w.innerHeight+1};
 const noOverflow=()=>Math.max(d.documentElement.scrollWidth,d.body.scrollWidth)<=w.innerWidth+2;
 const assertNav=(label,expect=true)=>{const n=nav();if(expect){if(!vis(w,n))throw Error(label+':nav-hidden');if(!withinX(n))throw Error(label+':nav-clipped');for(const b of n.querySelectorAll('button')){if(!vis(w,b))continue;const r=b.getBoundingClientRect();if(r.width<44||r.height<44)throw Error(label+':nav-target-small')}}else if(vis(w,n))throw Error(label+':nav-visible')};
 const markers=['--pv4-home-ready','--pv4-progress-ready','--pv4-practice-ready','--pv4-listening-ready','--pv4-settings-ready','--pv4-route-coherence-ready','--pv4-motion-ready','--pv4-contrast-ready'];
 const assertThemeContract=(theme,label)=>{if(theme==='original'){for(const k of markers)if(rootStyle().getPropertyValue(k).trim())throw Error(label+':original-v4-leak:'+k);return}for(const k of markers)if(rootStyle().getPropertyValue(k).trim()!=='1')throw Error(label+':marker:'+k);const p=d.createElement('i');p.style.cssText='position:fixed;left:-9999px;color:var(--text);background:var(--page)';d.body.appendChild(p);const ps=w.getComputedStyle(p),bodyRatio=contrast(ps.color,ps.backgroundColor);p.remove();if(bodyRatio<4.5)throw Error(label+':text-contrast:'+bodyRatio.toFixed(2))};
 const assertCtaContrast=(node,label)=>{const s=w.getComputedStyle(node),fg=cssColor(s.color);if(!fg)return;const stops=cssColors(s.backgroundImage).filter(c=>c[3]>=.999);let ratios=stops.map(bg=>ratio(fg,bg));if(!ratios.length){const bg=cssColor(s.backgroundColor);if(bg&&bg[3]>=.999)ratios=[ratio(fg,bg)]}if(ratios.length){const worst=Math.min(...ratios);if(worst<4.5)throw Error(label+':cta-contrast:'+worst.toFixed(2))}};
 const routeMotionZero=(theme,owner,label)=>{if(theme==='original')return;if(hasMotion(w,owner))throw Error(label+':route-motion')};
 const headerFor=screen=>screen==='home'?d.querySelector('.b27-home .ft-modern-home-logo'):screen==='progress'?d.querySelector('.b27-progress-page .b27-page-title h1'):screen==='practice'?d.querySelector('body > .b27-practice-page .b27-overlay-header'):screen==='listening'?d.querySelector('body > .listening-overlay .listening-top'):d.querySelector('.screen-settings .topbar');
 const ctaFor=screen=>screen==='home'?d.querySelector('.b27-home .b27-primary-action'):screen==='progress'?d.querySelector('.b27-progress-page .b27-current-card .b27-primary-action'):screen==='practice'?d.querySelector('body > .b27-practice-page .b27-practice-action:not(:disabled)'):screen==='listening'?d.querySelector('body > .listening-overlay .listening-play.primary'):d.querySelector('.screen-settings .theme-option[aria-pressed="true"],.screen-settings .theme-option');
 const ownerFor=screen=>screen==='home'?d.querySelector('.b27-home'):screen==='progress'?d.querySelector('.b27-progress-page'):screen==='practice'?d.querySelector('body > .b27-practice-page'):screen==='listening'?d.querySelector('body > .listening-overlay'):d.querySelector('.screen-settings');
 const hiddenOwnerDetail=(label,owner)=>{if(!owner)return label+':owner-hidden:missing';const s=w.getComputedStyle(owner),r=owner.getBoundingClientRect();return `${label}:owner-hidden:display=${s.display}:visibility=${s.visibility}:opacity=${s.opacity}:rect=${Math.round(r.width)}x${Math.round(r.height)}:class=${owner.className}:html=${d.documentElement.className}:screen=${current()}`};
 const settle=async(ms=40)=>{w.FrenchTranquilleFieldNavigation?.settle?.();await wait(ms)};
 const toHome=async()=>{if(current()==='settings')d.querySelector('.screen-settings [data-back]')?.click();await wait(120);await w.FrenchTranquilleFieldNavigation.go('home');await settle()};
 const route=async screen=>{await toHome();if(screen==='home')return;if(screen==='progress'){await w.FrenchTranquilleFieldNavigation.go('progress');await settle();return}if(screen==='practice'){await w.FrenchTranquilleFieldNavigation.go('practice');await settle();return}if(screen==='listening'){await w.FrenchTranquilleFieldNavigation.go('practice');await settle();const a=d.querySelector('body > .b27-practice-page [data-b27-practice-action="listening"]');if(!a||a.disabled)throw Error('listening-unavailable');a.click();await wait(280);return}if(screen==='settings'){w.FrenchTranquilleFieldNavigation.openSettings();await settle()}};
 const validate=async(width,height,theme,screen)=>{const label=`${width}x${height}:${theme}:${screen}`;assertThemeContract(theme,label);const owner=ownerFor(screen);if(!vis(w,owner))throw Error(hiddenOwnerDetail(label,owner));routeMotionZero(theme,owner,label);if(!noOverflow())throw Error(label+':horizontal-overflow');if(!withinX(owner))throw Error(label+':owner-clipped');const header=headerFor(screen);if(!vis(w,header)||!withinX(header))throw Error(label+':header-clipped');if(screen==='home'){const logo=d.querySelector('.b27-home .ft-modern-home-logo');if(!vis(w,logo)||!withinViewport(logo))throw Error(label+':logo-clipped')}assertNav(label,screen!=='settings');const cta=ctaFor(screen);if(!vis(w,cta))throw Error(label+':cta-hidden');cta.scrollIntoView({block:'center',inline:'nearest'});await wait(24);if(!withinViewport(cta))throw Error(label+':cta-clipped');if(theme!=='original')assertCtaContrast(cta,label);if(screen!=='settings'){const active=navButton(screen==='listening'?'practice':screen);if(screen!=='listening'&&active&&!active.classList.contains('active')&&active.getAttribute('aria-current')!=='page')throw Error(label+':nav-active')}if(reduced&&theme!=='original'&&hasMotion(w,cta))throw Error(label+':reduced-motion');};
 for(const [width,height] of sizes){F.style.width=width+'px';F.style.height=height+'px';await wait(80);for(const theme of themes){w.FrenchTranquilleThemes.apply(theme);await wait(90);for(const screen of screens){await route(screen);await validate(width,height,theme,screen)}}}
 /* Supplemental legacy bridge audit: the two downstream cards that previously
    appeared as foreign black slabs must resolve to current Premium tokens. */
 F.style.width='1280px';F.style.height='800px';await wait(60);
 for(const theme of ['aurora','sunset','jade']){w.FrenchTranquilleThemes.apply(theme);await toHome();await w.FrenchTranquilleFieldNavigation.go('practice');await settle();const a=d.querySelector('body > .b27-practice-page [data-b27-practice-action="conversation"]');if(!a)throw Error(theme+':conversation-missing');a.click();await wait(280);const hub=d.querySelector('.screen-conversation .practice-session-hub');if(!vis(w,hub))throw Error(theme+':legacy-hub-hidden');const probe=d.createElement('i');probe.style.cssText='position:fixed;left:-9999px;border:1px solid var(--ft-border)';d.body.appendChild(probe);const token=w.getComputedStyle(probe).borderTopColor;probe.remove();const hs=w.getComputedStyle(hub);if(hs.borderTopColor!==token)throw Error(theme+':legacy-hub-border');if(hs.backgroundImage==='none')throw Error(theme+':legacy-hub-slab');}
 for(const k of keys)if(before[k]!==w.localStorage.getItem(k))throw Error('store:'+k);
 done(true,`cases=${sizes.length*themes.length*screens.length};viewports=5;themes=4;screens=5;reduced=${reduced?1:0};overflow=0;critical-clipping=0;contrast=pass;cta-gradient-contrast=pass;route-ownership=atomic;legacy-bridge=themed;stores=unchanged`);
}catch(e){done(false,e.message)}},3400);
setTimeout(()=>{if(!R.dataset.premiumV4GlobalQa)done(false,'timeout')},90000);
})();
</script></body></html>
