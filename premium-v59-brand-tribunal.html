(async()=>{const root=document.documentElement,out=document.getElementById('out');const fail=m=>{root.dataset.v59d='fail';root.dataset.v59dDetail=m;out.textContent='FAIL '+m;throw new Error(m)};const ok=(c,m)=>{if(!c)fail(m)};const load=(src,w,h)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{try{ok(i.naturalWidth===w&&i.naturalHeight===h,src+'-geometry');res()}catch(e){rej(e)}};i.onerror=()=>rej(new Error(src+'-load'));i.src=src+'?t=v59d'});try{const [manifest,index,sw]=await Promise.all([fetch('./manifest.webmanifest?t=v59d').then(r=>r.json()),fetch('./index.html?t=v59d').then(r=>r.text()),fetch('./sw.js?t=v59d').then(r=>r.text())]);const icons=manifest.icons||[];ok(icons.some(i=>i.src.includes('goat-app-icon-192.webp')&&i.sizes==='192x192'&&i.purpose==='any'),'manifest-192');ok(icons.some(i=>i.src.includes('goat-app-icon-512.webp')&&i.sizes==='512x512'&&i.purpose==='any'),'manifest-512');ok(icons.some(i=>i.src.includes('goat-app-icon-maskable-512.webp')&&i.sizes==='512x512'&&i.purpose==='maskable'),'manifest-maskable');ok(index.includes('goat-favicon-32.png'),'index-favicon');ok(index.includes('goat-app-icon-180.png'),'index-apple');for(const n of ['premium-v59-interactions','premium-v59-lesson-layout','premium-v59-system','goat-favicon-32.png','goat-app-icon-180.png','goat-app-icon-192.webp','goat-app-icon-512.webp','goat-app-icon-maskable-512.webp'])ok(sw.includes(n),'sw-'+n);await Promise.all([load('./assets/premium/brand/goat-favicon-32.png',32,32),load('./assets/premium/brand/goat-app-icon-180.png',180,180),load('./assets/premium/brand/goat-app-icon-192.webp',192,192),load('./assets/premium/brand/goat-app-icon-512.webp',512,512),load('./assets/premium/brand/goat-app-icon-maskable-512.webp',512,512)]);root.dataset.v59d='ok';out.textContent='PASS V5.9D brand';}catch(e){if(root.dataset.v59d!=='fail')fail(e.message||String(e))}})();
