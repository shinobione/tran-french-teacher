name: JavaScript quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for f in app.js curriculum-stage2.js curriculum-stage3.js stage2-boot.js debug-fr.js voice-ios.js free-voice.js learning-memory.js language-ratio-core.js language-ratio.js daily-coach.js mastery-engine.js mastery-stage3.js scenario-data.js scenario-host.js scenario-engine.js error-intelligence.js listening-data.js listening-engine.js build-meta.js; do node --check "$f"; done

      - name: Current curriculum contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('curriculum-stage3.js','utf8');
          const lessons=[...s.matchAll(/id:'(l(?:2[6-9]|3[0-9]|40))'/g)].map(m=>m[1]);
          if(lessons.length!==15||new Set(lessons).size!==15)throw new Error('Stage3 must remain 15 unique lessons');
          const blocks=s.split(/\n\s*\{\n\s*id:'l/).slice(1);let total=0;
          for(const b of blocks){const area=(b.split('items:[')[1]||'').split('],')[0];const n=(area.match(/\{id:'/g)||[]).length;if(n!==6)throw new Error('Stage3 lesson lost 6-item contract');total+=n}
          if(total!==90)throw new Error(`Expected 90 Stage3 items, got ${total}`);
          console.log('40-lesson curriculum base remains valid');
          NODE

      - name: Adaptive Language pure decision contract
        run: |
          node <<'NODE'
          const core=require('./language-ratio-core.js');
          const beginner={curriculum:{completed:1,total:40,known:4,totalItems:238},memory:{reviewed:0,solid:0,fragile:0,due:0},listening:{attempts:0,correct:0},practice:{conversationWins:0,scenarioSuccesses:0},errors:{recent:0,recurring:0,assisted:0}};
          const strong={curriculum:{completed:36,total:40,known:220,totalItems:238},memory:{reviewed:190,solid:170,fragile:5,due:3},listening:{attempts:20,correct:18},practice:{conversationWins:12,scenarioSuccesses:10},errors:{recent:1,recurring:0,assisted:0}};
          const fragile={curriculum:{completed:36,total:40,known:220,totalItems:238},memory:{reviewed:190,solid:120,fragile:80,due:20},listening:{attempts:20,correct:16},practice:{conversationWins:12,scenarioSuccesses:10},errors:{recent:12,recurring:5,assisted:4}};
          const a=core.profileFor(beginner),b=core.profileFor(strong),c=core.profileFor(fragile);
          if(a.id!=='vi-heavy')throw new Error(`Beginner should be vi-heavy, got ${a.id}`);
          if(b.id!=='fr-growing')throw new Error(`Strong should be fr-growing, got ${b.id}`);
          if(c.id!=='vi-support')throw new Error(`Fragile should retreat to vi-support, got ${c.id}`);
          if(!(c.vi>b.vi))throw new Error('Fragile profile must restore more Vietnamese than strong profile');
          const home=core.ratioFor(b,'home'),lesson=core.ratioFor(b,'lesson-new'),listening=core.ratioFor(b,'listening'),safety=core.ratioFor(b,'safety');
          if(!(lesson.vi>home.vi))throw new Error('New lesson must restore more VI than Home');
          if(!(listening.vi<home.vi))throw new Error('Listening instructions should allow less VI for strong evidence');
          if(safety.vi<70)throw new Error('Safety context must keep VI floor >=70');
          console.log('Language decision contract OK:',a.id,b.id,c.id,'strong score',b.evidence.score);
          NODE

      - name: Adaptive Language wiring guard
        run: |
          grep -q 'FrenchTranquilleLanguageCore' language-ratio-core.js
          grep -q 'FrenchTranquilleLanguage' language-ratio.js
          grep -q 'VI-HEAVY' docs/BUILD-21-ADAPTIVE-LANGUAGE.md
          grep -q 'FR-GROWING' docs/BUILD-21-ADAPTIVE-LANGUAGE.md
          grep -q "context='daily'" daily-coach.js
          grep -q "context='scenario'" scenario-engine.js
          grep -q "scenario-hint" scenario-engine.js
          grep -q "context='listening'" listening-engine.js
          grep -q 'label:option.vi' listening-engine.js
          grep -q 'language-ratio.css' index.html
          grep -q 'language-ratio-core.js' index.html
          grep -q 'language-ratio.js' index.html
          grep -q 'language-ratio.css' sw.js
          grep -q 'language-ratio-core.js' sw.js
          grep -q 'language-ratio.js' sw.js
          grep -q "version: '1.14.0', build: 21" build-meta.js
          grep -q 'FrenchTranquilleLanguageCore' build-meta.js
          grep -q 'FrenchTranquilleLanguage' build-meta.js
          grep -q '1.14.0-b21' index.html
          grep -q '1.14.0-b21' sw.js

      - name: Existing systems guard
        run: |
          grep -q "french-tranquille:learning-memory:v1" learning-memory.js
          grep -q "french-tranquille:listening:v1" listening-engine.js
          grep -q "'listening-miss'" error-intelligence.js
          grep -q 'MAX_ITEM_EVENTS = 20' error-intelligence.js
          grep -q 'MAX_RECENT_EVENTS = 120' error-intelligence.js
          grep -q "french-tranquille:scenarios:v1" scenario-engine.js
          grep -q 'FrenchTranquilleMasteryStage3' mastery-stage3.js

      - name: Documentation guard
        run: |
          test -f docs/BUILD-21-ADAPTIVE-LANGUAGE.md
          grep -q 'v1.14.0' README.md
          grep -q 'Build 21' README.md
          grep -q 'Build 21' ROADMAP.md
          grep -q 'Build 21' CHANGELOG.md
          grep -q 'language-ratio-core.js' docs/ARCHITECTURE.md
          grep -q 'language-ratio.js' docs/ARCHITECTURE.md
          grep -q 'Documentation obligatoire' docs/BUILD-POLICY.md

      - name: Listening data non-regression
        run: |
          node <<'NODE'
          global.window=global;require('./listening-data.js');const d=global.FrenchTranquilleListeningData;if(!d||d.contrasts.length<10||d.dialogues.length<8)throw new Error('Listening data regression');console.log('Listening data OK');
          NODE

      - name: Scenario data non-regression
        run: |
          node <<'NODE'
          global.window=global;require('./scenario-data.js');const s=global.FrenchTranquilleScenarioData?.scenarios||[];if(s.length!==12||s.some(x=>x.turns.length<3))throw new Error('Scenario regression');console.log('Scenario data OK');
          NODE

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-http.log 2>&1 &
          echo $! >/tmp/ft-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome beginner language profile
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/?languageSmoke=beginner' >/tmp/lang-beginner.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status' /tmp/lang-beginner.html; then cat /tmp/lang-beginner.html; exit 1; fi
          grep -q 'language-profile-card' /tmp/lang-beginner.html
          grep -q 'data-language-smoke-profile="vi-heavy"' /tmp/lang-beginner.html
          grep -q 'data-language-smoke-lesson-vi="95"' /tmp/lang-beginner.html
          grep -q 'Lucie giữ tiếng Việt' /tmp/lang-beginner.html
          echo 'Beginner language profile OK'

      - name: Chrome strong language profile
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/?languageSmoke=strong' >/tmp/lang-strong.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status' /tmp/lang-strong.html; then cat /tmp/lang-strong.html; exit 1; fi
          grep -q 'data-language-smoke-profile="fr-growing"' /tmp/lang-strong.html
          grep -q 'data-language-smoke-lesson-vi="45"' /tmp/lang-strong.html
          grep -q 'Lucie garde le vietnamien' /tmp/lang-strong.html
          echo 'Strong language profile OK'

      - name: Chrome fragile profile retreats
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/?languageSmoke=fragile' >/tmp/lang-fragile.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status' /tmp/lang-fragile.html; then cat /tmp/lang-fragile.html; exit 1; fi
          grep -q 'data-language-smoke-profile="vi-support"' /tmp/lang-fragile.html
          grep -q 'data-language-smoke-lesson-vi="85"' /tmp/lang-fragile.html
          echo 'Fragile profile retreat OK'

      - name: Chrome Listening consumes strong profile
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=17000 --dump-dom 'http://127.0.0.1:4173/?languageSmoke=strong&listeningSmoke=1' >/tmp/lang-listening.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/lang-listening.html; then cat /tmp/lang-listening.html; exit 1; fi
          grep -q 'listening-overlay' /tmp/lang-listening.html
          grep -q 'Compréhension orale' /tmp/lang-listening.html
          grep -q 'data-listening-smoke-hidden="1"' /tmp/lang-listening.html
          grep -q 'data-listening-smoke-revealed="1"' /tmp/lang-listening.html
          grep -q 'data-listening-smoke-error-type="listening-miss"' /tmp/lang-listening.html
          echo 'Listening adaptive language + hidden transcript OK'

      - name: Chrome current-system non-regression
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4173/ >/tmp/home.html
          grep -q 'A0 → A1 • 40 bài' /tmp/home.html
          grep -q '40. Cảm xúc, nhu cầu & Jerry' /tmp/home.html
          grep -q 'listening-home-card' /tmp/home.html
          grep -q 'mastery-stage3-chip' /tmp/home.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=14000 --dump-dom 'http://127.0.0.1:4173/?scenarioSmoke=1' >/tmp/scenario.html
          grep -q 'scenario-lab-card' /tmp/scenario.html
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=17000 --dump-dom 'http://127.0.0.1:4173/?errorSmoke=1' >/tmp/error.html
          grep -q 'data-error-smoke-item-events="20"' /tmp/error.html
          grep -q 'data-error-smoke-recent-events="120"' /tmp/error.html
          echo 'Current systems non-regression OK'

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-server.pid ]; then kill "$(cat /tmp/ft-server.pid)" || true; fi
