name: French Trân'quille quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax — full active runtime
        run: |
          for f in app.js progress-safety.js curriculum-stage2.js curriculum-stage3.js stage2-boot.js debug-fr.js voice-ios.js free-voice.js learning-memory.js error-intelligence.js language-ratio-core.js language-ratio.js daily-coach.js mastery-engine.js mastery-stage3.js scenario-data.js real-life-data.js real-life-data-2.js scenario-host.js scenario-engine.js real-life-ux.js listening-data.js listening-engine.js ux-shell.js build-meta.js sw.js; do
            node --check "$f"
          done

      - name: Sanctuaries — branding and validated iPhone voice baseline
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"

      - name: Curriculum + Real Life II data contract
        run: |
          node <<'NODE'
          const store=new Map();
          global.localStorage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
          const app={innerHTML:''};
          global.window=global;
          global.document={querySelector:s=>s==='#app'?app:null,querySelectorAll:()=>[],getElementById:id=>id==='app'?app:null,addEventListener:()=>{},createElement:()=>({className:'',dataset:{},innerHTML:'',appendChild(){},prepend(){},remove(){},querySelector(){return null},querySelectorAll(){return[]}})};
          global.navigator={};global.confirm=()=>false;global.requestAnimationFrame=fn=>fn();global.queueMicrotask=fn=>fn();global.MutationObserver=class{observe(){}};global.window.addEventListener=()=>{};global.window.scrollTo=()=>{};
          require('./app.js');require('./curriculum-stage2.js');require('./curriculum-stage3.js');
          const c=global.FrenchTranquilleCurriculum;
          if(!c||c.lessons.length!==40||c.items.length!==241)throw new Error(`Curriculum mismatch ${c?.lessons?.length}/${c?.items?.length}`);
          const itemIds=new Set(c.items.map(x=>x.id));
          if(itemIds.size!==241)throw new Error('Duplicate curriculum item IDs');
          require('./scenario-data.js');require('./real-life-data.js');require('./real-life-data-2.js');
          const all=global.FrenchTranquilleScenarioData.scenarios;
          const p1=global.FrenchTranquilleRealLife1;
          const p2=global.FrenchTranquilleRealLife2;
          if(all.length!==28)throw new Error(`Expected 28 scenarios, got ${all.length}`);
          if(all.reduce((n,s)=>n+s.turns.length,0)!==84)throw new Error('Expected 84 total turns');
          if(p1.scenarios.length!==6||p1.scenarios.reduce((n,s)=>n+s.turns.length,0)!==18)throw new Error('Pack I regression');
          if(p2.scenarios.length!==10||p2.scenarios.reduce((n,s)=>n+s.turns.length,0)!==30)throw new Error('Pack II mismatch');
          const ids=all.map(s=>s.id);
          if(new Set(ids).size!==ids.length)throw new Error('Duplicate scenario IDs');
          for(const s of p2.scenarios){
            if(!s.requiredLessons?.length||s.turns.length!==3)throw new Error(`${s.id}: bad shape`);
            for(const t of s.turns){
              if(!t.answers?.length||!t.model||!t.items?.length)throw new Error(`${s.id}: incomplete turn`);
              for(const id of t.items)if(!itemIds.has(id))throw new Error(`${s.id}: unknown curriculum item ${id}`);
            }
          }
          const completed=n=>new Set(Array.from({length:n},(_,i)=>`l${i+1}`));
          const open=(pack,n)=>pack.scenarios.filter(s=>s.requiredLessons.every(id=>completed(n).has(id)));
          if(open(p1,7).length!==5)throw new Error('Lesson-8 Pack I regression');
          if(open(p2,15).length!==5)throw new Error(`Lesson-15 expected 5 Pack II open, got ${open(p2,15).length}`);
          if(open(p2,20).length!==10)throw new Error(`Lesson-20 expected 10 Pack II open, got ${open(p2,20).length}`);
          console.log('Scenario contract OK: 28/84, Pack II 10/30, l15=5, l20=10');
          NODE

      - name: Error / Listening static contracts
        run: |
          grep -q 'MAX_ITEM_EVENTS = 20' error-intelligence.js
          grep -q 'MAX_RECENT_EVENTS = 120' error-intelligence.js
          grep -Fq 'const source=`listening-${currentExercise.family}`;' listening-engine.js

      - name: Build 24 wiring and docs
        run: |
          grep -q '1.17.0-b24' index.html
          grep -q '1.17.0-b24' sw.js
          grep -q "version: '1.17.0', build: 24" build-meta.js
          grep -q 'real-life-data-2.js' index.html sw.js
          grep -q 'real-life-jerry-2' real-life-data-2.js
          grep -q 'MAX_OPEN = 6' real-life-ux.js
          grep -q 'real-life-open-hidden' real-life-ux.css
          grep -q 'v1.17.0' README.md
          grep -q 'Build 24 — Real Life French II' README.md ROADMAP.md CHANGELOG.md docs/BUILD-24-REAL-LIFE-FRENCH-II.md
          grep -q '28 situations / 84 tours' README.md docs/BUILD-24-REAL-LIFE-FRENCH-II.md
          grep -q 'real-life-data-2.js' docs/ARCHITECTURE.md

      - name: Start static test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-http.log 2>&1 &
          echo $! >/tmp/ft-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — Home UX remains three-action shell
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom http://127.0.0.1:4173/ >/tmp/home.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/home.html; then cat /tmp/home.html; exit 1; fi
          grep -q 'app-shell screen-home' /tmp/home.html
          test "$(grep -o 'data-ux-nav=' /tmp/home.html | wc -l)" -eq 3
          grep -q 'brand-home-logo' /tmp/home.html

      - name: Chrome — preserve Trân lesson-8 progress
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8' >/tmp/lesson8.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/lesson8.html; then cat /tmp/lesson8.html; exit 1; fi
          for attr in 'completed="7"' 'next="l8"' 'l8="4"' 'known="40"' 'snapshot="1"' 'snapshot-l8="4"' 'nav-items="3"' 'logo="1"'; do grep -q "data-ux-smoke-$attr" /tmp/lesson8.html; done

      - name: Chrome — Real Life lesson 8 regression
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?realLifeSmoke=lesson8&scenarioSmoke=1' >/tmp/real-life-8.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/real-life-8.html; then cat /tmp/real-life-8.html; exit 1; fi
          grep -q 'data-real-life-ui-tiles="5"' /tmp/real-life-8.html
          grep -q 'data-real-life-pack2-open="0"' /tmp/real-life-8.html
          grep -q 'data-real-life-locked-visible="2"' /tmp/real-life-8.html
          grep -q 'data-real-life-technical-title="0"' /tmp/real-life-8.html

      - name: Chrome — Real Life lesson 15 staged unlock
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?realLifeSmoke=lesson15&scenarioSmoke=1' >/tmp/real-life-15.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/real-life-15.html; then cat /tmp/real-life-15.html; exit 1; fi
          grep -q 'data-real-life-pack2-open="5"' /tmp/real-life-15.html
          grep -q 'data-real-life-open-total="11"' /tmp/real-life-15.html
          grep -q 'data-real-life-open-visible="6"' /tmp/real-life-15.html
          grep -q 'real-life-open-hidden' /tmp/real-life-15.html
          grep -q 'data-real-life-locked-visible="2"' /tmp/real-life-15.html

      - name: Chrome — Real Life lesson 20 full Pack II + first Pack III unlock
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=24000 --dump-dom 'http://127.0.0.1:4173/?realLifeSmoke=lesson20&scenarioSmoke=1' >/tmp/real-life-20.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/real-life-20.html; then cat /tmp/real-life-20.html; exit 1; fi
          grep -q 'data-real-life-pack2-open="10"' /tmp/real-life-20.html
          # Pack I+II plus the historical `appel-jerry` scene yield 17 personal scenes.
          # Build 26 adds its first oral-French Pack III scene at lesson 20, so the total is 18.
          grep -q 'data-real-life-pack3-open="1"' /tmp/real-life-20.html
          grep -q 'data-real-life-open-total="18"' /tmp/real-life-20.html
          grep -q 'data-real-life-open-visible="6"' /tmp/real-life-20.html
          grep -q 'real-life-open-hidden' /tmp/real-life-20.html
          grep -q 'Jerry' /tmp/real-life-20.html

      - name: Chrome — Error Intelligence 20/120
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?errorSmoke=1' >/tmp/error.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/error.html; then cat /tmp/error.html; exit 1; fi
          grep -q 'data-error-smoke-item-events="20"' /tmp/error.html
          grep -q 'data-error-smoke-recent-events="120"' /tmp/error.html
          grep -q 'data-error-smoke-partial="1"' /tmp/error.html

      - name: Chrome — Listening hidden then reveal
        run: |
          # Build 28 rejects partial learner objects. Seed the historical valid lesson-8
          # learner profile first, then let the Listening smoke add its test vocabulary.
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&listeningSmoke=1' >/tmp/listening.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/listening.html; then cat /tmp/listening.html; exit 1; fi
          grep -q 'data-listening-smoke-hidden="1"' /tmp/listening.html
          grep -q 'data-listening-smoke-revealed="1"' /tmp/listening.html
          grep -q 'data-listening-smoke-attempts="1"' /tmp/listening.html

      - name: Chrome — Adaptive Language profiles
        run: |
          for mode in beginner strong fragile; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:4173/?languageSmoke=$mode" >"/tmp/language-$mode.html"
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "/tmp/language-$mode.html"; then cat "/tmp/language-$mode.html"; exit 1; fi
          done
          grep -q 'data-language-smoke-profile="vi-heavy"' /tmp/language-beginner.html
          grep -q 'data-language-smoke-profile="fr-growing"' /tmp/language-strong.html
          grep -q 'data-language-smoke-profile="vi-support"' /tmp/language-fragile.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-server.pid ]; then kill "$(cat /tmp/ft-server.pid)" || true; fi
