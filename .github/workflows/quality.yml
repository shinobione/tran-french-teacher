name: JavaScript quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check app.js
          node --check curriculum-stage2.js
          node --check stage2-boot.js
          node --check debug-fr.js
          node --check voice-ios.js
          node --check free-voice.js
          node --check build-meta.js
          node --check learning-memory.js
          node --check daily-coach.js
          node --check mastery-engine.js
          node --check scenario-data.js
          node --check scenario-host.js
          node --check scenario-engine.js
          node --check error-intelligence.js

      - name: Curriculum UX guard
        run: |
          grep -q 'Build 12 — curriculum UX' styles.css
          grep -q 'max-height:clamp(360px,52vh,570px)' styles.css
          grep -q 'position:sticky' styles.css

      - name: Learning Memory guard
        run: |
          grep -q "french-tranquille:learning-memory:v1" learning-memory.js
          grep -q 'data-memory-rate' learning-memory.js
          grep -q 'french-tranquille-backup' learning-memory.js
          grep -q 'learning-memory.css' index.html
          grep -q 'learning-memory.js' index.html
          grep -q 'learning-memory.js' sw.js

      - name: UX Visual Pass guard
        run: |
          grep -q 'v1.7.1 Build 14' visual-pass.css
          grep -q '.screen-conversation .narrow' visual-pass.css
          grep -q '.screen-review .flashcard' visual-pass.css
          grep -q '.memory-progress-card' visual-pass.css
          grep -q 'visual-pass.css' index.html
          grep -q 'visual-pass.css' sw.js
          grep -q 'lucie-avatar.css' index.html
          grep -q 'lucie-avatar.css' sw.js

      - name: Build 15 A0 to A1 guard
        run: |
          grep -q "id:'l16'" curriculum-stage2.js
          grep -q "id:'l25'" curriculum-stage2.js
          grep -q "Je suis prête" curriculum-stage2.js
          grep -q "J'ai une réservation" curriculum-stage2.js
          grep -q "Il n'y a pas d'eau chaude" curriculum-stage2.js
          grep -q "Qu'est-ce que tu fais" curriculum-stage2.js
          grep -q 'CORE.lessons.push' curriculum-stage2.js
          grep -q 'CORE.items = ' curriculum-stage2.js
          grep -q 'curriculum-stage2.css' index.html
          grep -q 'curriculum-stage2.js' index.html
          grep -q 'stage2-boot.js' index.html
          grep -q 'curriculum-stage2.js' sw.js
          grep -q 'stage2-boot.js' sw.js
          grep -q '25 leçons / 148 éléments' README.md

      - name: Daily Coach guard
        run: |
          grep -q 'daily-coach-card' daily-coach.js
          grep -q 'Séance du jour' daily-coach.js
          grep -q 'Rythme conseillé' daily-coach.js
          grep -q 'daily-coach.css' index.html
          grep -q 'daily-coach.js' index.html
          grep -q 'daily-coach.css' sw.js
          grep -q 'daily-coach.js' sw.js

      - name: Build 16 Mastery Engine guard
        run: |
          grep -q 'Survie A0' mastery-engine.js
          grep -q 'Fondations A1' mastery-engine.js
          grep -q 'Premiers échanges A1' mastery-engine.js
          grep -q 'mastery-home-card' mastery-engine.js
          grep -q 'mastery-progress-card' mastery-engine.js
          grep -q 'FrenchTranquilleMastery' mastery-engine.js
          grep -q 'mastery-engine.css' index.html
          grep -q 'mastery-engine.js' index.html
          grep -q 'mastery-engine.css' sw.js
          grep -q 'mastery-engine.js' sw.js

      - name: Build 17 Scenario catalog contract
        run: |
          node <<'NODE'
          global.window = global;
          require('./scenario-data.js');
          const data = global.FrenchTranquilleScenarioData;
          if (!data || data.version !== '1.10.0' || data.build !== 17) throw new Error('Scenario Data contract changed unexpectedly');
          const scenarios = data.scenarios || [];
          if (scenarios.length !== 12) throw new Error(`Expected 12 scenarios, got ${scenarios.length}`);
          const ids = scenarios.map(s => s.id);
          if (new Set(ids).size !== ids.length) throw new Error('Scenario IDs must be unique');
          for (const scenario of scenarios) {
            if (!Array.isArray(scenario.requiredLessons) || !scenario.requiredLessons.length) throw new Error(`${scenario.id}: missing requiredLessons`);
            if (!Array.isArray(scenario.turns) || scenario.turns.length < 3) throw new Error(`${scenario.id}: expected >= 3 turns`);
            for (const [index,turn] of scenario.turns.entries()) {
              if (!turn.npcFr || !turn.npcVi || !turn.promptVi || !turn.promptFr) throw new Error(`${scenario.id} turn ${index+1}: missing prompt/NPC text`);
              if (!Array.isArray(turn.answers) || !turn.answers.length) throw new Error(`${scenario.id} turn ${index+1}: missing accepted answers`);
              if (!turn.model || !turn.hintVi || !turn.hintFr) throw new Error(`${scenario.id} turn ${index+1}: missing model/hint`);
              if (!Array.isArray(turn.items) || !turn.items.length) throw new Error(`${scenario.id} turn ${index+1}: missing curriculum item links`);
            }
          }
          console.log('Scenario catalog OK:', scenarios.length, 'scenarios /', scenarios.reduce((n,s)=>n+s.turns.length,0), 'turns');
          NODE

      - name: Build 17 Scenario Lab guard
        run: |
          grep -q "french-tranquille:scenarios:v1" scenario-engine.js
          grep -q 'scenario-lab-card' scenario-engine.js
          grep -q 'scenario-progress-card' scenario-engine.js
          grep -q 'scenario-success' scenario-engine.js
          grep -q 'scenario-miss' scenario-engine.js
          grep -q 'scenario-assisted' scenario-engine.js
          grep -q 'scenarioSmoke' scenario-engine.js
          grep -q 'scenario-host' scenario-host.js
          grep -q 'scenario-engine.css' index.html
          grep -q 'scenario-data.js' index.html
          grep -q 'scenario-host.js' index.html
          grep -q 'scenario-engine.js' index.html
          grep -q 'scenario-engine.css' sw.js
          grep -q 'scenario-data.js' sw.js
          grep -q 'scenario-host.js' sw.js
          grep -q 'scenario-engine.js' sw.js
          grep -q '12 situations / 36 tours' README.md

      - name: Build 18 Error Intelligence contract
        run: |
          grep -q "french-tranquille:error-intelligence:v1" error-intelligence.js
          grep -q 'MAX_ITEM_EVENTS = 20' error-intelligence.js
          grep -q 'MAX_RECENT_EVENTS = 120' error-intelligence.js
          grep -q 'REPEAT_WINDOW = 30' error-intelligence.js
          grep -q "'retrieval-difficult'" error-intelligence.js
          grep -q "'scenario-miss'" error-intelligence.js
          grep -q "'assisted'" error-intelligence.js
          grep -q "'voice-unrecognized'" error-intelligence.js
          grep -q "'partial'" error-intelligence.js
          grep -q 'recordRecovery' error-intelligence.js
          grep -q 'priorityItems' error-intelligence.js
          grep -q 'error-intelligence-card' error-intelligence.js
          grep -q 'error-daily-focus' error-intelligence.js
          grep -q 'french-tranquille-error-intelligence' error-intelligence.js
          grep -q 'errorSmoke' error-intelligence.js
          grep -q "version:'1.11.0'" error-intelligence.js
          grep -q 'build:18' error-intelligence.js

      - name: Build 18 Free Voice evidence bridge
        run: |
          grep -q "const VERSION='1.11.0', BUILD=18" free-voice.js
          grep -q 'FrenchTranquilleMemory.*recordPractice' free-voice.js
          grep -q 'FrenchTranquilleErrors.*recordAttempt' free-voice.js
          grep -q 'free-voice-voice' README.md
          grep -q 'free-voice-text' README.md
          grep -q 'recordEvidence' free-voice.js
          grep -q "evaluate(best,'voice')" free-voice.js
          grep -q "'text'))" free-voice.js

      - name: Build 18 wiring and version guard
        run: |
          grep -q 'error-intelligence.css' index.html
          grep -q 'error-intelligence.js' index.html
          grep -q 'error-intelligence.css' sw.js
          grep -q 'error-intelligence.js' sw.js
          grep -q "version: '1.11.0', build: 18" build-meta.js
          grep -q '1.11.0-b18' index.html
          grep -q '1.11.0-b18' sw.js
          grep -q 'v1.11.0' README.md
          grep -q 'Build 18' README.md

      - name: Documentation governance guard
        run: |
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILD-POLICY.md
          grep -q 'Build 18 — Error Intelligence' ROADMAP.md
          grep -q 'Build 19 — Curriculum' ROADMAP.md
          grep -q 'Build 18 — Error Intelligence' CHANGELOG.md
          grep -q 'error-intelligence.js' docs/ARCHITECTURE.md
          grep -q 'french-tranquille:error-intelligence:v1' docs/ARCHITECTURE.md
          grep -q 'MAX_ITEM_EVENTS' docs/ARCHITECTURE.md
          grep -q 'Documentation obligatoire' docs/BUILD-POLICY.md
          grep -q 'ROADMAP.md' README.md
          grep -q 'CHANGELOG.md' README.md

      - name: Node base-engine render smoke test
        run: |
          node <<'NODE'
          const store = new Map();
          global.localStorage = {
            getItem: k => store.has(k) ? store.get(k) : null,
            setItem: (k,v) => store.set(k,String(v)),
            removeItem: k => store.delete(k)
          };
          const app = { innerHTML: '' };
          global.document = {
            querySelector(sel){ return sel === '#app' ? app : null; },
            querySelectorAll(){ return []; }
          };
          global.window = global;
          global.window.scrollTo = () => {};
          global.window.addEventListener = () => {};
          global.navigator = {};
          global.confirm = () => false;
          require('./app.js');
          if (!app.innerHTML || app.innerHTML.length < 500) throw new Error('Base home render produced no meaningful HTML');
          if (!app.innerHTML.includes('A0 • 15 bài')) throw new Error('Base engine should still render its 15 native lessons before Stage 2 boot');
          if (!app.innerHTML.includes('Ngày đầu tiên ở Pháp')) throw new Error('Base lesson 15 was not rendered');
          console.log('Node base-engine home render OK:', app.innerHTML.length, 'chars');
          NODE

      - name: Start static test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/french-tranquille-http.log 2>&1 &
          echo $! > /tmp/french-tranquille-server.pid
          sleep 1
          google-chrome --version

      - name: Real Chrome Home smoke test
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=12000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/french-tranquille-home.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status' /tmp/french-tranquille-home.html; then
            cat /tmp/french-tranquille-home.html
            echo 'Startup screen or fatal screen is still rendered inside #app.'
            exit 1
          fi
          grep -q 'app-shell screen-home' /tmp/french-tranquille-home.html
          grep -q 'home-dashboard' /tmp/french-tranquille-home.html
          grep -q 'A0 → A1 • 25 bài' /tmp/french-tranquille-home.html
          grep -q 'memory-home-card' /tmp/french-tranquille-home.html
          grep -q 'daily-coach-card' /tmp/french-tranquille-home.html
          grep -q 'mastery-home-card' /tmp/french-tranquille-home.html
          echo 'Real Chrome Home OK'

      - name: Real Chrome Scenario Lab smoke test
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=12000 \
            --dump-dom \
            'http://127.0.0.1:4173/?scenarioSmoke=1' > /tmp/french-tranquille-scenarios.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/french-tranquille-scenarios.html; then
            cat /tmp/french-tranquille-scenarios.html
            exit 1
          fi
          grep -q 'app-shell screen-conversation' /tmp/french-tranquille-scenarios.html
          grep -q 'scenario-host' /tmp/french-tranquille-scenarios.html
          grep -q 'scenario-lab-card' /tmp/french-tranquille-scenarios.html
          grep -q 'Phòng tình huống' /tmp/french-tranquille-scenarios.html
          grep -q 'Ở quán cà phê' /tmp/french-tranquille-scenarios.html
          grep -q 'Trò chuyện xã giao' /tmp/french-tranquille-scenarios.html
          echo 'Real Chrome Scenario Lab OK'

      - name: Real Chrome Error Intelligence smoke test
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=15000 \
            --dump-dom \
            'http://127.0.0.1:4173/?errorSmoke=1' > /tmp/french-tranquille-errors.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/french-tranquille-errors.html; then
            cat /tmp/french-tranquille-errors.html
            echo 'Rendered fatal screen detected in Error Intelligence.'
            exit 1
          fi
          grep -q 'app-shell screen-progress' /tmp/french-tranquille-errors.html
          grep -q 'error-intelligence-card' /tmp/french-tranquille-errors.html
          grep -q 'Trí tuệ lỗi' /tmp/french-tranquille-errors.html
          grep -q 'Bonjour' /tmp/french-tranquille-errors.html
          grep -q 'data-error-smoke-item-events="20"' /tmp/french-tranquille-errors.html
          grep -q 'data-error-smoke-recent-events="120"' /tmp/french-tranquille-errors.html
          grep -E -q 'data-error-smoke-repeated="[1-9][0-9]*"' /tmp/french-tranquille-errors.html
          grep -q 'data-error-smoke-partial="1"' /tmp/french-tranquille-errors.html
          echo 'Real Chrome Error Intelligence OK: bounded storage + partial evidence + Progression render'

      - name: Stop static test server
        if: always()
        run: |
          if [ -f /tmp/french-tranquille-server.pid ]; then kill "$(cat /tmp/french-tranquille-server.pid)" || true; fi
