name: French Trân'quille quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax — full active runtime
        run: |
          for f in app.js progress-safety.js curriculum-stage2.js curriculum-stage3.js stage2-boot.js debug-fr.js voice-ios.js free-voice.js learning-memory.js error-intelligence.js language-ratio-core.js language-ratio.js daily-coach.js mastery-engine.js mastery-stage3.js scenario-data.js real-life-data.js scenario-host.js scenario-engine.js real-life-ux.js listening-data.js listening-engine.js ux-shell.js build-meta.js sw.js; do
            node --check "$f"
          done

      - name: Sanctuaries — branding and real iPhone voice baseline
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"

      - name: Curriculum — 40 lessons / 241 items
        run: |
          node <<'NODE'
          const store=new Map();
          global.localStorage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
          const app={innerHTML:''};
          global.window=global;
          global.document={querySelector:s=>s==='#app'?app:null,querySelectorAll:()=>[],getElementById:id=>id==='app'?app:null,addEventListener:()=>{},createElement:()=>({className:'',dataset:{},innerHTML:'',appendChild(){},prepend(){},remove(){},querySelector(){return null},querySelectorAll(){return[]}})};
          global.navigator={};global.confirm=()=>false;global.requestAnimationFrame=fn=>fn();global.queueMicrotask=fn=>fn();global.MutationObserver=class{observe(){}};global.window.addEventListener=()=>{};global.window.scrollTo=()=>{};
          require('./app.js');require('./curriculum-stage2.js');require('./curriculum-stage3.js');
          const c=global.FrenchTranquilleCurriculum;
          if(!c||c.lessons.length!==40||c.items.length!==241)throw new Error(`Curriculum mismatch ${c?.lessons?.length}/${c?.items?.length}`);
          if(new Set(c.lessons.map(x=>x.id)).size!==40)throw new Error('Duplicate lesson IDs');
          if(new Set(c.items.map(x=>x.id)).size!==241)throw new Error('Duplicate item IDs');
          NODE

      - name: Real Life data — 18 scenarios / 54 turns / valid acquired items
        run: |
          node <<'NODE'
          global.window=global;
          require('./scenario-data.js');
          require('./real-life-data.js');
          const api=global.FrenchTranquilleScenarioData;
          const pack=global.FrenchTranquilleRealLife1;
          if(api.scenarios.length!==18)throw new Error(`Expected 18 scenarios, got ${api.scenarios.length}`);
          if(api.scenarios.reduce((n,s)=>n+s.turns.length,0)!==54)throw new Error('Expected 54 turns');
          if(pack.scenarios.length!==6)throw new Error('Expected 6 Real Life scenarios');
          if(pack.scenarios.reduce((n,s)=>n+s.turns.length,0)!==18)throw new Error('Expected 18 Real Life turns');
          const completed=new Set(['l1','l2','l3','l4','l5','l6','l7']);
          const open=pack.scenarios.filter(s=>s.requiredLessons.every(id=>completed.has(id)));
          if(open.length!==5)throw new Error(`Lesson-8 profile should have 5 Real Life scenarios open, got ${open.length}`);
          const ids=pack.scenarios.map(s=>s.id);
          if(new Set(ids).size!==ids.length)throw new Error('Duplicate Real Life IDs');
          for(const s of pack.scenarios){
            if(!s.requiredLessons.length||s.turns.length!==3)throw new Error(`${s.id}: invalid shape`);
            for(const t of s.turns){
              if(!t.answers?.length||!t.model||!t.items?.length)throw new Error(`${s.id}: incomplete turn`);
            }
          }
          console.log('Real Life contract OK:',open.map(s=>s.id).join(', '));
          NODE

      - name: Error / Listening static contracts
        run: |
          grep -q 'MAX_ITEM_EVENTS = 20' error-intelligence.js
          grep -q 'MAX_RECENT_EVENTS = 120' error-intelligence.js
          grep -Fq 'const source=`listening-${currentExercise.family}`;' listening-engine.js

      - name: Build 23 wiring
        run: |
          grep -q '1.16.0-b23' index.html
          grep -q '1.16.0-b23' sw.js
          grep -q "version: '1.16.0', build: 23" build-meta.js
          grep -q 'real-life-data.js' index.html sw.js
          grep -q 'real-life-ux.js' index.html sw.js
          grep -q 'real-life-ux.css' index.html sw.js
          grep -q 'real-life-jerry-1' real-life-data.js
          grep -q 'Build 23 — Real Life French I' README.md ROADMAP.md CHANGELOG.md docs/BUILD-23-REAL-LIFE-FRENCH-I.md

      - name: Start static test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-http.log 2>&1 &
          echo $! >/tmp/ft-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — Home UX stays simple
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom http://127.0.0.1:4173/ >/tmp/home.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/home.html; then cat /tmp/home.html; exit 1; fi
          grep -q 'app-shell screen-home' /tmp/home.html
          test "$(grep -o 'data-ux-nav=' /tmp/home.html | wc -l)" -eq 3
          grep -q 'brand-home-logo' /tmp/home.html

      - name: Chrome — preserve Trân lesson-8 progress
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8' >/tmp/lesson8.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/lesson8.html; then cat /tmp/lesson8.html; exit 1; fi
          for attr in 'completed="7"' 'next="l8"' 'l8="4"' 'known="40"' 'snapshot="1"' 'snapshot-l8="4"' 'nav-items="3"' 'logo="1"'; do grep -q "data-ux-smoke-$attr" /tmp/lesson8.html; done

      - name: Chrome — Real Life lesson-8 experience
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?realLifeSmoke=lesson8&scenarioSmoke=1' >/tmp/real-life.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/real-life.html; then cat /tmp/real-life.html; exit 1; fi
          grep -q 'screen-conversation' /tmp/real-life.html
          grep -q 'data-real-life-ui-tiles="5"' /tmp/real-life.html
          grep -q 'data-real-life-locked-visible="2"' /tmp/real-life.html
          grep -q 'data-real-life-ready-label="1"' /tmp/real-life.html
          grep -q 'data-real-life-technical-title="0"' /tmp/real-life.html
          grep -q 'Jerry nói quá nhanh' /tmp/real-life.html
          grep -q 'Uống cà phê với Jerry' /tmp/real-life.html
          grep -q 'real-life-badge' /tmp/real-life.html
          grep -q 'real-life-locked-hidden' /tmp/real-life.html

      - name: Chrome — Error Intelligence 20/120
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?errorSmoke=1' >/tmp/error.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/error.html; then cat /tmp/error.html; exit 1; fi
          grep -q 'data-error-smoke-item-events="20"' /tmp/error.html
          grep -q 'data-error-smoke-recent-events="120"' /tmp/error.html
          grep -q 'data-error-smoke-partial="1"' /tmp/error.html

      - name: Chrome — Listening hidden then reveal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=22000 --dump-dom 'http://127.0.0.1:4173/?listeningSmoke=1' >/tmp/listening.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/listening.html; then cat /tmp/listening.html; exit 1; fi
          grep -q 'data-listening-smoke-hidden="1"' /tmp/listening.html
          grep -q 'data-listening-smoke-revealed="1"' /tmp/listening.html
          grep -q 'data-listening-smoke-attempts="1"' /tmp/listening.html

      - name: Chrome — Adaptive Language profiles
        run: |
          for mode in beginner strong fragile; do
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:4173/?languageSmoke=$mode" >"/tmp/language-$mode.html"
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "/tmp/language-$mode.html"; then cat "/tmp/language-$mode.html"; exit 1; fi
          done
          grep -q 'data-language-smoke-profile="vi-heavy"' /tmp/language-beginner.html
          grep -q 'data-language-smoke-profile="fr-growing"' /tmp/language-strong.html
          grep -q 'data-language-smoke-profile="vi-support"' /tmp/language-fragile.html

      - name: Documentation governance
        run: |
          grep -q 'v1.16.0' README.md
          grep -q '40 leçons / 241 éléments' README.md
          grep -q 'Real Life French I' README.md ROADMAP.md CHANGELOG.md docs/ARCHITECTURE.md docs/BUILD-23-REAL-LIFE-FRENCH-I.md
          grep -q 'ancien utilisateur' docs/BUILD-POLICY.md

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-server.pid ]; then kill "$(cat /tmp/ft-server.pid)" || true; fi
