name: JavaScript quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check debug-fr.js
          node --check voice-ios.js
          node --check free-voice.js
      - name: Node render smoke test
        run: |
          node <<'NODE'
          const store = new Map();
          global.localStorage = {
            getItem: k => store.has(k) ? store.get(k) : null,
            setItem: (k,v) => store.set(k,String(v)),
            removeItem: k => store.delete(k)
          };
          const app = { innerHTML: '' };
          global.document = {
            querySelector(sel){ return sel === '#app' ? app : null; },
            querySelectorAll(){ return []; }
          };
          global.window = global;
          global.window.scrollTo = () => {};
          global.window.addEventListener = () => {};
          global.navigator = {};
          global.confirm = () => false;
          require('./app.js');
          if (!app.innerHTML || app.innerHTML.length < 500) {
            throw new Error('Home render produced no meaningful HTML');
          }
          if (!app.innerHTML.includes('A0 • 15 bài')) {
            throw new Error('Expected 15-lesson curriculum badge was not rendered');
          }
          if (!app.innerHTML.includes('Ngày đầu tiên ở Pháp')) {
            throw new Error('Lesson 15 was not rendered');
          }
          console.log('Node home render OK:', app.innerHTML.length, 'chars');
          NODE
      - name: Real Chrome browser smoke test
        run: |
          google-chrome --version
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/french-tranquille-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:4173/ > /tmp/french-tranquille-dom.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status' /tmp/french-tranquille-dom.html; then
            cat /tmp/french-tranquille-dom.html
            echo 'Startup screen or fatal screen is still rendered inside #app.'
            exit 1
          fi
          grep -E -q 'id="app"[^>]*><div class="app-shell screen-home"' /tmp/french-tranquille-dom.html
          grep -q 'home-dashboard' /tmp/french-tranquille-dom.html
          grep -q 'A0 • 15 bài' /tmp/french-tranquille-dom.html
          grep -q 'Ngày đầu tiên ở Pháp' /tmp/french-tranquille-dom.html
          echo 'Real Chrome home render OK'