name: French Trân'quille nav click smoke

on:
  push:
    branches: [hotfix-nav-clicks]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nav-click-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build physical-click harness
        run: |
          cat > nav-click-smoke.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Nav click smoke</title></head><body>
          <script>
          (() => {
            const frame=document.createElement('iframe');
            frame.src='./index.html?debug=fr';
            frame.style.cssText='width:1650px;height:780px;border:0';
            document.body.appendChild(frame);
            let done=false;
            const root=document.documentElement;
            const finish=(status,detail='')=>{if(done)return;done=true;root.dataset.navSmoke=status;root.dataset.navDetail=detail};
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const describe=el=>el?`${el.tagName.toLowerCase()}.${String(el.className||'').replace(/\s+/g,'.')}[${el.getAttribute('data-ux-nav')||''}]`:'null';
            function physicalClick(d,selector,label){
              const button=d.querySelector(selector);
              if(!button)throw new Error(`${label}:button-missing`);
              const r=button.getBoundingClientRect();
              const x=r.left+r.width/2,y=r.top+r.height/2;
              const hit=d.elementFromPoint(x,y);
              root.dataset[`nav${label}Hit`]=describe(hit);
              if(!hit||!button.contains(hit))throw new Error(`${label}:hit-${describe(hit)}`);
              hit.dispatchEvent(new frame.contentWindow.MouseEvent('click',{bubbles:true,cancelable:true,view:frame.contentWindow,clientX:x,clientY:y}));
            }
            frame.addEventListener('load',()=>setTimeout(async()=>{
              try{
                const d=frame.contentDocument,w=frame.contentWindow;
                if(!d.querySelector('.app-shell.screen-home'))throw new Error('home-missing');
                w.scrollTo(0,d.documentElement.scrollHeight);
                await wait(300);
                root.dataset.navScrollY=String(Math.round(w.scrollY));

                const before=d.querySelector('[data-ux-nav="practice"]');
                const probe=d.createElement('i'); probe.hidden=true; probe.textContent='probe';
                d.querySelector('#app')?.appendChild(probe);
                await wait(180);
                const after=d.querySelector('[data-ux-nav="practice"]');
                root.dataset.navNodeStable=String(before===after);
                probe.remove();
                await wait(120);
                if(before!==after)throw new Error('nav-node-replaced-on-app-mutation');

                physicalClick(d,'[data-ux-nav="practice"]','Practice');
                await wait(350);
                if(!d.querySelector('.ux-practice-overlay'))throw new Error('practice-did-not-open');
                d.querySelector('[data-ux-close]')?.click();
                await wait(250);
                if(d.querySelector('.ux-practice-overlay'))throw new Error('practice-did-not-close');

                w.scrollTo(0,d.documentElement.scrollHeight);
                await wait(250);
                physicalClick(d,'[data-ux-nav="progress"]','Progress');
                await wait(450);
                if(!d.querySelector('.app-shell.screen-progress'))throw new Error('progress-did-not-open');

                w.scrollTo(0,d.documentElement.scrollHeight);
                await wait(250);
                physicalClick(d,'[data-ux-nav="home"]','Home');
                await wait(450);
                if(!d.querySelector('.app-shell.screen-home'))throw new Error('home-did-not-return');

                finish('ok','stable-nav-and-scrolled-physical-clicks-ok');
              }catch(e){finish('fail',e?.message||String(e))}
            },1800));
            setTimeout(()=>finish('fail','timeout'),9000);
          })();
          </script></body></html>
          HTML

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-nav-http.log 2>&1 &
          echo $! >/tmp/ft-nav-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — stable physical bottom-nav clicks after scroll
        run: |
          timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/nav-click-smoke.html' >/tmp/nav.html
          grep -q 'data-nav-smoke="ok"' /tmp/nav.html || { cat /tmp/nav.html; exit 1; }
          grep -q 'data-nav-node-stable="true"' /tmp/nav.html
          grep -q 'data-nav-detail="stable-nav-and-scrolled-physical-clicks-ok"' /tmp/nav.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-nav-server.pid ]; then kill "$(cat /tmp/ft-nav-server.pid)" || true; fi
