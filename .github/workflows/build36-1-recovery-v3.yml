name: Build 36.1 Recovery v3 contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-v3-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and pure Recovery v3 contract
        run: |
          node --check src/core/data-recovery-v3-contract.js
          node --check tests/smoke/build36-recovery-v3-smoke.js
          node tests/smoke/build36-recovery-v3-smoke.js

      - name: Historical Recovery and Build 35 proof chain remains green
        run: |
          node tools/test-build28-data-recovery.cjs
          node tests/smoke/build35-memory-evidence-v2-smoke.js
          node tests/smoke/build35-memory-evidence-v2-transaction-smoke.js
          node tests/smoke/build35-closeout-smoke.js

      - name: Build 36.1 contract remains explicit under successor adoption
        run: |
          ! grep -q 'french-tranquille:memory-evidence:v2' src/core/data-recovery-core.js
          grep -q 'const BACKUP_VERSION = 2' src/core/data-recovery-core.js
          grep -q 'const BACKUP_VERSION = 3' src/core/data-recovery-v3-contract.js
          grep -q "role: SHADOW_ROLE" src/core/data-recovery-v3-contract.js
          grep -q 'evidence-source-mismatch' src/core/data-recovery-v3-contract.js
          grep -q 'preserveMissingIds' src/core/data-recovery-v3-contract.js
          grep -q 'rebuildDerivedIds' src/core/data-recovery-v3-contract.js
          if test -f src/core/data-recovery-v3-runtime-core.js && grep -q 'data-recovery-v3-runtime-core.js' index.html; then
            grep -q 'data-recovery-v3-contract.js?v=2.4.0-b36.2' index.html
            grep -q 'data-recovery-v3-runtime-core.js?v=2.4.0-b36.2' index.html
            grep -q 'data-recovery-v3-contract.js' sw.js
            grep -q 'data-recovery-v3-runtime-core.js' sw.js
          else
            ! grep -q 'data-recovery-v3-contract.js' index.html
            ! grep -q 'data-recovery-v3-contract.js' sw.js
          fi

      - name: Legacy source validators and product writers remain byte-identical except authorized Listening successors
        run: |
          test "$(git hash-object src/core/data-recovery-core.js)" = "10dc84bb71b82c62b5f169f52c6bd95c88b308f9"
          test "$(git hash-object src/pedagogy/memory-evidence-v2-core.js)" = "b85bea27be07289902df76079a9ace76451c720d"
          test "$(git hash-object src/pedagogy/learning-memory.js)" = "be19abde268a78b8bfd140a0d94e99a4990dda65"
          test "$(git hash-object src/pedagogy/error-intelligence.js)" = "060a7db49b72a58c8a6a6c0055efa484f9d9f604"
          test "$(git hash-object src/pedagogy/scenario-engine.js)" = "8bd6d67fa87cb2fd41fa44d0e48dbd342c137a53"
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
