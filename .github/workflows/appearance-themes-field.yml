name: Appearance themes + Listening nav

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  appearance-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: |
          node --check theme-controller.js
          grep -q 'theme-controller.js?v=2.3.12-v4coherence1' index.html
          grep -q '2.3.12-v4coherence1' theme-controller.js
          grep -q 'premium-v4-home.css?v=2.3.6-v4home2' premium-theme-polish.css
          grep -q 'premium-v4-progress.css?v=2.3.7-v4progress1' premium-theme-polish.css
          grep -q 'premium-v4-practice.css?v=2.3.8-v4practice1' premium-theme-polish.css
          grep -q 'premium-v4-listening.css?v=2.3.9-v4listening1' premium-theme-polish.css
          grep -q 'premium-v4-settings.css?v=2.3.10-v4settings1' premium-theme-polish.css
          grep -q 'premium-v4-ownership-hotfix.css?v=2.3.11-v4ownership1' premium-theme-polish.css
          grep -q 'premium-v4-route-coherence.css?v=2.3.12-v4coherence1' premium-theme-polish.css
          grep -q -- '--pv4-home-ready:1' premium-v4-home.css
          grep -q -- '--pv4-progress-ready:1' premium-v4-progress.css
          grep -q -- '--pv4-practice-ready:1' premium-v4-practice.css
          grep -q -- '--pv4-listening-ready:1' premium-v4-listening.css
          grep -q -- '--pv4-settings-ready:1' premium-v4-settings.css
          grep -q -- '--pv4-route-coherence-ready:1' premium-v4-route-coherence.css
          grep -q ':has(body > .b27-overlay)' premium-v4-route-coherence.css
          grep -q ':has(body > .listening-overlay)' premium-v4-route-coherence.css
          grep -q 'practice-session-hub' premium-v4-route-coherence.css
          grep -q 'scenario-lab-card' premium-v4-route-coherence.css
          grep -q 'intermediate-opacity' premium-v4-transition-tribunal.html
          grep -q 'underlay-visible' premium-v4-transition-tribunal.html
          grep -q 'hub-not-themed' premium-v4-transition-tribunal.html
          grep -q 'scenario-lab-not-themed' premium-v4-transition-tribunal.html
          grep -q 'b27-practice-open' premium-v4-ownership-hotfix.css
          grep -q 'visibility:hidden!important' premium-v4-ownership-hotfix.css
          grep -q 'home-visible-under-practice' premium-v4-practice-tribunal.html
          grep -q 'home-not-restored-after-practice' premium-v4-practice-tribunal.html
          grep -q '#ft-settings-legal' premium-v4-settings.css
          grep -q 'data-reset' premium-v4-settings-tribunal.html
          grep -q 'desktop-not-two-column' premium-v4-home-tribunal.html
          grep -q 'desktop-not-two-column' premium-v4-progress-tribunal.html
          grep -q 'desktop-not-two-column' premium-v4-practice-tribunal.html
          grep -q 'desktop-not-two-column' premium-v4-listening-tribunal.html
          grep -q 'desktop-not-two-column' premium-v4-settings-tribunal.html
          grep -q "listeningNormalRate!=='0.88'" premium-v4-listening-tribunal.html
          grep -q "listeningSlowRate!=='0.65'" premium-v4-listening-tribunal.html
          grep -q "listeningEngineSlowRate!=='0.68'" premium-v4-listening-tribunal.html
          test "$(git hash-object premium-theme-polish-v2-base.css)" = "b5578b1fae55426f06eac30e227d94cf4dfb2491"
          grep -q 'Original is intentionally untouched' premium-depth-pass.css
          grep -q 'Original remains the visual witness' premium-v4-route-coherence.css
          grep -q 'prefers-reduced-motion:reduce' premium-v4-settings.css
          ! grep -q 'francais-avec-luc:learner:v1' theme-controller.js
          ! grep -q 'francais-avec-luc:learner:v1' premium-v4-settings.css
          ! grep -q 'francais-avec-luc:learner:v1' premium-v4-ownership-hotfix.css
          ! grep -q 'francais-avec-luc:learner:v1' premium-v4-route-coherence.css
      - name: Voice and learner sanctuaries remain exact
        run: |
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object field-audio-session.js)" = "06ca40074b345d77b8fc0c46fdb73ab35ffa2cd3"
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/appearance-http.log 2>&1 &
          echo $! >/tmp/appearance-http.pid
          sleep 1
      - name: Chrome — themes logo and Listening nav
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/appearance-field-smoke.html' >/tmp/appearance-field.html
          grep -q 'data-appearance-field-smoke="ok"' /tmp/appearance-field.html || { cat /tmp/appearance-field.html; exit 1; }
      - name: Chrome — Premium V4 Home viewport tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom 'http://127.0.0.1:4173/premium-v4-home-tribunal.html' >/tmp/premium-v4-home-tribunal.html
          grep -q 'data-premium-v4-home-tribunal="ok"' /tmp/premium-v4-home-tribunal.html || { cat /tmp/premium-v4-home-tribunal.html; exit 1; }
      - name: Chrome — Premium V4 Progress viewport tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=32000 --dump-dom 'http://127.0.0.1:4173/premium-v4-progress-tribunal.html' >/tmp/premium-v4-progress-tribunal.html
          grep -q 'data-premium-v4-progress-tribunal="ok"' /tmp/premium-v4-progress-tribunal.html || { cat /tmp/premium-v4-progress-tribunal.html; exit 1; }
      - name: Chrome — Premium V4 Practice viewport tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=32000 --dump-dom 'http://127.0.0.1:4173/premium-v4-practice-tribunal.html' >/tmp/premium-v4-practice-tribunal.html
          grep -q 'data-premium-v4-practice-tribunal="ok"' /tmp/premium-v4-practice-tribunal.html || { cat /tmp/premium-v4-practice-tribunal.html; exit 1; }
      - name: Chrome — Premium V4 Listening viewport tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=32000 --dump-dom 'http://127.0.0.1:4173/premium-v4-listening-tribunal.html' >/tmp/premium-v4-listening-tribunal.html
          grep -q 'data-premium-v4-listening-tribunal="ok"' /tmp/premium-v4-listening-tribunal.html || { cat /tmp/premium-v4-listening-tribunal.html; exit 1; }
      - name: Chrome — Premium V4 atomic transition compositor tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=52000 --dump-dom 'http://127.0.0.1:4173/premium-v4-transition-tribunal.html' >/tmp/premium-v4-transition-tribunal.html
          grep -q 'data-premium-v4-transition-tribunal="ok"' /tmp/premium-v4-transition-tribunal.html || { cat /tmp/premium-v4-transition-tribunal.html; exit 1; }
      - name: Chrome — Premium V4 Settings viewport tribunal
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=36000 --dump-dom 'http://127.0.0.1:4173/premium-v4-settings-tribunal.html' >/tmp/premium-v4-settings-tribunal.html
          grep -q 'data-premium-v4-settings-tribunal="ok"' /tmp/premium-v4-settings-tribunal.html || { cat /tmp/premium-v4-settings-tribunal.html; exit 1; }
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/appearance-http.pid ]; then kill "$(cat /tmp/appearance-http.pid)" || true; fi
