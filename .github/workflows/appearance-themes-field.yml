name: Appearance themes + Listening nav

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  appearance-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static contracts
        run: |
          node --check src/core/theme-controller.js
          grep -q 'src/core/theme-controller.js?v=2.3.21-v57art1' index.html
          grep -q "version:'1.3.0-v57art'" src/core/theme-controller.js
          grep -q './premium-v4-home.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-progress.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-practice.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-listening.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-settings.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-ownership-hotfix.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-route-coherence.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-motion.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v4-contrast.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-coherence.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-listening-settings.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-utility.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-islands.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-mockup-convergence.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-fidelity-reset.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-fidelity-refine.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-fidelity-card-hotfix.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q -- '--pv4-home-ready:1' src/premium/premium-v4-home.css
          grep -q -- '--pv4-progress-ready:1' src/premium/premium-v4-progress.css
          grep -q -- '--pv4-practice-ready:1' src/premium/premium-v4-practice.css
          grep -q -- '--pv4-listening-ready:1' src/premium/premium-v4-listening.css
          grep -q -- '--pv4-settings-ready:1' src/premium/premium-v4-settings.css
          grep -q -- '--pv4-route-coherence-ready:1' src/premium/premium-v4-route-coherence.css
          grep -q -- '--pv4-motion-ready:1' src/premium/premium-v4-motion.css
          grep -q -- '--pv4-contrast-ready:1' src/premium/premium-v4-contrast.css
          grep -q -- '--pv5-coherence-ready:1' src/premium/premium-v5-coherence.css
          grep -q -- '--pv5-utility-ready:1' src/premium/premium-v5-utility.css
          grep -q -- '--pv53-islands-ready:1' src/premium/premium-v5-islands.css
          grep -q -- '--pv54-mockup-ready:1' src/premium/premium-v5-mockup-convergence.css
          grep -q -- '--pv55-ready:1' src/premium/premium-v5-fidelity-reset.css
          grep -q -- '--pv55-refine-ready:1' src/premium/premium-v5-fidelity-refine.css
          grep -q 'pv5-debug-rail-h' src/premium/premium-v5-utility.css
          grep -q 'color:#071531' src/premium/premium-v4-contrast.css
          grep -q 'color:#140b28' src/premium/premium-v4-contrast.css
          grep -q 'color:#041511' src/premium/premium-v4-contrast.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v4-motion.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v5-coherence.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v5-utility.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v5-islands.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v5-mockup-convergence.css
          grep -q 'pv4-confirm-pulse' src/premium/premium-v4-motion.css
          grep -q 'route-motion=0' tests/browser/premium-v4-motion-tribunal.html
          grep -q ':has(body > .b27-overlay)' src/premium/premium-v4-route-coherence.css
          grep -q ':has(body > .listening-overlay)' src/premium/premium-v4-route-coherence.css
          grep -q 'practice-session-hub' src/premium/premium-v4-route-coherence.css
          grep -q 'scenario-lab-card' src/premium/premium-v4-route-coherence.css
          grep -q 'intermediate-opacity' tests/browser/premium-v4-transition-tribunal.html
          grep -q 'underlay-visible' tests/browser/premium-v4-transition-tribunal.html
          grep -q 'hub-not-themed' tests/browser/premium-v4-transition-tribunal.html
          grep -q 'scenario-lab-not-themed' tests/browser/premium-v4-transition-tribunal.html
          grep -q 'b27-practice-open' src/premium/premium-v4-ownership-hotfix.css
          grep -q 'visibility:hidden!important' src/premium/premium-v4-ownership-hotfix.css
          grep -q 'home-visible-under-practice' tests/browser/premium-v4-practice-tribunal.html
          grep -q 'home-not-restored-after-practice' tests/browser/premium-v4-practice-tribunal.html
          grep -q '#ft-settings-legal' src/premium/premium-v4-settings.css
          grep -q 'data-reset' tests/browser/premium-v4-settings-tribunal.html
          grep -q 'desktop-not-two-column' tests/browser/premium-v4-home-tribunal.html
          grep -q 'desktop-not-two-column' tests/browser/premium-v4-progress-tribunal.html
          grep -q 'desktop-not-two-column' tests/browser/premium-v4-practice-tribunal.html
          grep -q 'desktop-not-two-column' tests/browser/premium-v4-listening-tribunal.html
          grep -q 'desktop-not-two-column' tests/browser/premium-v4-settings-tribunal.html
          grep -q "listeningNormalRate!=='0.88'" tests/browser/premium-v4-listening-tribunal.html
          grep -q "listeningSlowRate!=='0.65'" tests/browser/premium-v4-listening-tribunal.html
          grep -q "listeningEngineSlowRate!=='0.68'" tests/browser/premium-v4-listening-tribunal.html
          test "$(git hash-object src/premium/premium-theme-polish-v2-base.css)" = "b5578b1fae55426f06eac30e227d94cf4dfb2491"
          grep -q 'V5.7 extends the same depth grammar to Original' src/premium/premium-depth-pass.css
          grep -q 'V5.7 extends the same atomic route ownership to Original' src/premium/premium-v4-route-coherence.css
          ! grep -q 'francais-avec-luc:learner:v1' src/core/theme-controller.js
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v4-settings.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v4-ownership-hotfix.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v4-route-coherence.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v4-motion.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v4-contrast.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v5-coherence.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v5-utility.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v5-islands.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v5-mockup-convergence.css
      - name: Voice and learner sanctuaries remain exact
        run: |
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object src/core/field-audio-session.js)" = "06ca40074b345d77b8fc0c46fdb73ab35ffa2cd3"
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/appearance-http.log 2>&1 &
          echo $! >/tmp/appearance-http.pid
          sleep 1
      - name: Chrome — themes logo and Listening nav
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom 'http://127.0.0.1:4173/tests/browser/appearance-field-smoke.html' >/tmp/appearance-field.html
          grep -q 'data-appearance-field-smoke="ok"' /tmp/appearance-field.html || { cat /tmp/appearance-field.html; exit 1; }
      - name: Chrome — legacy Premium V4/V5 visual tribunals
        run: |
          if [ -f src/premium/premium-v5-fidelity-reset.css ]; then
            echo 'V5.5 successor owns active visual geometry; historical V4/V5 static contracts remain guarded above.'
            exit 0
          fi
          for spec in \
            'tests/browser/premium-v4-home-tribunal.html data-premium-v4-home-tribunal="ok" 30000' \
            'tests/browser/premium-v4-progress-tribunal.html data-premium-v4-progress-tribunal="ok" 32000' \
            'tests/browser/premium-v4-practice-tribunal.html data-premium-v4-practice-tribunal="ok" 32000' \
            'tests/browser/premium-v4-listening-tribunal.html data-premium-v4-listening-tribunal="ok" 32000' \
            'tests/browser/premium-v4-settings-tribunal.html data-premium-v4-settings-tribunal="ok" 36000' \
            'tests/browser/premium-v5-coherence-tribunal.html data-premium-v5-coherence="ok" 46000' \
            'tests/browser/premium-v5-utility-tribunal.html data-premium-v5-utility="ok" 42000'; do
            set -- $spec; page="$1"; marker="$2"; budget="$3"
            out="/tmp/${page}"
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-background-timer-throttling --disable-renderer-backgrounding --virtual-time-budget="$budget" --dump-dom "http://127.0.0.1:4173/$page" >"$out"
            grep -q "$marker" "$out" || { cat "$out"; exit 1; }
          done
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=52000 --dump-dom 'http://127.0.0.1:4173/tests/browser/premium-v4-transition-tribunal.html' >/tmp/premium-v4-transition-tribunal.html
          grep -q 'data-premium-v4-transition-tribunal="ok"' /tmp/premium-v4-transition-tribunal.html || { cat /tmp/premium-v4-transition-tribunal.html; exit 1; }
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 --dump-dom 'http://127.0.0.1:4173/tests/browser/premium-v4-motion-tribunal.html' >/tmp/premium-v4-motion-tribunal.html
          grep -q 'data-premium-v4-motion-tribunal="ok"' /tmp/premium-v4-motion-tribunal.html
          grep -q 'local-motion=enabled' /tmp/premium-v4-motion-tribunal.html
          google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion --virtual-time-budget=30000 --dump-dom 'http://127.0.0.1:4173/tests/browser/premium-v4-motion-tribunal.html' >/tmp/premium-v4-motion-reduced.html
          grep -q 'data-premium-v4-motion-tribunal="ok"' /tmp/premium-v4-motion-reduced.html
          grep -q 'local-motion=disabled' /tmp/premium-v4-motion-reduced.html
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/appearance-http.pid ]; then kill "$(cat /tmp/appearance-http.pid)" || true; fi
