name: Build 37.6 diagnostic

on:
  push:
    branches: [build37/f08-regular-er]

permissions:
  contents: read

jobs:
  diagnose-f08-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b376-diag-http.log 2>&1 &
          echo $! >/tmp/ft-b376-diag-server.pid
          sleep 1
      - name: Dump F08 VI desktop tribunal state
        run: |
          set -u
          profile=/tmp/ft-b376-diag-profile
          file=/tmp/b376-diag.html
          rm -rf "$profile" "$file"
          timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
            --user-data-dir="$profile" --window-size=1280,900 --virtual-time-budget=10000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/build37-6-foundations-regular-er.html?debug=vi' >"$file" || true
          echo '--- b376 root state ---'
          grep -o 'data-b376-[^ >]*="[^"]*"' "$file" || true
          echo '--- explicit error ---'
          grep -o 'data-b376-error="[^"]*"' "$file" || true
          echo '--- relevant visible text ---'
          grep -o '<h3>[^<]*</h3>' "$file" | tail -10 || true
          if grep -q 'data-b376-done="1"' "$file" && ! grep -q 'data-b376-error=' "$file"; then
            echo 'DIAGNOSTIC CASE PASSED'
          else
            echo 'DIAGNOSTIC CASE FAILED'
            exit 1
          fi
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b376-diag-server.pid ]; then kill "$(cat /tmp/ft-b376-diag-server.pid)" || true; fi
