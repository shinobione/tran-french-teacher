name: Field reliability V2 — router + lesson audio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  field-reliability-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static contracts
        run: |
          node --check src/core/stage2-boot.js
          node --check src/core/field-navigation-runtime.js
          node --check src/core/field-audio-session.js
          ! grep -q 'mediarecorder-ios-compat' src/core/stage2-boot.js
          ! grep -q 'navigation-field-hotfix' src/core/stage2-boot.js
          ! grep -q 'localStorage.setItem' src/core/field-audio-session.js
          ! grep -q 'localStorage.setItem' src/core/field-navigation-runtime.js
          grep -q 'stopImmediatePropagation' src/core/field-navigation-runtime.js
          grep -q 'waitGone' src/core/field-navigation-runtime.js
          grep -q '#app .b27-page' src/core/field-navigation-runtime.js
          grep -q 'requestData' src/core/field-audio-session.js
          grep -q 'new Blob(s.chunks' src/core/field-audio-session.js
          grep -q 'data-field-audio-play' src/core/field-audio-session.js
          grep -Fq '.speaking-loop-actions[hidden][aria-hidden="true"]{display:none!important}' src/pedagogy/speaking-loop-content.css
          grep -q 'singleVoiceRecordControl' tests/browser/single-voice-record-control-smoke.html
          grep -q 'limit=3200' tests/browser/field-audio-browser-smoke.html
          grep -q 'observeNode' tests/browser/field-audio-browser-smoke.html
          grep -q 'play=observed' tests/browser/field-audio-browser-smoke.html
          grep -q "finish(false,'timeout')},14000" tests/browser/field-audio-browser-smoke.html

      - name: Sanctuaries remain exact
        run: |
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-field-v2-http.log 2>&1 &
          echo $! >/tmp/ft-field-v2-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — exactly one visible lesson record control
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=3000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/single-voice-record-control-smoke.html' >/tmp/single-voice-record.html
          grep -q 'data-single-voice-record-control="ok"' /tmp/single-voice-record.html || { cat /tmp/single-voice-record.html; exit 1; }
          grep -Eq 'data-single-voice-visible-count="[01]"' /tmp/single-voice-record.html || { cat /tmp/single-voice-record.html; exit 1; }
          grep -q 'data-single-voice-legacy-display="none"' /tmp/single-voice-record.html || { cat /tmp/single-voice-record.html; exit 1; }

      - name: Chrome — lesson recording survives DOM rerender and creates playback
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --virtual-time-budget=18000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/field-audio-browser-smoke.html?fieldAudioV2=1' >/tmp/field-audio-v2.html
          grep -q 'data-field-audio-browser-smoke="ok"' /tmp/field-audio-v2.html || { cat /tmp/field-audio-v2.html; exit 1; }
          grep -Eq 'data-field-audio-blob-bytes="[1-9][0-9]*"' /tmp/field-audio-v2.html || { cat /tmp/field-audio-v2.html; exit 1; }

      - name: Chrome — repeated Practice Listening Home Progress route transaction
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=36000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/field-navigation-v2-smoke.html' >/tmp/field-nav-v2.html
          grep -q 'data-field-navigation-v2-smoke="ok"' /tmp/field-nav-v2.html || { cat /tmp/field-nav-v2.html; exit 1; }

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-field-v2-server.pid ]; then kill "$(cat /tmp/ft-field-v2-server.pid)" || true; fi
