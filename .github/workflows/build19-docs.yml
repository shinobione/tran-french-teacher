name: Build19 one-shot docs

on:
  push:
    branches: [build19-a1-core]

permissions:
  contents: write

jobs:
  docs:
    if: "!contains(github.event.head_commit.message, '[build19-docs]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build19-a1-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update canonical docs
        run: python tools/build19-docs.py
      - name: Remove one-shot docs helpers
        run: |
          rm -f .github/workflows/build19-docs.yml
          rm -f tools/build19-docs.py
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'Build 19 synchronize canonical docs [build19-docs]'
          git push origin HEAD:build19-a1-core
