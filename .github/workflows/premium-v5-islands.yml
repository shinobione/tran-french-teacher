name: Premium V5.3 Pedagogical Islands

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pedagogical-islands:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Static V5.3 contracts and sanctuaries
        run: |
          grep -q -- '--pv53-islands-ready:1' src/premium/premium-v5-islands.css
          grep -q '.speaking-loop-card' src/premium/premium-v5-islands.css
          grep -q '.voice-replay-panel' src/premium/premium-v5-islands.css
          grep -q '.session-success' src/premium/premium-v5-islands.css
          grep -q '.scenario-lab-card' src/premium/premium-v5-islands.css
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v5-islands.css
          grep -q './premium-v5-islands.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          grep -q './premium-v5-utility.css?v=2.3.21-v57art1' src/premium/premium-theme-polish.css
          test "$(tail -n 1 src/premium/premium-theme-polish.css)" = "@import url('./premium-nav-geometry-hotfix.css?v=2.3.21-v57art1');"
          # Historical V5.3 owns its island layer and precache survivability.
          # The newest Premium slice owns the active cache/controller identity.
          grep -q "const V5I='2.3.21-v57art1'" sw.js
          grep -q 'src/premium/premium-v5-islands.css?v=${V5I}' sw.js
          grep -q 'premiumV5Islands' tests/browser/premium-v5-islands-tribunal.html
          grep -q 'scenario=real-runner-themed' tests/browser/premium-v5-islands-tribunal.html
          grep -q 'data-capture-surface=.oral' tests/browser/premium-v5-islands-fixture.html
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object src/core/field-audio-session.js)" = "06ca40074b345d77b8fc0c46fdb73ab35ffa2cd3"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v53-http.log 2>&1 &
          echo $! >/tmp/ft-v53-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — V5.3 pedagogical island tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 80s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=50000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/premium-v5-islands-tribunal.html' > /tmp/v53-islands.html
          grep -q 'data-premium-v5-islands="ok"' /tmp/v53-islands.html || { grep -o 'data-premium-v5-islands-detail="[^"]*"' /tmp/v53-islands.html || true; exit 1; }
          grep -q 'speaking=themed' /tmp/v53-islands.html
          grep -q 'voice-replay=themed' /tmp/v53-islands.html
          grep -q 'session=themed' /tmp/v53-islands.html
          grep -q 'scenario=real-runner-themed' /tmp/v53-islands.html
          grep -q 'stores=unchanged' /tmp/v53-islands.html
          grep -q 'original=parity' /tmp/v53-islands.html

      - name: Chrome — V5.3 reduced-motion tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 80s \
            google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=50000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/premium-v5-islands-tribunal.html' > /tmp/v53-islands-reduced.html
          grep -q 'data-premium-v5-islands="ok"' /tmp/v53-islands-reduced.html || { grep -o 'data-premium-v5-islands-detail="[^"]*"' /tmp/v53-islands-reduced.html || true; exit 1; }
          grep -q 'scenario=real-runner-themed' /tmp/v53-islands-reduced.html

      - name: Capture V5.3 pedagogical island visual review
        run: |
          mkdir -p artifacts/premium-v5-islands
          capture() {
            label="$1"; dims="$2"; theme="$3"; surface="$4"
            profile="/tmp/ft-v53-${label}-${theme}-${surface}"
            png="artifacts/premium-v5-islands/${label}-${theme}-${surface}.png"
            dom="/tmp/v53-${label}-${theme}-${surface}.html"
            rm -rf "$profile" "$png" "$dom"
            if [ "$surface" = oral ]; then
              url="http://127.0.0.1:4173/tests/browser/premium-v5-islands-fixture.html?theme=${theme}"
            else
              url="http://127.0.0.1:4173/tests/browser/premium-v5-islands-visual-capture.html?theme=${theme}&surface=${surface}"
            fi
            timeout --signal=TERM --kill-after=5s 50s \
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size="$dims" --virtual-time-budget=22000 \
              --screenshot="$png" --dump-dom "$url" >"$dom"
            test -s "$png"
            grep -q 'data-capture-ready="1"' "$dom" || { grep -o 'data-capture-error="[^"]*"' "$dom" || true; exit 1; }
            grep -q "data-capture-theme=\"${theme}\"" "$dom"
            grep -q "data-capture-surface=\"${surface}\"" "$dom"
          }
          for spec in 'mobile 390,844' 'desktop 1440,900'; do
            set -- $spec; label="$1"; dims="$2"
            for theme in aurora sunset jade; do
              capture "$label" "$dims" "$theme" oral
              capture "$label" "$dims" "$theme" scenario
            done
          done
          test "$(find artifacts/premium-v5-islands -name '*.png' | wc -l)" -eq 12

      - name: Upload V5.3 visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-v5-islands-visual-review
          path: artifacts/premium-v5-islands/*.png
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v53-server.pid ]; then kill "$(cat /tmp/ft-v53-server.pid)" || true; fi
