name: Temporary Build 37.1 checkpoint reconciler

on:
  push:
    branches:
      - 'build37/foundations-core-contract'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build37/foundations-core-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile docs
        run: python3 tools/tmp-reconcile-build37-checkpoint.py
      - name: Commit docs and remove temporary helpers
        run: |
          git config user.name 'French Trân’quille CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-build37-checkpoint-reconcile.yml tools/tmp-reconcile-build37-checkpoint.py
          git add PROJECT-STATE.md MASTER-ROADMAP.md
          git commit -m 'Docs: reconcile Build 37.1 active checkpoint'
          git push origin HEAD:build37/foundations-core-contract
