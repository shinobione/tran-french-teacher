name: Build 39.2 Learner evidence adapter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  learner-evidence-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax + 39.2 evidence contract
        run: |
          set -euo pipefail
          node --check src/pedagogy/learner-evidence-adapter.js
          node --check tests/unit/build39-2-evidence-adapter.test.cjs
          node tests/unit/build39-1-learner-action-core.test.cjs
          node tests/unit/build39-2-evidence-adapter.test.cjs
          ! grep -Eq 'localStorage|sessionStorage|indexedDB|FrenchTranquilleEvidence|fetch\(' src/pedagogy/learner-evidence-adapter.js
          ! grep -Eq 'window\.FrenchTranquilleMemory|window\.FrenchTranquilleErrors|window\.FrenchTranquilleListening|window\.FrenchTranquilleScenarios' src/pedagogy/learner-evidence-adapter.js
          grep -Fq "'no-durable-concept-evidence'" src/pedagogy/learner-evidence-adapter.js
          grep -Fq "'foundations-ephemeral-no-need-evidence'" src/pedagogy/learner-evidence-adapter.js
          grep -Fq "'transfer-ephemeral-no-durable-evidence'" src/pedagogy/learner-evidence-adapter.js
          grep -Fq "evidenceV2ReadCutover: false" src/pedagogy/learner-evidence-adapter.js

      - name: Existing release + Build38 predecessor remain certified
        run: |
          set -euo pipefail
          node tools/test-release-v2-5-build38.cjs
          node tools/test-build38-10-spoken-on-integration.cjs

      - name: 39.2 scope guard — pure adapter only
        if: github.event_name == 'pull_request' && github.head_ref == 'build39/evidence-adapter'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(src/pedagogy/learner-evidence-adapter\.js|tests/unit/build39-2-evidence-adapter\.test\.cjs|\.github/workflows/build39-2-evidence-adapter\.yml|docs/BUILD-39\.2-LEARNER-EVIDENCE-ADAPTER\.md|PROJECT-STATE\.md)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected path(s) in Build39.2 pure-adapter slice:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --exit-code "origin/${{ github.base_ref }}"...HEAD -- \
            app.js voice-ios.js free-voice.js assets/LOGO.png assets/Favicon.png \
            index.html sw.js manifest.webmanifest \
            src/core src/ui src/premium \
            src/pedagogy/learner-action-arbitration-core.js \
            src/pedagogy/learner-intelligence.js \
            src/pedagogy/learner-intelligence-v2.js \
            src/pedagogy/learner-intelligence-smoke.js \
            src/pedagogy/learning-memory.js \
            src/pedagogy/error-intelligence.js \
            src/pedagogy/listening-engine.js \
            src/pedagogy/scenario-engine.js \
            src/pedagogy/memory-evidence-v2-core.js \
            src/pedagogy/foundations-core.js \
            src/pedagogy/foundations-capsule-engine.js \
            src/pedagogy/generalization-transfer-core.js \
            src/pedagogy/generalization-transfer-lesson.js

      - name: Frozen sanctuaries stay byte-identical
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
