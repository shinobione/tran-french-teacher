name: Build 26.3 Interaction + Progress layout smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  interaction-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and Build 26.3 baseline wiring
        run: |
          node --check build26-3-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'build26-3-ux.css?v=1.19.3-b26.3' index.html
          grep -q 'build26-3-ux.js?v=1.19.3-b26.3' index.html
          grep -q "FrenchTranquilleBuild263UX" build-meta.js
          grep -q 'build26-3-ux.css' sw.js
          grep -q 'build26-3-ux.js' sw.js
          grep -q 'display:contents' build26-3-ux.css
          grep -q 'position:sticky' build26-3-ux.css
          grep -q 'data-b263-daily-action' build26-3-ux.js
          grep -q 'data-b263-daily-toggle' build26-3-ux.js

      - name: Learner, voice and branding sanctuaries
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b263-http.log 2>&1 &
          echo $! >/tmp/ft-b263-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — Today controls are stable and actually navigate
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b263-daily-profile-$attempt"
            file="/tmp/b263-daily-$attempt.html"
            rm -rf "$profile" "$file"
            echo "Build 26.3 Today smoke attempt $attempt"
            if ! timeout --signal=TERM --kill-after=5s 35s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=30000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=daily' >"$file"; then
              echo "Today Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then
              echo "Today attempt $attempt hit app boot error"
              continue
            fi
            if grep -q 'data-b263-daily-ready="1"' "$file" \
              && grep -q 'data-b263-smoke-more="1"' "$file" \
              && grep -q 'data-b263-smoke-toggle-stable="1"' "$file" \
              && grep -q 'data-b263-smoke-listening="1"' "$file" \
              && grep -q 'data-b263-smoke-review="1"' "$file" \
              && grep -q 'data-b263-smoke-lesson="1"' "$file" \
              && grep -q 'app-shell screen-lesson' "$file"; then
              passed=1
              break
            fi
            echo "Today attempt $attempt missing markers:"
            grep -o 'data-b263-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.3 Today smoke failed after 3 bounded isolated attempts'
            exit 1
          fi

      - name: Chrome desktop — two-column Progress baseline survives later polish
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b263-desktop-profile-$attempt"
            file="/tmp/b263-progress-desktop-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 35s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=28000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=progress' >"$file"; then
              echo "Desktop Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-progress' "$file" \
              && grep -q 'data-b263-smoke-progress="1"' "$file" \
              && grep -q 'data-b263-smoke-contents="1"' "$file" \
              && grep -q 'data-b263-smoke-desktop="1"' "$file" \
              && grep -q 'data-b263-smoke-details-open="1"' "$file" \
              && grep -q 'data-progress-current-lesson="l8"' "$file" \
              && grep -q 'data-progress-completed="7"' "$file" \
              && grep -q 'data-progress-known="40"' "$file" \
              && grep -q 'progress-detail-dashboard' "$file"; then
              passed=1
              break
            fi
            echo "Desktop attempt $attempt missing markers"
            grep -o 'data-b263-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.3 desktop layout baseline failed after 3 bounded isolated attempts'
            exit 1
          fi

      - name: Chrome mobile — summary, curriculum, then collapsed Details
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b263-mobile-profile-$attempt"
            file="/tmp/b263-progress-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 35s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=28000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=progress-mobile' >"$file"; then
              echo "Mobile Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-progress' "$file" \
              && grep -q 'data-b263-smoke-progress="1"' "$file" \
              && grep -q 'data-b263-smoke-contents="1"' "$file" \
              && grep -q 'data-b263-smoke-desktop="0"' "$file" \
              && grep -q 'data-b263-smoke-details-open="0"' "$file" \
              && grep -q 'data-progress-visible-rows="5"' "$file" \
              && grep -q 'data-progress-total-rows="40"' "$file"; then
              passed=1
              break
            fi
            echo "Mobile attempt $attempt missing markers"
            grep -o 'data-b263-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.3 mobile layout smoke failed after 3 bounded isolated attempts'
            exit 1
          fi

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b263-server.pid ]; then kill "$(cat /tmp/ft-b263-server.pid)" || true; fi
