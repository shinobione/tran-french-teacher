name: Build 26.3 Interaction + Progress layout smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  interaction-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, version and wiring
        run: |
          node --check build26-3-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'build26-3-ux.css?v=1.19.3-b26.3' index.html
          grep -q 'build26-3-ux.js?v=1.19.3-b26.3' index.html
          grep -q 'build-meta.js?v=1.19.3-b26.3' index.html
          grep -q "version: '1.19.3', build: '26.3'" build-meta.js
          grep -q "FrenchTranquilleBuild263UX" build-meta.js
          grep -q 'tran-french-teacher-v1.19.3-b26.3-interactions-progress-layout' index.html sw.js
          grep -q 'build26-3-ux.css' sw.js
          grep -q 'build26-3-ux.js' sw.js
          grep -q 'display:contents' build26-3-ux.css
          grep -q 'position:sticky' build26-3-ux.css
          grep -q 'data-b263-daily-action' build26-3-ux.js
          grep -q 'data-b263-daily-toggle' build26-3-ux.js

      - name: Learner, voice and branding sanctuaries
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b263-http.log 2>&1 &
          echo $! >/tmp/ft-b263-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — Today controls are stable and actually navigate
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=30000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=daily' >/tmp/b263-daily.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/b263-daily.html; then cat /tmp/b263-daily.html; exit 1; fi
          grep -q 'data-b263-daily-ready="1"' /tmp/b263-daily.html
          grep -q 'data-b263-smoke-more="1"' /tmp/b263-daily.html
          grep -q 'data-b263-smoke-toggle-stable="1"' /tmp/b263-daily.html
          grep -q 'data-b263-smoke-listening="1"' /tmp/b263-daily.html
          grep -q 'data-b263-smoke-review="1"' /tmp/b263-daily.html
          grep -q 'data-b263-smoke-lesson="1"' /tmp/b263-daily.html
          grep -q 'app-shell screen-lesson' /tmp/b263-daily.html

      - name: Chrome desktop — Paint layout is two-column and Details sticky
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=1280,900 --virtual-time-budget=28000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=progress' >/tmp/b263-progress-desktop.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/b263-progress-desktop.html; then cat /tmp/b263-progress-desktop.html; exit 1; fi
          grep -q 'app-shell screen-progress' /tmp/b263-progress-desktop.html
          grep -q 'data-b263-smoke-progress="1"' /tmp/b263-progress-desktop.html
          grep -q 'data-b263-smoke-contents="1"' /tmp/b263-progress-desktop.html
          grep -q 'data-b263-smoke-desktop="1"' /tmp/b263-progress-desktop.html
          grep -q 'data-b263-smoke-details-open="1"' /tmp/b263-progress-desktop.html
          grep -q 'data-b263-smoke-sticky="1"' /tmp/b263-progress-desktop.html
          grep -q 'data-progress-current-lesson="l8"' /tmp/b263-progress-desktop.html
          grep -q 'data-progress-completed="7"' /tmp/b263-progress-desktop.html
          grep -q 'data-progress-known="40"' /tmp/b263-progress-desktop.html
          grep -q 'progress-detail-dashboard' /tmp/b263-progress-desktop.html

      - name: Chrome mobile — summary, curriculum, then collapsed Details
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=28000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&b263Smoke=progress-mobile' >/tmp/b263-progress-mobile.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/b263-progress-mobile.html; then cat /tmp/b263-progress-mobile.html; exit 1; fi
          grep -q 'app-shell screen-progress' /tmp/b263-progress-mobile.html
          grep -q 'data-b263-smoke-progress="1"' /tmp/b263-progress-mobile.html
          grep -q 'data-b263-smoke-contents="1"' /tmp/b263-progress-mobile.html
          grep -q 'data-b263-smoke-desktop="0"' /tmp/b263-progress-mobile.html
          grep -q 'data-b263-smoke-details-open="0"' /tmp/b263-progress-mobile.html
          grep -q 'data-progress-visible-rows="5"' /tmp/b263-progress-mobile.html
          grep -q 'data-progress-total-rows="40"' /tmp/b263-progress-mobile.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b263-server.pid ]; then kill "$(cat /tmp/ft-b263-server.pid)" || true; fi
