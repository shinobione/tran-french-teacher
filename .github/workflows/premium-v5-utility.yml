name: Premium V5.2 Utility Coherence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  utility-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - name: Static V5.2 contracts and sanctuaries
        run: |
          grep -q -- '--pv5-utility-ready:1' premium-v5-utility.css
          grep -q '.ux-close' premium-v5-utility.css
          grep -q '.scenario-close' premium-v5-utility.css
          grep -q '.scenario-mic' premium-v5-utility.css
          grep -q 'progress-detail-panel-head button' premium-v5-utility.css
          grep -q '.scenario-listen' premium-v5-utility.css
          grep -q 'pv5-debug-rail-h' premium-v5-utility.css
          grep -q '.debug-fr-banner' premium-v5-utility.css
          grep -q 'body > .listening-overlay' premium-v5-utility.css
          grep -q 'prefers-reduced-motion:reduce' premium-v5-utility.css
          grep -q 'premium-v5-utility.css?v=2.3.17-v5utility1' premium-theme-polish.css
          grep -q 'premium-v5-coherence.css?v=2.3.16-v5coherence1' premium-theme-polish.css
          test "$(tail -n 1 premium-theme-polish.css)" = "@import url('./premium-nav-geometry-hotfix.css?v=2.3.4-p0nav1');"
          grep -q '2.3.17-v5utility1' theme-controller.js
          grep -q '2.3.17-b34.8-v5utility1' index.html sw.js
          grep -q "const V5U='2.3.17-v5utility1'" sw.js
          grep -q 'premium-v5-utility.css?v=${V5U}' sw.js
          grep -q 'premium-theme-polish.css?v=${V5U}' sw.js
          grep -q 'theme-controller.js?v=${V5U}' sw.js
          grep -q 'premiumV5Utility' premium-v5-utility-tribunal.html
          grep -q 'debug-rail=reserved' premium-v5-utility-tribunal.html
          grep -q 'listening=no-overlap' premium-v5-utility-tribunal.html
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object field-audio-session.js)" = "06ca40074b345d77b8fc0c46fdb73ab35ffa2cd3"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v52-http.log 2>&1 &
          echo $! >/tmp/ft-v52-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — V5.2 utility tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 75s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=42000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-utility-tribunal.html' > /tmp/v52-utility.html
          grep -q 'data-premium-v5-utility="ok"' /tmp/v52-utility.html || { grep -o 'data-premium-v5-utility-detail="[^"]*"' /tmp/v52-utility.html || true; exit 1; }
          grep -q 'legacy-utility=filled' /tmp/v52-utility.html
          grep -q 'touch=44plus' /tmp/v52-utility.html
          grep -q 'debug-rail=reserved' /tmp/v52-utility.html
          grep -q 'listening=no-overlap' /tmp/v52-utility.html
          grep -q 'original=witness' /tmp/v52-utility.html

      - name: Upload V5.2 browser diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premium-v5-utility-diagnostic
          path: /tmp/v52-utility.html
          retention-days: 1

      - name: Chrome — V5.2 reduced-motion tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 75s \
            google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=42000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-utility-tribunal.html' > /tmp/v52-utility-reduced.html
          grep -q 'data-premium-v5-utility="ok"' /tmp/v52-utility-reduced.html || { grep -o 'data-premium-v5-utility-detail="[^"]*"' /tmp/v52-utility-reduced.html || true; exit 1; }
          grep -q 'debug-rail=reserved' /tmp/v52-utility-reduced.html

      - name: Capture Listening DEBUG FR visual review
        run: |
          mkdir -p artifacts/premium-v5-utility
          capture() {
            label="$1"; dims="$2"; theme="$3"
            profile="/tmp/ft-v52-cap-${label}-${theme}"
            png="artifacts/premium-v5-utility/${label}-${theme}-listening.png"
            dom="/tmp/v52-cap-${label}-${theme}.html"
            rm -rf "$profile" "$png" "$dom"
            timeout --signal=TERM --kill-after=5s 45s \
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size="$dims" --virtual-time-budget=18000 \
              --screenshot="$png" --dump-dom \
              "http://127.0.0.1:4173/premium-v5-visual-capture.html?theme=${theme}&surface=listening" >"$dom"
            test -s "$png"
            grep -q 'data-capture-ready="1"' "$dom" || { cat "$dom"; exit 1; }
            grep -q "data-capture-theme=\"${theme}\"" "$dom" || { cat "$dom"; exit 1; }
            grep -q 'data-capture-surface="listening"' "$dom" || { cat "$dom"; exit 1; }
          }
          for spec in 'mobile 390,844' 'desktop 1440,900'; do
            set -- $spec; label="$1"; dims="$2"
            for theme in aurora sunset jade; do capture "$label" "$dims" "$theme"; done
          done
          test "$(find artifacts/premium-v5-utility -name '*.png' | wc -l)" -eq 6

      - name: Upload V5.2 utility visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-v5-utility-visual-review
          path: artifacts/premium-v5-utility/*.png
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v52-server.pid ]; then kill "$(cat /tmp/ft-v52-server.pid)" || true; fi
