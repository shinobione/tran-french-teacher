name: V5.9B Apply Shared Lesson Layout

on:
  push:
    branches: [agent/v59-steak-b-lesson-layout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v59-steak-b-lesson-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared lesson-card contract
        shell: bash
        run: |
          set -euo pipefail
          cat > premium-v59-lesson-layout.js <<'EOF'
          (() => {
            'use strict';
            const VERSION='2.3.24-v59b1';
            let queued=false;

            const norm=(value)=>String(value||'').replace(/\s+/g,' ').trim();
            const isLessonBadge=(value)=>/^(BÀI|LEÇON)\s*\d+\s*\/\s*\d+$/i.test(norm(value));
            const imageHasEiffel=(value)=>/lesson-eiffel(?:-v2)?\.(?:png|webp)/i.test(String(value||''));

            function pseudoOwner(el){
              try {
                const before=getComputedStyle(el,'::before').backgroundImage;
                const after=getComputedStyle(el,'::after').backgroundImage;
                if(imageHasEiffel(before)) return 'before';
                if(imageHasEiffel(after)) return 'after';
              } catch (_) {}
              return '';
            }

            function findCardFromBadge(badge){
              let node=badge;
              let fallback=null;
              for(let depth=0;node&&depth<9;depth+=1,node=node.parentElement){
                const owner=pseudoOwner(node);
                if(owner) return {card:node,owner};
                if(!fallback && /lesson|today|hero|card/i.test(String(node.className||''))) fallback=node;
              }
              return fallback?{card:fallback,owner:pseudoOwner(fallback)}:null;
            }

            function findIdentity(card,badge){
              let node=badge;
              for(let depth=0;node&&node!==card&&depth<5;depth+=1,node=node.parentElement){
                const content=norm(node.textContent);
                const hasBadge=[...node.querySelectorAll?.('*')||[]].some((el)=>el===badge||isLessonBadge(el.textContent));
                const hasGraphic=!!node.querySelector?.('svg,img,[class*="icon"],[class*="Icon"],[aria-hidden="true"]');
                if(hasBadge&&hasGraphic&&content.length<80) return node;
              }
              return badge.parentElement||badge;
            }

            function markLessonCard(card,owner,badge){
              if(!card||!badge) return;
              card.dataset.v59LessonCard='1';
              card.classList.toggle('v59-eiffel-before',owner==='before');
              card.classList.toggle('v59-eiffel-after',owner==='after');
              const identity=findIdentity(card,badge);
              if(identity&&identity!==card) identity.dataset.v59LessonIdentity='1';
              badge.dataset.v59LessonBadge='1';
              const contentChildren=[...card.children].filter((child)=>child!==identity);
              contentChildren.forEach((child)=>{
                if(!child.dataset.v59LessonIdentity && !child.matches?.('script,style')) child.dataset.v59LessonContent='1';
              });
            }

            function reconcile(){
              queued=false;
              const badges=[...document.querySelectorAll('span,strong,p,div')]
                .filter((el)=>isLessonBadge(el.textContent))
                .filter((el)=>![...el.children].some((child)=>isLessonBadge(child.textContent)));
              badges.forEach((badge)=>{
                const found=findCardFromBadge(badge);
                if(found) markLessonCard(found.card,found.owner,badge);
              });
              document.documentElement.dataset.v59LessonLayout=VERSION;
            }

            function schedule(){if(queued)return;queued=true;requestAnimationFrame(reconcile);}
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true}); else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
            window.FrenchTranquilleV59LessonLayout=Object.freeze({version:VERSION,reconcile});
          })();
          EOF

          cat > premium-v59-lesson-layout.css <<'EOF'
          /* V5.9B — one lesson-card geometry for Original / Aurora / Sunset / Nocturne. */
          [data-v59-lesson-card="1"] {
            --v59-card-pad-x: clamp(1.25rem, 4.8vw, 2rem);
            --v59-card-pad-y: clamp(1.2rem, 4vw, 1.7rem);
            --v59-identity-gap: clamp(.55rem, 2vw, .8rem);
            --v59-art-width: clamp(10rem, 30vw, 18rem);
            position: relative;
            isolation: isolate;
            overflow: hidden;
            padding-inline: var(--v59-card-pad-x) !important;
            padding-block: var(--v59-card-pad-y) !important;
          }

          [data-v59-lesson-card="1"] > * { position: relative; z-index: 2; }

          [data-v59-lesson-identity="1"] {
            position: relative !important;
            inset: auto !important;
            z-index: 4 !important;
            display: inline-flex !important;
            align-items: center !important;
            flex-wrap: wrap;
            gap: var(--v59-identity-gap) !important;
            max-width: min(64%, 22rem);
            margin: 0 0 clamp(1rem, 3.4vw, 1.5rem) 0 !important;
            transform: none !important;
          }

          [data-v59-lesson-badge="1"] {
            position: relative !important;
            inset: auto !important;
            z-index: 5 !important;
            flex: 0 0 auto;
          }

          [data-v59-lesson-card="1"].v59-eiffel-before::before,
          [data-v59-lesson-card="1"].v59-eiffel-after::after {
            content: "" !important;
            position: absolute !important;
            inset: auto clamp(-1.2rem, -1.8vw, -.25rem) clamp(-.8rem, -1vw, -.15rem) auto !important;
            width: var(--v59-art-width) !important;
            height: min(92%, 22rem) !important;
            z-index: 1 !important;
            pointer-events: none !important;
            background-repeat: no-repeat !important;
            background-size: contain !important;
            background-position: right bottom !important;
            opacity: .96 !important;
            transform: none !important;
            filter: none !important;
          }

          [data-v59-lesson-content="1"] {
            max-width: min(72%, 42rem);
          }

          @media (max-width: 620px) {
            [data-v59-lesson-card="1"] {
              --v59-art-width: clamp(8.4rem, 40vw, 12.5rem);
              --v59-card-pad-x: clamp(1rem, 5vw, 1.4rem);
            }
            [data-v59-lesson-identity="1"] { max-width: 68%; }
            [data-v59-lesson-content="1"] { max-width: 72%; }
            [data-v59-lesson-card="1"].v59-eiffel-before::before,
            [data-v59-lesson-card="1"].v59-eiffel-after::after {
              opacity: .92 !important;
              height: 84% !important;
              inset-inline-end: -.8rem !important;
            }
          }

          @media (max-width: 390px) {
            [data-v59-lesson-identity="1"] { max-width: 72%; }
            [data-v59-lesson-content="1"] { max-width: 76%; }
          }

          @media (prefers-reduced-motion: reduce) {
            [data-v59-lesson-card="1"], [data-v59-lesson-card="1"]::before, [data-v59-lesson-card="1"]::after { transition: none !important; }
          }
          EOF

          cat > premium-v59b-lesson-layout-tribunal.html <<'EOF'
          <!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="premium-v59-lesson-layout.css"><style>
          body{margin:0;padding:20px;background:#071d18}.fixture{width:min(720px,calc(100vw - 40px));min-height:310px;border:1px solid #b89b45;border-radius:28px;color:white}.fixture::after{background-image:url('assets/premium/themes/nocturne/lesson-eiffel-v2.png')}.identity{display:flex;align-items:center;gap:12px}.icon{width:54px;height:54px}.badge{padding:8px 12px}.copy{font-size:32px}.cta{height:58px;width:100%}</style></head><body>
          <article class="fixture"><div class="identity"><span class="icon">🍽️</span><strong class="badge">BÀI 12 / 52</strong></div><h2 class="copy">Ở nhà hàng</h2><p>Xin bàn, xem thực đơn, gọi món và nói “không có...”</p><button class="cta">Bắt đầu</button></article>
          <script src="premium-v59-lesson-layout.js"></script><script>
          setTimeout(()=>{const card=document.querySelector('[data-v59-lesson-card="1"]');const id=document.querySelector('[data-v59-lesson-identity="1"]');const badge=document.querySelector('[data-v59-lesson-badge="1"]');const cs=card?getComputedStyle(card,'::after'):null;const ok=!!card&&!!id&&!!badge&&cs.backgroundPosition.includes('right')&&parseFloat(getComputedStyle(id).maxWidth)>0;document.documentElement.dataset.v59b=ok?'ok':'fail';document.documentElement.dataset.v59bDetail=`card=${!!card};identity=${!!id};badge=${!!badge};pos=${cs&&cs.backgroundPosition}`;},250);
          </script></body></html>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html'); s=idx.read_text()
          css='premium-v59-lesson-layout.css?v=2.3.24-v59b1'; js='premium-v59-lesson-layout.js?v=2.3.24-v59b1'
          if css not in s:
              assert '</head>' in s; s=s.replace('</head>',f'  <link rel="stylesheet" href="{css}">\n</head>',1)
          if js not in s:
              assert '</body>' in s; s=s.replace('</body>',f'  <script src="{js}"></script>\n</body>',1)
          idx.write_text(s)

          sw=Path('sw.js'); s=sw.read_text()
          old='tran-french-teacher-v2.3.23-b34.15-v59a1'; new='tran-french-teacher-v2.3.24-b34.16-v59b1'
          assert old in s or new in s; s=s.replace(old,new)
          if "const V59B='2.3.24-v59b1'" not in s:
              anchor="const V59A='2.3.23-v59a1';"; assert anchor in s; s=s.replace(anchor,anchor+"\nconst V59B='2.3.24-v59b1';",1)
          anchor="'premium-v59-interaction-coherence.js?v=${V59A}',"; assert anchor in s
          ins=anchor+"\n  'premium-v59-lesson-layout.css?v=${V59B}',\n  'premium-v59-lesson-layout.js?v=${V59B}',"
          if "premium-v59-lesson-layout.js?v=${V59B}" not in s: s=s.replace(anchor,ins,1)
          sw.write_text(s)

          old='tran-french-teacher-v2.3.23-b34.15-v59a1'; new='tran-french-teacher-v2.3.24-b34.16-v59b1'
          for p in Path('.github/workflows').glob('*.yml'):
              if p.name=='v59-steak-b-apply.yml': continue
              t=p.read_text()
              if old in t: p.write_text(t.replace(old,new))
          PY

          cat > .github/workflows/premium-v59b-lesson-layout.yml <<'EOF'
          name: Premium V5.9B Shared Lesson Layout
          on:
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            shared-lesson-layout:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: { node-version: '22' }
                - name: Static shared-layout contracts
                  run: |
                    node --check premium-v59-lesson-layout.js
                    grep -q 'premium-v59-lesson-layout.css?v=2.3.24-v59b1' index.html
                    grep -q 'premium-v59-lesson-layout.js?v=2.3.24-v59b1' index.html
                    grep -q "const V59B='2.3.24-v59b1'" sw.js
                    grep -q 'premium-v59-lesson-layout.css?v=${V59B}' sw.js
                    grep -q 'premium-v59-lesson-layout.js?v=${V59B}' sw.js
                    test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
                    test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
                    test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
                - name: Chrome shared geometry tribunal
                  run: |
                    python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v59b-http.log 2>&1 & pid=$!; trap 'kill $pid || true' EXIT; sleep 1
                    for size in 390,844 430,932 1440,900; do
                      timeout --signal=TERM --kill-after=5s 35s google-chrome --headless=new --no-sandbox --disable-gpu --window-size="$size" --virtual-time-budget=1500 --dump-dom http://127.0.0.1:4173/premium-v59b-lesson-layout-tribunal.html >"/tmp/v59b-${size//,/-}.html"
                      grep -q 'data-v59b="ok"' "/tmp/v59b-${size//,/-}.html" || { grep -o 'data-v59b-detail="[^"]*"' "/tmp/v59b-${size//,/-}.html" || true; exit 1; }
                    done
          EOF

          rm -f .github/workflows/v59-steak-b-apply.yml
          node --check premium-v59-lesson-layout.js
          git diff --check
      - name: Commit rollback checkpoint B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V5.9B shared lesson-card layout checkpoint'
          git push origin HEAD:agent/v59-steak-b-lesson-layout
