name: V5.9 master history preservation

on:
  push:
    branches:
      - docs/v59-technical-closeout
    paths:
      - tools/v59_master_preserve.py
      - .github/workflows/v59-master-preserve.yml

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v59-technical-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/v59_master_preserve.py
      - name: Commit preserved master and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v59-master-preserve.yml tools/v59_master_preserve.py
          git add MASTER-ROADMAP.md
          git diff --cached --check
          git commit -m 'docs: preserve full V5.9 spec in technical closeout'
          git push origin HEAD:docs/v59-technical-closeout
