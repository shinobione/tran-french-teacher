name: V5.9C Apply Premium System

on:
  push:
    branches: [agent/v59-steak-c-premium-system]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v59-steak-c-premium-system
          fetch-depth: 0
      - name: Apply shared premium-system layer
        shell: bash
        run: |
          set -euo pipefail
          cat > premium-v59-premium-system.js <<'EOF'
          (() => {
            'use strict';
            const VERSION='2.3.25-v59c1';
            const DEBUG_KEY='tran-french-teacher:debug-fr:v1';
            let queued=false;
            let pressTimer=0;

            const norm=(v)=>String(v||'').replace(/\s+/g,' ').trim().toLocaleLowerCase('fr');
            const exact=(el,values)=>values.includes(norm(el&&el.textContent));
            const headings=()=>[...document.querySelectorAll('h1,h2,h3,h4,strong,p,span')];

            const CARD_TITLES=[
              'nói tiếng pháp','luyện nghe','ôn lại','tình huống thực tế',
              'parler','écouter','réviser','dans la vraie vie',
              'chủ đề','giới thiệu','dữ liệu & sao lưu',
              'thème','à propos','données & sauvegarde'
            ];
            const CTA_LABELS=[
              'bắt đầu','tiếp tục','continuer','commencer','réviser maintenant','ôn ngay'
            ];

            function nearestCard(label){
              let node=label;
              let fallback=null;
              for(let depth=0;node&&depth<7;depth+=1,node=node.parentElement){
                if(!fallback && /card|row|item|surface|panel|practice|setting/i.test(String(node.className||''))) fallback=node;
                if(node.querySelectorAll){
                  const buttons=node.querySelectorAll('button,a,[role="button"]');
                  if(buttons.length && /card|row|item|surface|panel|practice|setting/i.test(String(node.className||''))) return node;
                }
              }
              return fallback;
            }

            function markCards(){
              headings().forEach((label)=>{
                if(!exact(label,CARD_TITLES)) return;
                const card=nearestCard(label);
                if(!card) return;
                card.dataset.v59Surface='card';
                const icon=[...card.querySelectorAll('[class*="icon"],[class*="Icon"]')]
                  .find((slot)=>!slot.contains(label)&&!/chevron|arrow/i.test(String(slot.className||'')));
                if(icon) icon.dataset.v59SurfaceIcon='1';
              });
            }

            function markCtas(){
              [...document.querySelectorAll('button,a,[role="button"]')].forEach((button)=>{
                if(exact(button,CTA_LABELS)) button.dataset.v59Cta='primary';
              });
            }

            function settingsHeading(){
              return headings().find((node)=>exact(node,['cài đặt','réglages']))||null;
            }

            function debugApiState(){
              const api=window.FrenchTranquilleDebugFr;
              if(api){
                try {
                  if(typeof api.get==='function') return !!api.get();
                  if(typeof api.isEnabled==='function') return !!api.isEnabled();
                  if(typeof api.enabled==='boolean') return api.enabled;
                } catch (_) {}
              }
              const raw=localStorage.getItem(DEBUG_KEY);
              return raw==='1'||raw==='true'||raw==='on'||raw==='enabled';
            }

            function setDebug(next){
              const api=window.FrenchTranquilleDebugFr;
              try {
                if(api&&typeof api.set==='function'){api.set(!!next);return true;}
                if(api&&typeof api.setEnabled==='function'){api.setEnabled(!!next);return true;}
                if(api&&typeof api.toggle==='function'){
                  if(debugApiState()!==!!next) api.toggle();
                  return true;
                }
              } catch (_) {}
              localStorage.setItem(DEBUG_KEY,next?'1':'0');
              window.dispatchEvent(new CustomEvent('french-tranquille:debug-fr-change',{detail:{enabled:!!next,source:'v59-hidden-entry'}}));
              return true;
            }

            function toast(message){
              let node=document.getElementById('v59-admin-toast');
              if(!node){node=document.createElement('div');node.id='v59-admin-toast';node.setAttribute('role','status');document.body.appendChild(node);}
              node.textContent=message;node.classList.add('is-visible');
              clearTimeout(node._v59Timer);node._v59Timer=setTimeout(()=>node.classList.remove('is-visible'),1800);
            }

            function toggleDebug(){
              const next=!debugApiState();
              setDebug(next);
              toast(next?'DEBUG FR activé':'DEBUG FR désactivé');
              setTimeout(()=>{ if(window.FrenchTranquilleDebugFr&&typeof window.FrenchTranquilleDebugFr.reconcile==='function') window.FrenchTranquilleDebugFr.reconcile(); },0);
              return next;
            }

            function bindHiddenDebug(){
              const heading=settingsHeading();
              if(!heading||heading.dataset.v59DebugBound==='1') return;
              heading.dataset.v59DebugBound='1';
              heading.dataset.v59DebugEntry='hidden';
              heading.addEventListener('pointerdown',()=>{clearTimeout(pressTimer);pressTimer=setTimeout(toggleDebug,1050);});
              ['pointerup','pointercancel','pointerleave'].forEach((type)=>heading.addEventListener(type,()=>clearTimeout(pressTimer)));
            }

            function reconcile(){queued=false;markCards();markCtas();bindHiddenDebug();document.documentElement.dataset.v59PremiumSystem=VERSION;}
            function schedule(){if(queued)return;queued=true;requestAnimationFrame(reconcile);}
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true}); else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
            document.addEventListener('keydown',(event)=>{
              if(event.altKey&&event.shiftKey&&event.code==='KeyD'&&settingsHeading()){
                event.preventDefault();toggleDebug();
              }
            });
            window.FrenchTranquilleV59Premium=Object.freeze({version:VERSION,reconcile,toggleDebug});
          })();
          EOF

          cat > premium-v59-premium-system.css <<'EOF'
          :root {
            --v59-radius-card: clamp(1.25rem, 4vw, 1.65rem);
            --v59-radius-cta: clamp(1rem, 3vw, 1.25rem);
            --v59-motion-fast: 150ms;
            --v59-motion-med: 220ms;
          }

          [data-v59-surface="card"] {
            border-radius: var(--v59-radius-card) !important;
            border-color: color-mix(in srgb, currentColor 18%, transparent) !important;
            box-shadow:
              inset 0 1px 0 color-mix(in srgb, white 14%, transparent),
              0 14px 38px color-mix(in srgb, black 28%, transparent) !important;
            backdrop-filter: blur(14px) saturate(1.08);
            -webkit-backdrop-filter: blur(14px) saturate(1.08);
            transition: transform var(--v59-motion-fast) ease,
                        border-color var(--v59-motion-med) ease,
                        box-shadow var(--v59-motion-med) ease !important;
          }

          @media (hover:hover) and (pointer:fine) {
            [data-v59-surface="card"]:hover {
              transform: translateY(-1px);
              border-color: color-mix(in srgb, currentColor 28%, transparent) !important;
              box-shadow:
                inset 0 1px 0 color-mix(in srgb, white 18%, transparent),
                0 18px 44px color-mix(in srgb, black 32%, transparent) !important;
            }
          }

          [data-v59-surface="card"]:active { transform: scale(.994); }

          [data-v59-surface-icon="1"] {
            width: clamp(3rem, 12vw, 3.5rem) !important;
            height: clamp(3rem, 12vw, 3.5rem) !important;
            min-width: clamp(3rem, 12vw, 3.5rem) !important;
            border-radius: 50% !important;
            display: grid !important;
            place-items: center !important;
            border: 1px solid color-mix(in srgb, currentColor 34%, transparent) !important;
            box-shadow: inset 0 1px 0 color-mix(in srgb, white 16%, transparent), 0 8px 20px color-mix(in srgb, black 20%, transparent);
          }

          [data-v59-cta="primary"] {
            min-height: 3.55rem !important;
            border-radius: var(--v59-radius-cta) !important;
            font-weight: 800 !important;
            letter-spacing: -.01em;
            position: relative;
            overflow: hidden;
            box-shadow:
              inset 0 1px 0 color-mix(in srgb, white 24%, transparent),
              0 10px 26px color-mix(in srgb, black 24%, transparent) !important;
            transition: transform var(--v59-motion-fast) ease,
                        filter var(--v59-motion-fast) ease,
                        box-shadow var(--v59-motion-med) ease !important;
          }
          [data-v59-cta="primary"]::after {
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:linear-gradient(115deg,transparent 5%,color-mix(in srgb,white 13%,transparent) 46%,transparent 78%);
            opacity:.65;
          }
          [data-v59-cta="primary"]:active { transform: scale(.985); filter: brightness(.98); }
          [data-v59-cta="primary"]:focus-visible,
          [data-v59-surface="card"]:focus-visible {
            outline: 2px solid color-mix(in srgb, currentColor 66%, transparent);
            outline-offset: 3px;
          }

          [data-v59-debug-entry="hidden"] { cursor: default; -webkit-user-select:none; user-select:none; }
          #v59-admin-toast {
            position:fixed;left:50%;bottom:max(5rem,calc(env(safe-area-inset-bottom) + 4rem));z-index:2147483000;
            transform:translate(-50%,10px);opacity:0;pointer-events:none;
            padding:.7rem 1rem;border-radius:999px;background:rgba(5,8,14,.88);color:#fff;
            border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 36px rgba(0,0,0,.35);
            font:700 .82rem/1 system-ui,sans-serif;transition:opacity 160ms ease,transform 160ms ease;
          }
          #v59-admin-toast.is-visible { opacity:1;transform:translate(-50%,0); }

          @media (prefers-reduced-motion: reduce) {
            [data-v59-surface="card"],[data-v59-cta="primary"],#v59-admin-toast { transition:none !important; }
          }
          EOF

          cat > premium-v59c-premium-system-tribunal.html <<'EOF'
          <!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="premium-v59-premium-system.css"></head><body>
            <main><h1>Cài đặt</h1><div class="practice-card"><span class="practice-icon">◎</span><strong>Tình huống thực tế</strong><button>›</button></div><div class="settings-card"><span class="settings-icon">◎</span><strong>Giới thiệu</strong><button>›</button></div><button id="cta">Bắt đầu</button></main>
            <script>window.__dbg=false;window.FrenchTranquilleDebugFr={get:()=>window.__dbg,set:(v)=>{window.__dbg=!!v}};</script>
            <script src="premium-v59-premium-system.js"></script><script>
            setTimeout(()=>{const cards=document.querySelectorAll('[data-v59-surface="card"]');const icons=document.querySelectorAll('[data-v59-surface-icon="1"]');const cta=document.querySelector('[data-v59-cta="primary"]');const api=window.FrenchTranquilleV59Premium;api.toggleDebug();const ok=cards.length>=2&&icons.length>=2&&!!cta&&window.__dbg===true&&getComputedStyle(cta).minHeight!=='0px';document.documentElement.dataset.v59c=ok?'ok':'fail';document.documentElement.dataset.v59cDetail=`cards=${cards.length};icons=${icons.length};cta=${!!cta};debug=${window.__dbg}`;},250);
            </script></body></html>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html');s=idx.read_text();css='premium-v59-premium-system.css?v=2.3.25-v59c1';js='premium-v59-premium-system.js?v=2.3.25-v59c1'
          if css not in s:
              assert '</head>' in s;s=s.replace('</head>',f'  <link rel="stylesheet" href="{css}">\n</head>',1)
          if js not in s:
              assert '</body>' in s;s=s.replace('</body>',f'  <script src="{js}"></script>\n</body>',1)
          idx.write_text(s)
          sw=Path('sw.js');s=sw.read_text();old='tran-french-teacher-v2.3.24-b34.16-v59b1';new='tran-french-teacher-v2.3.25-b34.17-v59c1';assert old in s or new in s;s=s.replace(old,new)
          if "const V59C='2.3.25-v59c1'" not in s:
              anchor="const V59B='2.3.24-v59b1';";assert anchor in s;s=s.replace(anchor,anchor+"\nconst V59C='2.3.25-v59c1';",1)
          anchor="'premium-v59-lesson-layout.js?v=${V59B}',";assert anchor in s
          if "premium-v59-premium-system.js?v=${V59C}" not in s:s=s.replace(anchor,anchor+"\n  'premium-v59-premium-system.css?v=${V59C}',\n  'premium-v59-premium-system.js?v=${V59C}',",1)
          sw.write_text(s)
          old='tran-french-teacher-v2.3.24-b34.16-v59b1';new='tran-french-teacher-v2.3.25-b34.17-v59c1'
          for p in Path('.github/workflows').glob('*.yml'):
              if p.name=='v59-steak-c-apply.yml':continue
              t=p.read_text()
              if old in t:p.write_text(t.replace(old,new))
          PY

          cat > .github/workflows/premium-v59c-premium-system.yml <<'EOF'
          name: Premium V5.9C Shared Premium System
          on:
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            premium-system:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: { node-version: '22' }
                - name: Static contracts
                  run: |
                    node --check premium-v59-premium-system.js
                    grep -q 'premium-v59-premium-system.css?v=2.3.25-v59c1' index.html
                    grep -q 'premium-v59-premium-system.js?v=2.3.25-v59c1' index.html
                    grep -q "const V59C='2.3.25-v59c1'" sw.js
                    ! grep -q 'old page fades out' premium-v59-premium-system.css
                    test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
                    test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
                    test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
                - name: Chrome premium-system tribunal
                  run: |
                    python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v59c-http.log 2>&1 & pid=$!;trap 'kill $pid || true' EXIT;sleep 1
                    timeout --signal=TERM --kill-after=5s 35s google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom http://127.0.0.1:4173/premium-v59c-premium-system-tribunal.html >/tmp/v59c.html
                    grep -q 'data-v59c="ok"' /tmp/v59c.html || { grep -o 'data-v59c-detail="[^"]*"' /tmp/v59c.html || true;exit 1; }
          EOF

          rm -f .github/workflows/v59-steak-c-apply.yml
          node --check premium-v59-premium-system.js
          git diff --check
      - name: Commit rollback checkpoint C
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V5.9C shared premium-system checkpoint'
          git push origin HEAD:agent/v59-steak-c-premium-system
