name: Build 26.4 Progress single-scroll + Tyffany smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  progress-tyffany:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and Build 26.4 contract wiring
        run: |
          node --check build26-4-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'build26-4-ux.css?v=1.19.4-b26.4' index.html
          grep -q 'build26-4-ux.js?v=1.19.4-b26.4' index.html
          grep -q 'build-meta.js?v=' index.html
          grep -q 'FrenchTranquilleBuild264UX' build-meta.js
          grep -q 'build26-4-ux.css' sw.js
          grep -q 'build26-4-ux.js' sw.js
          grep -q "OLD_NAME = 'Lucie'" build26-4-ux.js
          grep -q "NEW_NAME = 'Tyffany'" build26-4-ux.js
          grep -q 'overflow:visible!important' build26-4-ux.css
          grep -q 'max-height:none!important' build26-4-ux.css

      - name: Data, voice and branding sanctuaries remain byte-identical
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b264-http.log 2>&1 &
          echo $! >/tmp/ft-b264-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — teacher is Tyffany in the rendered learner UI
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b264-brand-profile-$attempt"
            file="/tmp/b264-brand-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 35s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=26000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b264Smoke=brand' >"$file"; then
              echo "Brand Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'data-b264-smoke-tyffany="1"' "$file" \
              && grep -q 'data-b264-smoke-no-lucie="1"' "$file" \
              && grep -q 'data-b264-smoke-tutor-export="1"' "$file" \
              && grep -q 'Tyffany' "$file"; then
              passed=1
              break
            fi
            echo "Tyffany attempt $attempt missing markers"
            grep -o 'data-b264-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.4 Tyffany render smoke failed after 3 bounded isolated attempts'
            exit 1
          fi

      - name: Chrome desktop — Details uses page scroll, never a nested scrollbar
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b264-progress-profile-$attempt"
            file="/tmp/b264-progress-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=32000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&detailsDashboardSmoke=mastery&b264Smoke=progress' >"$file"; then
              echo "Progress Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-progress' "$file" \
              && grep -q 'data-b264-smoke-progress="1"' "$file" \
              && grep -q 'data-b264-smoke-mastery="1"' "$file" \
              && grep -q 'data-details-dashboard-active="mastery"' "$file" \
              && grep -q 'data-b264-progress-nested-scroll="0"' "$file" \
              && grep -q 'data-b264-progress-single-scroll="1"' "$file" \
              && grep -q 'data-b264-progress-overflow-y="visible"' "$file" \
              && grep -q 'data-b264-progress-max-height="none"' "$file" \
              && grep -q 'data-b264-progress-page-scrollable="1"' "$file" \
              && grep -q 'data-progress-current-lesson="l8"' "$file" \
              && grep -q 'data-progress-completed="7"' "$file" \
              && grep -q 'data-progress-known="40"' "$file"; then
              passed=1
              break
            fi
            echo "Single-scroll attempt $attempt missing markers"
            grep -o 'data-b264-[^ >]*' "$file" | head -30 || true
            grep -o 'data-details-dashboard-active="[^"]*"' "$file" | head -5 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.4 single-scroll Progress smoke failed after 3 bounded isolated attempts'
            exit 1
          fi

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b264-server.pid ]; then kill "$(cat /tmp/ft-b264-server.pid)" || true; fi
