name: V5.10 Practice Pictogram System

on:
  pull_request:
    paths:
      - 'premium-v510-practice-icons.js'
      - 'premium-v510-practice-icons.css'
      - 'premium-v510-practice-icons-tribunal.html'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/v510-practice-icon-system.yml'

permissions:
  contents: read

jobs:
  practice-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static pictogram-system contract
        shell: bash
        run: |
          node --check premium-v510-practice-icons.js
          node --check sw.js
          grep -q 'premium-v510-practice-icons.css?v=2.3.29-v510icons3' index.html
          grep -q 'premium-v510-practice-icons.js?v=2.3.29-v510icons3' index.html
          grep -q "const V510ICONS='2.3.29-v510icons3'" sw.js
          grep -q 'premium-v510-practice-icons.css?v=${V510ICONS}' sw.js
          grep -q 'premium-v510-practice-icons.js?v=${V510ICONS}' sw.js
          grep -q "style: 'premium-pictogram-v3'" premium-v510-practice-icons.js
          grep -q "conversation: svg('conversation'" premium-v510-practice-icons.js
          grep -q "listening: svg('listening'" premium-v510-practice-icons.js
          grep -q "review: svg('review'" premium-v510-practice-icons.js
          grep -q "'real-life': svg('real-life'" premium-v510-practice-icons.js
          grep -q 'ft-v510-picto-primary' premium-v510-practice-icons.js
          grep -q 'ft-v510-picto-secondary' premium-v510-practice-icons.js
          grep -q 'ft-v510-picto-highlight' premium-v510-practice-icons.js
          grep -q -- '--v510-picto-hi' premium-v510-practice-icons.css
          grep -q 'filter:none' premium-v510-practice-icons.css
          grep -q 'content:none!important' premium-v510-practice-icons.css
          if grep -q 'drop-shadow' premium-v510-practice-icons.css; then
            echo 'V3 must not reintroduce pictogram drop-shadows'; exit 1;
          fi
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v510-icons-http.log 2>&1 &
          echo $! >/tmp/ft-v510-icons-server.pid
          sleep 1
          google-chrome --version
      - name: Chrome — four themes, four crisp premium pictograms, optical centering
        shell: bash
        run: |
          rm -rf /tmp/ft-v510-icons-profile /tmp/ft-v510-icons.html
          timeout --signal=TERM --kill-after=5s 45s google-chrome \
            --headless=new --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/ft-v510-icons-profile \
            --window-size=430,932 \
            --virtual-time-budget=30000 \
            --dump-dom 'http://127.0.0.1:4173/premium-v510-practice-icons-tribunal.html' \
            >/tmp/ft-v510-icons.html
          if ! grep -q 'data-v510-practice-icons="ok"' /tmp/ft-v510-icons.html || ! grep -q 'V5.10 practice pictogram system V3 OK' /tmp/ft-v510-icons.html; then
            echo '--- V5.10 pictogram tribunal failure ---'
            grep -o 'FAIL: [^<]*' /tmp/ft-v510-icons.html || true
            tail -n 80 /tmp/ft-v510-icons.html || true
            exit 1
          fi
      - name: Stop static server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ft-v510-icons-server.pid ]; then kill "$(cat /tmp/ft-v510-icons-server.pid)" || true; fi
