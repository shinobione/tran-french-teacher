name: V5.10 Approved Premium Practice Artwork

on:
  pull_request:
    paths:
      - 'assets/premium/practice/**'
      - 'src/premium/premium-v510-practice-icons.js'
      - 'src/premium/premium-v510-practice-icons.css'
      - 'tests/browser/premium-v510-practice-icons-tribunal.html'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/v510-practice-icon-system.yml'

permissions:
  contents: read

jobs:
  practice-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static approved-art + Feature Header contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/premium/premium-v510-practice-icons.js
          node --check sw.js
          grep -q 'src/premium/premium-v510-practice-icons.css?v=2.3.31-v510png1' index.html
          grep -q 'src/premium/premium-v510-practice-icons.js?v=2.3.31-v510png1' index.html
          grep -q "const V510ICONS='2.3.31-v510png1'" sw.js
          grep -q "style: 'approved-premium-art-v1'" src/premium/premium-v510-practice-icons.js
          grep -q "featureHeaderStyle: 'feature-header-v1'" src/premium/premium-v510-practice-icons.js
          grep -q "speak-premium.webp" src/premium/premium-v510-practice-icons.js
          grep -q "listen-premium.webp" src/premium/premium-v510-practice-icons.js
          grep -q "review-premium.webp" src/premium/premium-v510-practice-icons.js
          grep -q "real-life-premium.webp" src/premium/premium-v510-practice-icons.js
          grep -q "fr: 'Compréhension orale'" src/premium/premium-v510-practice-icons.js
          grep -q "fr: 'Révision'" src/premium/premium-v510-practice-icons.js
          grep -q "fr: 'Conversation'" src/premium/premium-v510-practice-icons.js
          grep -q "fr: 'Répondre à l’oral'" src/premium/premium-v510-practice-icons.js
          if grep -q '<svg\|svg(' src/premium/premium-v510-practice-icons.js; then echo 'legacy SVG generator still present'; exit 1; fi
          if grep -q 'ft-v510-3d-' src/premium/premium-v510-practice-icons.js src/premium/premium-v510-practice-icons.css; then echo 'legacy V4 SVG classes still present'; exit 1; fi
          for asset in speak listen review; do test -s "assets/premium/practice/${asset}-premium.webp"; done
          test -s assets/premium/practice/real-life-premium.webp
          python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('assets/premium/practice/speak-premium.webp'),
            Path('assets/premium/practice/listen-premium.webp'),
            Path('assets/premium/practice/review-premium.webp'),
            Path('assets/premium/practice/real-life-premium.webp'),
          ]
          for path in files:
            data=path.read_bytes()
            assert len(data)>4096, f'{path}: suspiciously small'
            assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', f'{path}: invalid WebP container'
          print('4/4 approved artwork files are non-empty WebP containers')
          PY
          for asset in speak-premium.webp listen-premium.webp review-premium.webp real-life-premium.webp; do grep -q "./assets/premium/practice/$asset" sw.js; done
          grep -q 'filter:none!important' src/premium/premium-v510-practice-icons.css
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v510-icons-http.log 2>&1 &
          echo $! >/tmp/ft-v510-icons-server.pid
          sleep 1
          google-chrome --version
      - name: Chrome — Practice + Feature Headers, three viewports, four themes
        shell: bash
        run: |
          rm -rf /tmp/ft-v510-icons-profile /tmp/ft-v510-icons.html
          timeout --signal=TERM --kill-after=5s 110s google-chrome \
            --headless=new --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/ft-v510-icons-profile \
            --window-size=1440,1000 \
            --virtual-time-budget=95000 \
            --dump-dom 'http://127.0.0.1:4173/tests/browser/premium-v510-practice-icons-tribunal.html' \
            >/tmp/ft-v510-icons.html
          if ! grep -q 'data-v510-practice-icons="ok"' /tmp/ft-v510-icons.html || ! grep -q 'Feature Header System OK' /tmp/ft-v510-icons.html; then
            echo '--- V5.10 approved artwork / Feature Header tribunal failure ---'
            grep -o 'FAIL: [^<]*' /tmp/ft-v510-icons.html || true
            tail -n 120 /tmp/ft-v510-icons.html || true
            exit 1
          fi
      - name: Stop static server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/ft-v510-icons-server.pid ]; then kill "$(cat /tmp/ft-v510-icons-server.pid)" || true; fi
