name: Premium V5.4 Mockup Convergence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mockup-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static V5.4 contracts and sanctuaries
        run: |
          grep -q -- '--pv54-mockup-ready:1' premium-v5-mockup-convergence.css
          grep -q -- '--pv54-mobile-preserved:1' premium-v5-mockup-convergence.css
          grep -q 'grid-auto-flow:dense' premium-v5-mockup-convergence.css
          grep -q '.ux-settings-note' premium-v5-mockup-convergence.css
          grep -q '.listening-shell' premium-v5-mockup-convergence.css
          grep -q 'prefers-reduced-motion:reduce' premium-v5-mockup-convergence.css
          grep -q 'premium-v5-mockup-convergence.css?v=2.3.19-v5mockup1' premium-theme-polish.css
          grep -q 'premium-v5-islands.css?v=2.3.18-v5islands1' premium-theme-polish.css
          test "$(tail -n 1 premium-theme-polish.css)" = "@import url('./premium-nav-geometry-hotfix.css?v=2.3.4-p0nav1');"
          grep -q '2.3.19-v5mockup1' theme-controller.js
          grep -q 'premiumV5Mockup' premium-v5-mockup-convergence-tribunal.html
          grep -q 'practice=3plus1' premium-v5-mockup-convergence-tribunal.html
          grep -q 'settings=intro-wide' premium-v5-mockup-convergence-tribunal.html
          grep -q 'mobile=preserved' premium-v5-mockup-convergence-tribunal.html
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object field-audio-session.js)" = "06ca40074b345d77b8fc0c46fdb73ab35ffa2cd3"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v54-http.log 2>&1 &
          echo $! >/tmp/ft-v54-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — V5.4 geometry tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 125s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=96000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-mockup-convergence-tribunal.html' > /tmp/v54-mockup.html
          grep -q 'data-premium-v5-mockup="ok"' /tmp/v54-mockup.html || { grep -o 'data-premium-v5-mockup-detail="[^"]*"' /tmp/v54-mockup.html || true; exit 1; }
          grep -q 'desktop=mockup-geometry' /tmp/v54-mockup.html
          grep -q 'practice=3plus1' /tmp/v54-mockup.html
          grep -q 'settings=intro-wide' /tmp/v54-mockup.html
          grep -q 'mobile=preserved' /tmp/v54-mockup.html
          grep -q 'stores=unchanged' /tmp/v54-mockup.html
          grep -q 'original=witness' /tmp/v54-mockup.html

      - name: Chrome — V5.4 reduced-motion geometry tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 125s \
            google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=96000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-mockup-convergence-tribunal.html' > /tmp/v54-mockup-reduced.html
          grep -q 'data-premium-v5-mockup="ok"' /tmp/v54-mockup-reduced.html || { grep -o 'data-premium-v5-mockup-detail="[^"]*"' /tmp/v54-mockup-reduced.html || true; exit 1; }
          grep -q 'overflow=0' /tmp/v54-mockup-reduced.html
          grep -q 'stores=unchanged' /tmp/v54-mockup-reduced.html

      - name: Capture V5.4 desktop mockup review matrix
        run: |
          mkdir -p artifacts/premium-v5-mockup
          capture() {
            label="$1"; dims="$2"; theme="$3"; screen="$4"
            profile="/tmp/ft-v54-${label}-${theme}-${screen}"
            png="artifacts/premium-v5-mockup/${label}-${theme}-${screen}.png"
            dom="/tmp/v54-${label}-${theme}-${screen}.html"
            target="http://127.0.0.1:4173/premium-v4-visual-capture.html?theme=${theme}&screen=${screen}"
            rm -rf "$profile" "$png" "$dom"
            timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size="$dims" --virtual-time-budget=15000 \
              --screenshot="$png" --dump-dom "$target" >"$dom"
            test -s "$png"
            grep -q 'data-capture-ready="1"' "$dom" || { grep -o 'data-capture-error="[^"]*"' "$dom" || true; exit 1; }
            grep -q "data-capture-theme=\"${theme}\"" "$dom"
            grep -q "data-capture-screen=\"${screen}\"" "$dom"
          }
          for spec in 'desktop1280 1280,800' 'desktop1440 1440,900'; do
            set -- $spec; label="$1"; dims="$2"
            for theme in aurora sunset jade; do
              for screen in home progress practice listening settings; do
                capture "$label" "$dims" "$theme" "$screen"
              done
            done
          done
          test "$(find artifacts/premium-v5-mockup -name '*.png' | wc -l)" -eq 30

      - name: Upload V5.4 mockup review artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-v5-mockup-visual-review
          path: artifacts/premium-v5-mockup/*.png
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v54-server.pid ]; then kill "$(cat /tmp/ft-v54-server.pid)" || true; fi
