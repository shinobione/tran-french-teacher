name: V2.0.0 Freeze tribunal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  v2-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static V2 release contract
        run: |
          node --check src/core/runtime-contracts.js
          node --check src/core/runtime-bridge.js
          node --check tests/smoke/v2-release-smoke.js
          node --check src/core/build-meta.js
          node --check sw.js
          python3 - <<'PY'
          import json
          d=json.load(open('release-v2.json'))
          assert d['format']=='french-tranquille-release-contract'
          assert d['version']=='2.0.0'
          assert d['architectureBuild']==30
          # The original immutable V2 manifest encodes its freeze as status,
          # not the later runtime-only architectureFrozen property.
          assert d['status']=='freeze'
          assert len(d['durableStores'])==6 and len(set(d['durableStores']))==6
          p=d['product']
          assert p['curriculumLessons']==40 and p['curriculumItems']==241
          assert p['scenarioSituations']==36 and p['scenarioTurns']==108
          assert abs(p['listeningNormal']-.88)<1e-9 and abs(p['listeningSlow']-.65)<1e-9
          assert p['maxSpeakingMomentsPerLesson']==2
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY
          grep -Fq "const VERSION = '2.0.0';" src/core/runtime-contracts.js
          grep -Fq 'const BUILD = 30;' src/core/runtime-contracts.js
          grep -q 'maxSpeakingMomentsPerLesson: 2' src/core/runtime-contracts.js
          # Build32 is the live compatibility metadata; freeze remains historical.
          grep -Fq "const CURRENT_META = { version: '2.2.0', build: '32'" src/core/build-meta.js
          # Keep the historical freeze archived without requiring newer README
          # or canonical roadmap to claim that V2 is the current release.
          grep -Fq '2.0.0' CHANGELOG.md
          grep -Fq 'V2.0.0 — PROD / CLOS' docs/V2-RELEASE.md
          grep -Fq 'Architecture           Build 30' docs/V2-RELEASE.md
          grep -Fq 'V2 Freeze' ROADMAP.md
          # Fail on any unreviewed mutation of the certified historical file.
          test "$(git hash-object release-v2.json)" = '478560e8bfcf4de7f594d0b605439604eef3c0ce'

      - name: Historical V2.0.0 literals remain frozen while successor may grow
        run: |
          grep -q 'EXPECTED_LESSONS = 40' tests/smoke/v2-release-smoke.js
          grep -q 'EXPECTED_ITEMS = 241' tests/smoke/v2-release-smoke.js
          grep -q 'EXPECTED_SCENARIOS = 36' tests/smoke/v2-release-smoke.js
          grep -q 'EXPECTED_SCENARIO_TURNS = 108' tests/smoke/v2-release-smoke.js
          # Archived V2 release is written in French; preserve its exact figures.
          grep -Fq '40 leçons / 241 éléments' docs/V2-RELEASE.md
          grep -q '"version": "2.0.0"' release-v2.json
          grep -q '"curriculumLessons": 40' release-v2.json
          grep -q '"curriculumItems": 241' release-v2.json
          grep -q '"scenarioSituations": 36' release-v2.json
          grep -q '"scenarioTurns": 108' release-v2.json
          grep -q '"listeningNormal": 0.88' release-v2.json
          grep -q '"listeningSlow": 0.65' release-v2.json
          grep -q 'Frozen V2 compatibility intentionally observes only the six stores' tests/smoke/v2-release-smoke.js

      - name: Manifest and Service Worker stay on coherent V2.x successors
        run: |
          python3 - <<'PY'
          import json,re
          m=json.load(open('manifest.webmanifest'))
          assert m['name']=='French Trân’quille'
          assert m['short_name']=='Trân’quille'
          assert m['lang']=='vi'
          # Successor PWA is served from the actual GitHub Pages project path;
          # historical relative './' was replaced with this explicit, scoped ID.
          assert m['start_url']=='/tran-french-teacher/'
          assert m['scope']==m['start_url'] and m['id']==m['start_url']
          assert m['display']=='standalone'
          sw=open('sw.js').read()
          cache=re.search(r"const CACHE='([^']+)'",sw)
          assert cache and cache.group(1).startswith('tran-french-teacher-v')
          print('manifest version',m.get('version'),'cache',cache.group(1))
          PY
          grep -q 'manifest.webmanifest?v=' index.html
          grep -q 'tran-french-teacher-v' index.html sw.js
          # The accepted app registers its existing relative SW directly.
          grep -Fq "navigator.serviceWorker.register('./sw.js')" app.js
          # Favicons live in HTML/SW. The manifest owns its separately-sized
          # install icons (192/512/maskable) and need not list a favicon.
          grep -q 'goat-favicon-32.png' index.html sw.js
          grep -q 'goat-app-icon-180.png' index.html sw.js
          grep -q 'goat-app-icon-192.webp' manifest.webmanifest sw.js
          grep -q 'goat-app-icon-512.webp' manifest.webmanifest sw.js
          grep -q 'goat-app-icon-maskable-512.webp' manifest.webmanifest sw.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v2-http.log 2>&1 &
          echo $! >/tmp/ft-v2-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome V2 contract — historical learner survives successor runtime
        run: |
          profile="/tmp/ft-v2-old-user"
          file="/tmp/v2-old-user.html"
          passed=0
          for attempt in 1 2 3; do
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 80s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=32000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&v2Audit=1' >"$file"; then
              continue
            fi
            ok=1
            for marker in \
              'data-v2-ready="1"' \
              'data-v2-version="2.2.0"' \
              'data-v2-build="32"' \
              'data-v2-contract-version="2.0.0"' \
              'data-v2-contract-build="30"' \
              'data-v2-release-format="1"' \
              'data-v2-release-version="2.0.0"' \
              'data-v2-release-build="30"' \
              'data-v2-lessons="40"' \
              'data-v2-items="241"' \
              'data-v2-current-lessons="52"' \
              'data-v2-current-items="313"' \
              'data-v2-current-superset="1"' \
              'data-v2-scenarios="36"' \
              'data-v2-scenario-turns="108"' \
              'data-v2-listening-normal="0.88"' \
              'data-v2-listening-slow="0.65"' \
              'data-v2-speaking-max="2"' \
              'data-v2-durable-stores="6"' \
              'data-v2-recovery-superset="1"' \
              'data-v2-store-agreement="1"' \
              'data-v2-backup-app-version="2.2.0"' \
              'data-v2-backup-app-build="32"' \
              'data-v2-missing-required="0"' \
              'data-v2-old-user-completed="7"' \
              'data-v2-old-user-l8="4"' \
              'data-v2-old-user-known="40"' \
              'data-v2-progress-route="1"' \
              'data-v2-today-route="1"' \
              'data-v2-practice-route="1"' \
              'data-v2-stores-unchanged="1"' \
              'data-v2-backup-matches-runtime="1"' \
              'data-v2-options-matches-runtime="1"' \
              'data-v2-current-compatible="1"' \
              'data-v2-horizontal-overflow="0"' \
              'data-v2-complete="1"'; do
              grep -q "$marker" "$file" || ok=0
            done
            if grep -q 'data-v2-successor-recovery="1"' "$file"; then
              grep -q 'data-v2-recovery-specs="7"' "$file" || ok=0
              grep -q 'data-v2-backup-version="3"' "$file" || ok=0
              grep -q 'data-v2-backup-stores="7"' "$file" || ok=0
            else
              grep -q 'data-v2-recovery-specs="6"' "$file" || ok=0
              grep -q 'data-v2-backup-version="2"' "$file" || ok=0
              grep -q 'data-v2-backup-stores="6"' "$file" || ok=0
            fi
            grep -q 'data-v2-options-version="v2.2.0 • Build 32"' "$file" || ok=0
            if [ "$ok" = 1 ]; then passed=1; break; fi
            grep -o 'data-v2-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Chrome V2 contract — clean successor boot is complete
        run: |
          profile="/tmp/ft-v2-clean"
          file="/tmp/v2-clean.html"
          passed=0
          for attempt in 1 2 3; do
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 80s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=32000 --dump-dom \
              'http://127.0.0.1:4173/?debug=fr&v2Audit=1' >"$file"; then
              continue
            fi
            ok=1
            grep -q 'data-v2-ready="1"' "$file" || ok=0
            grep -q 'data-v2-version="2.2.0"' "$file" || ok=0
            grep -q 'data-v2-build="32"' "$file" || ok=0
            grep -q 'data-v2-current-lessons="52"' "$file" || ok=0
            grep -q 'data-v2-current-items="313"' "$file" || ok=0
            grep -q 'data-v2-current-superset="1"' "$file" || ok=0
            grep -q 'data-v2-store-agreement="1"' "$file" || ok=0
            grep -q 'data-v2-recovery-superset="1"' "$file" || ok=0
            grep -q 'data-v2-current-compatible="1"' "$file" || ok=0
            grep -q 'data-v2-complete="1"' "$file" || ok=0
            if grep -q 'data-v2-successor-recovery="1"' "$file"; then
              grep -q 'data-v2-recovery-specs="7"' "$file" || ok=0
              grep -q 'data-v2-backup-version="3"' "$file" || ok=0
              grep -q 'data-v2-backup-stores="7"' "$file" || ok=0
            else
              grep -q 'data-v2-recovery-specs="6"' "$file" || ok=0
              grep -q 'data-v2-backup-version="2"' "$file" || ok=0
              grep -q 'data-v2-backup-stores="6"' "$file" || ok=0
            fi
            if [ "$ok" = 1 ]; then passed=1; break; fi
            grep -o 'data-v2-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v2-server.pid ]; then kill "$(cat /tmp/ft-v2-server.pid)" || true; fi
