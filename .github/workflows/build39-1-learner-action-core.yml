name: Build 39.1 Learner action arbitration core

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  learner-action-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax + pure arbitration contract
        run: |
          set -euo pipefail
          node --check src/pedagogy/learner-intelligence-v3-core.js
          node --check tests/unit/build39-1-learner-action-core.test.cjs
          node tests/unit/build39-1-learner-action-core.test.cjs
          ! grep -Eq 'localStorage|sessionStorage|indexedDB|FrenchTranquilleEvidence|fetch\(' src/pedagogy/learner-intelligence-v3-core.js
          ! grep -Eq 'activityCount' src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "'phrase-retrieval'" src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "'concept-review'" src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "'foundation-capsule'" src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "'transfer-construction'" src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "recognition-failure-only" src/pedagogy/learner-intelligence-v3-core.js
          grep -Fq "insufficient-reliable-evidence" src/pedagogy/learner-intelligence-v3-core.js

      - name: Existing release + Build38 predecessor remain certified
        run: |
          set -euo pipefail
          node tools/test-release-v2-5-build38.cjs
          node tools/test-build38-10-spoken-on-integration.cjs

      - name: 39.1 scope guard — pure core only
        if: github.event_name == 'pull_request' && github.head_ref == 'build39/learner-action-arbitration-core'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(src/pedagogy/learner-intelligence-v3-core\.js|tests/unit/build39-1-learner-action-core\.test\.cjs|\.github/workflows/build39-1-learner-action-core\.yml|docs/BUILD-39\.1-LEARNER-ACTION-ARBITRATION\.md|PROJECT-STATE\.md|MASTER-ROADMAP\.md)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected path(s) in Build39.1 pure-core slice:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --exit-code "origin/${{ github.base_ref }}"...HEAD -- \
            app.js voice-ios.js free-voice.js assets/LOGO.png assets/Favicon.png \
            index.html sw.js manifest.webmanifest \
            src/core src/ui src/premium \
            src/pedagogy/learner-intelligence.js \
            src/pedagogy/learner-intelligence-v2.js \
            src/pedagogy/learner-intelligence-smoke.js \
            src/pedagogy/memory-evidence-v2-core.js \
            src/pedagogy/foundations-core.js \
            src/pedagogy/foundations-capsule-engine.js \
            src/pedagogy/generalization-transfer-core.js \
            src/pedagogy/generalization-transfer-lesson.js

      - name: Frozen sanctuaries stay byte-identical
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
