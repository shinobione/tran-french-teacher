name: Build 28 Data recovery smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  data-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, pure recovery tests and wiring
        run: |
          node --check data-recovery-core.js
          node --check data-recovery.js
          node --check data-recovery-smoke.js
          node --check build-meta.js
          node --check sw.js
          node tools/test-build28-data-recovery.cjs
          grep -q 'data-recovery-core.js?v=1.21.0-b28' index.html
          grep -q 'data-recovery.js?v=1.21.0-b28' index.html
          grep -q 'data-recovery-smoke.js?v=1.21.0-b28' index.html
          grep -q 'build-meta.js?v=1.21.0-b28' index.html
          grep -q "version: '1.21.0', build: '28'" build-meta.js
          grep -q 'tran-french-teacher-v1.21.0-b28-data-recovery' index.html sw.js
          grep -q 'data-recovery-core.js' sw.js
          grep -q 'data-recovery.js' sw.js
          grep -q 'data-recovery-smoke.js' sw.js

      - name: Durable-store contract is explicit
        run: |
          grep -q "francais-avec-luc:learner:v1" data-recovery-core.js
          grep -q "french-tranquille:learning-memory:v1" data-recovery-core.js
          grep -q "french-tranquille:error-intelligence:v1" data-recovery-core.js
          grep -q "french-tranquille:scenarios:v1" data-recovery-core.js
          grep -q "french-tranquille:listening:v1" data-recovery-core.js
          grep -q "french-tranquille:milestones:v1" data-recovery-core.js
          grep -q "french-tranquille:recovery:last-good:v1" data-recovery.js
          grep -q "french-tranquille:recovery:pre-restore:v1" data-recovery.js
          grep -q "french-tranquille:recovery:pre-migration:v1" data-recovery.js
          grep -q "french-tranquille:recovery:pre-reset:v1" data-recovery.js
          grep -q "french-tranquille:recovery:quarantine:v1" data-recovery.js
          grep -q "french-tranquille:safety:pre-build22:v1" data-recovery.js

      - name: Learner, voice and branding sanctuaries remain byte-identical
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js data-recovery-core.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b28-http.log 2>&1 &
          echo $! >/tmp/ft-b28-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — corrupt writes are blocked and full backup round-trips
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b28-recovery-$attempt"
            file="/tmp/b28-recovery-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 60s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=30000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b28Smoke=recovery' >"$file"; then
              continue
            fi
            ok=1
            for marker in \
              'data-b28-smoke-done="1"' \
              'data-b28-guard-preserved="1"' \
              'data-b28-blocked-write="1"' \
              'data-b28-backup-complete="1"' \
              'data-b28-restore-ok="1"' \
              'data-b28-legacy-migration="1"' \
              'data-b28-reset-atomic="1"' \
              'data-b28-reset-restore="1"' \
              'data-b28-quarantine="1"'; do
              grep -q "$marker" "$file" || ok=0
            done
            grep -q 'b27-app-shell' "$file" || ok=0
            if [ "$ok" = 1 ]; then passed=1; break; fi
            grep -o 'data-b28-[^ >]*' "$file" | head -40 || true
          done
          test "$passed" = 1

      - name: Chrome — corrupted learner storage is repaired before app boot
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b28-boot-$attempt"
            file="/tmp/b28-boot-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 45s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=18000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b28BootSmoke=corrupt' >"$file"; then
              continue
            fi
            ok=1
            grep -q 'data-b28-boot-repair="1"' "$file" || ok=0
            grep -q 'data-b28-boot-quarantine="1"' "$file" || ok=0
            grep -q 'b27-app-shell' "$file" || ok=0
            grep -q 'French Trân’quille n’a pas démarré' "$file" && ok=0 || true
            if [ "$ok" = 1 ]; then passed=1; break; fi
          done
          test "$passed" = 1

      - name: Chrome mobile — Build 27 learner shell remains intact
        run: |
          profile="/tmp/ft-b28-mobile"
          file="/tmp/b28-mobile.html"
          rm -rf "$profile" "$file"
          timeout --signal=TERM --kill-after=5s 45s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --user-data-dir="$profile" --window-size=390,844 \
            --virtual-time-budget=18000 --dump-dom \
            'http://127.0.0.1:4173/?uxSmoke=lesson8&b27Smoke=home' >"$file"
          grep -q 'data-b27-home-ready="1"' "$file"
          grep -q 'data-b27-home-overflow="0"' "$file"
          grep -q 'data-b27-home-primary-buttons="1"' "$file"
          grep -q 'data-b27-home-quick-actions="2"' "$file"

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b28-server.pid ]; then kill "$(cat /tmp/ft-b28-server.pid)" || true; fi