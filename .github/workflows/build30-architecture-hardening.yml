name: Build 30 Architecture hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static architecture contracts
        run: |
          node --check runtime-contracts.js
          node --check runtime-bridge.js
          node --check build30-architecture-smoke.js
          node --check build-meta.js
          node --check sw.js
          grep -q "const VERSION = '1.23.0'" runtime-contracts.js
          grep -q 'const BUILD = 30' runtime-contracts.js
          grep -q "version: '1.23.0', build: '30'" build-meta.js
          grep -q "import './runtime-contracts.js?v=1.23.0-b30'" build-meta.js
          grep -q "import './runtime-bridge.js?v=1.23.0-b30'" build-meta.js
          grep -Fq 'runtime-contracts.js?v=${B30}' sw.js
          grep -Fq 'runtime-bridge.js?v=${B30}' sw.js
          grep -Fq 'build30-architecture-smoke.js?v=${B30}' sw.js
          grep -q "learner: 'francais-avec-luc:learner:v1'" runtime-contracts.js
          grep -q 'lessons: 40' runtime-contracts.js
          grep -q 'items: 241' runtime-contracts.js
          grep -q 'scenarios: 36' runtime-contracts.js
          grep -q 'scenarioTurns: 108' runtime-contracts.js
          grep -q 'listeningNormal: 0.88' runtime-contracts.js
          grep -q 'listeningSlow: 0.65' runtime-contracts.js
          ! grep -q 'localStorage.setItem' runtime-contracts.js
          ! grep -q 'localStorage.setItem' runtime-bridge.js

      - name: Legacy core, voice and branding sanctuaries stay byte-identical
        run: |
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b30-http.log 2>&1 &
          echo $! >/tmp/ft-b30-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome desktop — runtime boundary owns contracts without learner writes
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b30-desktop-$attempt"
            file="/tmp/b30-desktop-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 65s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size=1440,900 \
              --virtual-time-budget=36000 --dump-dom \
              'http://127.0.0.1:4173/?debug=fr&b30Audit=1' >"$file" || true
            ok=1
            for marker in \
              'data-b30-complete="1"' \
              'data-b30-runtime-ready="1"' \
              'data-b30-version="1.23.0-30"' \
              'data-b30-lessons="40"' \
              'data-b30-items="241"' \
              'data-b30-missing-required="0"' \
              'data-b30-owner-unique="1"' \
              'data-b30-store-unique="1"' \
              'data-b30-learner-key="1"' \
              'data-b30-product-contract="1"' \
              'data-b30-speaking-ready="1"' \
              'data-b30-recovery-ready="1"' \
              'data-b30-shell-ready="1"' \
              'data-b30-progress-route="1"' \
              'data-b30-home-route="1"' \
              'data-b30-practice-route="1"' \
              'data-b30-learner-unchanged="1"' \
              'data-b30-nav-single-active="1"' \
              'data-b30-horizontal-overflow="0"'; do
              grep -q "$marker" "$file" || ok=0
            done
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then ok=0; fi
            if [ "$ok" = 1 ]; then passed=1; break; fi
            echo '=== Build 30 desktop markers ==='
            grep -o 'data-b30-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Chrome mobile 390x844 — same boundary, no overflow
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b30-mobile-$attempt"
            file="/tmp/b30-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 65s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=36000 --dump-dom \
              'http://127.0.0.1:4173/?b30Audit=1' >"$file" || true
            ok=1
            grep -q 'data-b30-complete="1"' "$file" || ok=0
            grep -q 'data-b30-runtime-ready="1"' "$file" || ok=0
            grep -q 'data-b30-learner-unchanged="1"' "$file" || ok=0
            grep -q 'data-b30-horizontal-overflow="0"' "$file" || ok=0
            grep -q 'data-b30-nav-single-active="1"' "$file" || ok=0
            if [ "$ok" = 1 ]; then passed=1; break; fi
            echo '=== Build 30 mobile markers ==='
            grep -o 'data-b30-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b30-server.pid ]; then kill "$(cat /tmp/ft-b30-server.pid)" || true; fi
