name: Build 26.8 Progress focus flow smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  progress-focus-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, version, cache and wiring
        run: |
          node --check build26-8-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'build26-8-ux.css?v=1.19.8-b26.8' index.html
          grep -q 'build26-8-ux.js?v=1.19.8-b26.8' index.html
          grep -q 'build-meta.js?v=1.19.8-b26.8' index.html
          grep -q "version: '1.19.8', build: '26.8'" build-meta.js
          grep -q 'FrenchTranquilleBuild268UX' build-meta.js
          grep -q 'tran-french-teacher-v1.19.8-b26.8-progress-focus-flow' index.html sw.js
          grep -q 'build26-8-ux.css' sw.js
          grep -q 'build26-8-ux.js' sw.js
          grep -q 'data-b268-focus="details"' build26-8-ux.css
          grep -q 'data-b268-focus="curriculum"' build26-8-ux.css

      - name: Learner, voice and branding sanctuaries remain byte-identical
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b268-http.log 2>&1 &
          echo $! >/tmp/ft-b268-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome desktop — Details family owns the viewport
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b268-details-$attempt"
            file="/tmp/b268-details-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 48s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1640,900 \
              --virtual-time-budget=34000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b268Smoke=details' >"$file"; then
              echo "Build 26.8 details attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -q 'data-b268-complete="1"' "$file" \
              && grep -q 'data-b268-focus-state="details"' "$file" \
              && grep -q 'data-b268-flow-hidden="1"' "$file" \
              && grep -q 'data-b268-grid-hidden="1"' "$file" \
              && grep -q 'data-b268-active-panel="1"' "$file" \
              && grep -q 'data-b268-toolbar-visible="1"' "$file" \
              && grep -q 'data-b268-horizontal-overflow="0"' "$file" \
              && grep -q 'data-b268-containment="1"' "$file"; then
              width=$(grep -o 'data-b268-target-width="[0-9]*"' "$file" | head -1 | cut -d'"' -f2)
              echo "details focus width=$width"
              if [ "${width:-0}" -ge 900 ]; then passed=1; break; fi
            fi
            echo "Build 26.8 details focus missing/invalid"
            grep -o 'data-b268-[^ >]*' "$file" | head -40 || true
          done
          test "$passed" = 1

      - name: Chrome desktop — full curriculum owns the viewport
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b268-curriculum-$attempt"
            file="/tmp/b268-curriculum-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 48s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1640,900 \
              --virtual-time-budget=34000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b268Smoke=curriculum' >"$file"; then
              echo "Build 26.8 curriculum attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -q 'data-b268-complete="1"' "$file" \
              && grep -q 'data-b268-focus-state="curriculum"' "$file" \
              && grep -q 'data-b268-overview-hidden="1"' "$file" \
              && grep -q 'data-b268-details-hidden="1"' "$file" \
              && grep -q 'data-b268-curriculum-visible="1"' "$file" \
              && grep -q 'data-b268-toolbar-visible="1"' "$file" \
              && grep -q 'data-b268-horizontal-overflow="0"' "$file" \
              && grep -q 'data-b268-containment="1"' "$file"; then
              width=$(grep -o 'data-b268-target-width="[0-9]*"' "$file" | head -1 | cut -d'"' -f2)
              echo "curriculum focus width=$width"
              if [ "${width:-0}" -ge 900 ]; then passed=1; break; fi
            fi
            echo "Build 26.8 curriculum focus missing/invalid"
            grep -o 'data-b268-[^ >]*' "$file" | head -40 || true
          done
          test "$passed" = 1

      - name: Chrome desktop — focus roundtrip restores compact human view
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b268-roundtrip-$attempt"
            file="/tmp/b268-roundtrip-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 52s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1640,900 \
              --virtual-time-budget=38000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b268Smoke=roundtrip' >"$file"; then
              echo "Build 26.8 roundtrip attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -q 'data-b268-roundtrip-complete="1"' "$file" \
              && grep -q 'data-b268-roundtrip-compact-rows="5"' "$file" \
              && grep -q 'data-b268-roundtrip-details-active=""' "$file" \
              && grep -q 'data-b268-roundtrip-focus=""' "$file"; then
              passed=1
              break
            fi
            echo "Build 26.8 focus roundtrip failed"
            grep -o 'data-b268-roundtrip-[^ >]*' "$file" | head -20 || true
          done
          test "$passed" = 1

      - name: Chrome mobile — detail focus stays single-column and overflow-free
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b268-mobile-$attempt"
            file="/tmp/b268-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 48s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=34000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b268Smoke=details' >"$file"; then
              continue
            fi
            if grep -q 'data-b268-complete="1"' "$file" \
              && grep -q 'data-b268-focus-state="details"' "$file" \
              && grep -q 'data-b268-toolbar-visible="1"' "$file" \
              && grep -q 'data-b268-horizontal-overflow="0"' "$file" \
              && grep -q 'data-b268-containment="1"' "$file"; then
              width=$(grep -o 'data-b268-target-width="[0-9]*"' "$file" | head -1 | cut -d'"' -f2)
              echo "mobile detail width=$width"
              if [ "${width:-0}" -ge 320 ]; then passed=1; break; fi
            fi
          done
          test "$passed" = 1

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b268-server.pid ]; then kill "$(cat /tmp/ft-b268-server.pid)" || true; fi
