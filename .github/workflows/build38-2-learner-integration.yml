name: Build 38.2 Learner-facing subject substitution

on:
  pull_request:
    branches: [main]
  push:
    branches: [build38/learner-facing-substitution]

permissions:
  contents: read

jobs:
  learner-facing-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax + 38.1 predecessor + 38.2 contract
        run: |
          set -euo pipefail
          node --check src/pedagogy/generalization-transfer-core.js
          node --check src/pedagogy/generalization-transfer-lesson.js
          node --check src/core/build32-loader.js
          node --check sw.js
          node --check tools/test-build38-2-learner-integration.cjs
          node tools/test-build38-1-subject-substitution.cjs
          node tools/test-build38-2-learner-integration.cjs

      - name: 38.2 stays lesson-33 contextual, deterministic and ephemeral
        run: |
          set -euo pipefail
          grep -q "const LESSON=33" src/pedagogy/generalization-transfer-lesson.js
          grep -q "EXERCISE_INDEXES=Object.freeze(\[0,2,5\])" src/pedagogy/generalization-transfer-lesson.js
          grep -q "status:'learner-facing-contextual'" src/pedagogy/generalization-transfer-lesson.js
          grep -q "family:core.family.id" src/pedagogy/generalization-transfer-lesson.js
          grep -q "persistent:false" src/pedagogy/generalization-transfer-lesson.js
          grep -q "masteryClaim:false" src/pedagogy/generalization-transfer-lesson.js
          grep -q "generalization-transfer-core.js?v=\${TRANSFER}" src/core/build32-loader.js
          grep -q "generalization-transfer-lesson.js?v=\${TRANSFER}" src/core/build32-loader.js
          grep -q "generalization-transfer-core.js?v=\${B382}" sw.js
          grep -q "generalization-transfer-lesson.js?v=\${B382}" sw.js
          ! grep -q 'Math.random' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'localStorage.setItem' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'sessionStorage.setItem' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'indexedDB' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'french-tranquille:memory-evidence:v2' src/pedagogy/generalization-transfer-lesson.js

      - name: Build 37 owners, learner stores, voice, curriculum and navigation stay untouched
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          forbidden='^(app\.js|voice-ios\.js|free-voice\.js|index\.html|manifest\.webmanifest|src/core/data-recovery|src/core/memory-evidence-v2-runtime\.js|src/pedagogy/memory-evidence-v2-core\.js|src/pedagogy/curriculum-stage[234]\.js|src/pedagogy/learning-memory\.js|src/pedagogy/error-intelligence\.js|src/pedagogy/listening-engine\.js|src/pedagogy/scenario-engine\.js|src/pedagogy/mastery-engine\.js|src/pedagogy/learner-intelligence.*\.js|src/pedagogy/foundations-core\.js|src/pedagogy/foundations-capsule-engine\.js|src/pedagogy/foundations-capsules\.js|src/pedagogy/foundations-pilot\.js|src/ui/|src/premium/|assets/LOGO\.png|assets/Favicon\.png)$'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo 'Build 38.2 must only wire the certified transfer family into the existing lesson surface' >&2
            exit 1
          fi

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b382-http.log 2>&1 &
          echo $! >/tmp/ft-b382-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — F08 predecessor still owns lessons 32-33
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2; do
            profile="/tmp/ft-b382-f08-$attempt"; file="/tmp/b382-f08-$attempt.html"
            rm -rf "$profile" "$file"
            if timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 --virtual-time-budget=10000 --dump-dom \
              'http://127.0.0.1:4173/tests/browser/build37-6-foundations-regular-er.html?debug=fr' >"$file" \
              && grep -q 'data-b376-done="1"' "$file" \
              && grep -q 'data-b376-f08="1"' "$file" \
              && grep -q 'data-b376-storage-unchanged="1"' "$file" \
              && ! grep -q 'data-b376-error=' "$file"; then passed=1; break; fi
          done
          test "$passed" -eq 1

      - name: Chrome — 38.1 pure core remains exact
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2; do
            profile="/tmp/ft-b382-b381-$attempt"; file="/tmp/b382-b381-$attempt.html"
            rm -rf "$profile" "$file"
            if timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 --virtual-time-budget=9000 --dump-dom \
              'http://127.0.0.1:4173/tests/browser/build38-1-subject-substitution.html?debug=vi' >"$file" \
              && grep -q 'data-b381-done="1"' "$file" \
              && grep -q 'data-b381-family="subject-substitution-regular-er"' "$file" \
              && grep -q 'data-b381-exercises="6"' "$file" \
              && grep -q 'data-b381-storage-unchanged="1"' "$file" \
              && ! grep -q 'data-b381-error=' "$file"; then passed=1; break; fi
          done
          test "$passed" -eq 1

      - name: Chrome — 38.2 VI/FR desktop + iPhone lesson round-trip
        run: |
          set -euo pipefail
          for spec in 'vi 1280 900' 'fr 1280 900' 'vi 390 844' 'fr 390 844'; do
            set -- $spec; locale="$1"; width="$2"; height="$3"; passed=0; file=''
            for attempt in 1 2; do
              profile="/tmp/ft-b382-${locale}-${width}-$attempt"
              file="/tmp/b382-${locale}-${width}-$attempt.html"
              rm -rf "$profile" "$file"
              if timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
                --user-data-dir="$profile" --window-size="$width,$height" --virtual-time-budget=11000 --dump-dom \
                "http://127.0.0.1:4173/tests/browser/build38-2-learner-integration.html?debug=$locale" >"$file" \
                && grep -q 'data-b382-done="1"' "$file" \
                && grep -q "data-b382-locale=\"$locale\"" "$file" \
                && grep -q 'data-b382-family="subject-substitution-regular-er"' "$file" \
                && grep -q 'data-b382-exercises="3"' "$file" \
                && grep -q 'data-b382-lesson="33"' "$file" \
                && grep -q 'data-b382-foundation-coexists="1"' "$file" \
                && grep -q 'data-b382-routing="1"' "$file" \
                && grep -q 'data-b382-continued="1"' "$file" \
                && grep -q 'data-b382-storage-unchanged="1"' "$file" \
                && grep -q 'data-b382-no-overflow="1"' "$file" \
                && ! grep -q 'data-b382-error=' "$file"; then passed=1; break; fi
            done
            if [ "$passed" -ne 1 ]; then
              echo "38.2 tribunal failed for $locale ${width}x${height}" >&2
              grep -o 'data-b382-[^ >]*="[^"]*"' "$file" >&2 || true
              grep -o 'data-b382-error="[^"]*"' "$file" >&2 || true
              exit 1
            fi
          done

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b382-server.pid ]; then kill "$(cat /tmp/ft-b382-server.pid)" || true; fi
