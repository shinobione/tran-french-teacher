name: TEMP Repo layout runtime rewire

on:
  push:
    branches: [refactor/repo-structure]

permissions:
  contents: write

jobs:
  rewire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/repo-structure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewire runtime/document URLs semantically
        run: python3 tools/_repo_layout_runtime_rewire_temp.py
      - name: Commit runtime rewiring only
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'fix: rewire runtime URLs after repository layout move'
          git push origin HEAD:refactor/repo-structure
