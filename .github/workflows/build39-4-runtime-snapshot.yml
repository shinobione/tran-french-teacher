name: Build 39.4 Runtime snapshot collector

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax + certified Build39 chain
        run: |
          set -euo pipefail
          node --check src/pedagogy/learner-action-runtime-snapshot.js
          node --check src/core/build32-loader.js
          node --check sw.js
          node --check tests/unit/build39-4-runtime-snapshot.test.cjs
          node tests/unit/build39-1-learner-action-core.test.cjs
          node tests/unit/build39-2-evidence-adapter.test.cjs
          node tests/unit/build39-3-decision-pipeline.test.cjs
          node tests/unit/build39-4-runtime-snapshot.test.cjs

      - name: 39.4 read-only runtime contract
        run: |
          set -euo pipefail
          grep -Fq "'39.4'" src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq "'3.0.0-runtime-snapshot'" src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'FrenchTranquilleMemory' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'FrenchTranquilleErrors' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'FrenchTranquilleLearnerActionDecisionPipeline' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq "'runtime-snapshot-dependencies-missing'" src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'runtimeReadWiring: true' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'learnerFacingWiring: false' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'evidenceV2ReadCutover: false' src/pedagogy/learner-action-runtime-snapshot.js
          grep -Fq 'durableWrite: false' src/pedagogy/learner-action-runtime-snapshot.js
          ! grep -Eq 'localStorage|sessionStorage|indexedDB|FrenchTranquilleEvidence|fetch\(' src/pedagogy/learner-action-runtime-snapshot.js
          ! grep -Eq 'FrenchTranquilleListening|FrenchTranquilleScenarios|FrenchTranquilleFoundations|FrenchTranquilleGeneralization' src/pedagogy/learner-action-runtime-snapshot.js
          ! grep -Fq 'activityCount' src/pedagogy/learner-action-runtime-snapshot.js

      - name: Runtime loader + offline order is successor-safe
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('src/core/build32-loader.js','utf8');
          const order=[
            'learner-action-arbitration-core.js',
            'learner-evidence-adapter.js',
            'learner-action-decision-pipeline.js',
            'learner-action-runtime-snapshot.js'
          ];
          let previous=-1;
          for(const token of order){
            const at=loader.indexOf(token);
            if(at<0 || at<=previous) throw new Error(`Build39 runtime load order invalid at ${token}`);
            previous=at;
          }
          if(!loader.includes("version:'2.5.0'")) throw new Error('public runtime SemVer moved');
          if(!loader.includes("build:'38'")) throw new Error('public runtime Build moved');
          if(/FrenchTranquilleLearnerActionRuntimeSnapshot\?\.decide|FrenchTranquilleLearnerActionRuntimeSnapshot\.decide/.test(loader)) {
            throw new Error('39.4 must not auto-decide at boot');
          }
          NODE
          grep -Fq 'learner-action-arbitration-core.js?v=${B391}' sw.js
          grep -Fq 'learner-evidence-adapter.js?v=${B392}' sw.js
          grep -Fq 'learner-action-decision-pipeline.js?v=${B393}' sw.js
          grep -Fq 'learner-action-runtime-snapshot.js?v=${B394}' sw.js

      - name: Existing release + Build38 predecessor remain certified
        run: |
          set -euo pipefail
          node tools/test-release-v2-5-build38.cjs
          node tools/test-build38-10-spoken-on-integration.cjs

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b394-http.log 2>&1 &
          echo $! >/tmp/ft-b394-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — real runtime snapshot + decision tribunal
        run: |
          set -euo pipefail
          for size in 1280,900 390,844; do
            passed=0
            for attempt in 1 2; do
              profile="/tmp/ft-b394-${size//,/-}-$attempt"
              file="/tmp/b394-${size//,/-}-$attempt.html"
              rm -rf "$profile" "$file"
              timeout --signal=TERM --kill-after=5s 75s \
                google-chrome --headless=new --no-sandbox --disable-gpu \
                --disable-background-timer-throttling --disable-renderer-backgrounding \
                --user-data-dir="$profile" --window-size="$size" \
                --virtual-time-budget=36000 --dump-dom \
                'http://127.0.0.1:4173/tests/browser/build39-4-runtime-snapshot.html' >"$file" || true
              ok=1
              for marker in \
                'data-b394-done="1"' \
                'data-b394-runtime-ready="1"' \
                'data-b394-retrieval="1"' \
                'data-b394-recognition-abstain="1"' \
                'data-b394-immutable="1"' \
                'data-b394-stores-unchanged="1"' \
                'data-b394-owners-unchanged="1"' \
                'data-b394-continuity="1"' \
                'data-b394-unavailable="1"'; do
                grep -q "$marker" "$file" || ok=0
              done
              if grep -q 'data-b394-error=' "$file"; then ok=0; fi
              if [ "$ok" = 1 ]; then passed=1; break; fi
              echo "=== Build39.4 markers for $size attempt $attempt ==="
              grep -o 'data-b394-[^ >]*="[^"]*"' "$file" | head -80 || true
            done
            test "$passed" = 1
          done

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b394-server.pid ]; then kill "$(cat /tmp/ft-b394-server.pid)" || true; fi

      - name: 39.4 scope guard — runtime read only
        if: github.event_name == 'pull_request' && github.head_ref == 'build39/runtime-snapshot-collector'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(src/pedagogy/learner-action-runtime-snapshot\.js|tests/unit/build39-4-runtime-snapshot\.test\.cjs|tests/browser/build39-4-runtime-snapshot\.html|\.github/workflows/build39-4-runtime-snapshot\.yml|src/core/build32-loader\.js|sw\.js|docs/BUILD-39\.4-RUNTIME-SNAPSHOT-AUDIT\.md|PROJECT-STATE\.md)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected path(s) in Build39.4 runtime-snapshot slice:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --exit-code "origin/${{ github.base_ref }}"...HEAD -- \
            app.js voice-ios.js free-voice.js assets/LOGO.png assets/Favicon.png \
            index.html manifest.webmanifest \
            src/core/runtime-contracts.js src/core/runtime-bridge.js \
            src/pedagogy/learner-action-arbitration-core.js \
            src/pedagogy/learner-evidence-adapter.js \
            src/pedagogy/learner-action-decision-pipeline.js \
            src/pedagogy/learner-intelligence.js \
            src/pedagogy/learner-intelligence-v2.js \
            src/pedagogy/learning-memory.js \
            src/pedagogy/error-intelligence.js \
            src/pedagogy/listening-engine.js \
            src/pedagogy/scenario-engine.js \
            src/pedagogy/memory-evidence-v2-core.js \
            src/pedagogy/foundations-core.js \
            src/pedagogy/foundations-capsule-engine.js \
            src/pedagogy/foundations-pilot.js \
            src/pedagogy/generalization-transfer-core.js \
            src/pedagogy/generalization-transfer-lesson.js \
            src/ui src/premium
          base_cache="$(git show "origin/${{ github.base_ref }}:sw.js" | sed -n "s/^const CACHE='\([^']*\)';/\1/p")"
          head_cache="$(sed -n "s/^const CACHE='\([^']*\)';/\1/p" sw.js)"
          test "$base_cache" = "$head_cache"

      - name: Frozen sanctuaries stay byte-identical
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
