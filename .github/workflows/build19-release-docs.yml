name: Build19 release docs closure

on:
  push:
    branches: [build19-release-docs]

permissions:
  contents: write

jobs:
  close:
    if: "!contains(github.event.head_commit.message, '[build19-release-docs]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build19-release-docs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Close Build 19 documentation
        run: python tools/close-build19.py
      - name: Remove one-shot closure helpers
        run: |
          rm -f .github/workflows/build19-release-docs.yml
          rm -f tools/close-build19.py
      - name: Commit release docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release documentation changes.'
            exit 0
          fi
          git commit -m 'docs: close Build 19 release [build19-release-docs]'
          git push origin HEAD:build19-release-docs
