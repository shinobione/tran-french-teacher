name: V5.9 docs closeout apply

on:
  push:
    branches:
      - docs/v59-technical-closeout
    paths:
      - tools/v59_docs_closeout.py
      - .github/workflows/v59-docs-closeout-apply.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v59-technical-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical V5.9 closeout
        run: python tools/v59_docs_closeout.py
      - name: Commit reconciled docs and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v59-docs-closeout-apply.yml tools/v59_docs_closeout.py
          git add PROJECT-STATE.md MASTER-ROADMAP.md CHANGELOG.md README.md ROADMAP.md
          git diff --cached --check
          git commit -m 'docs: close V5.9 technical line and hand off V5.10 field gate'
          git push origin HEAD:docs/v59-technical-closeout
