name: Build 29.1 Speaking loop content smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  speaking-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, wiring and pedagogical contract
        run: |
          node --check speaking-loop-content.js
          node --check speaking-loop-smoke.js
          node --check build-meta.js
          node --check sw.js
          grep -q "version: '1.22.1', build: '29.1'" build-meta.js
          grep -q 'speaking-loop-content.css?v=1.22.1-b29.1' build-meta.js sw.js
          grep -q 'speaking-loop-content.js?v=1.22.1-b29.1' build-meta.js sw.js
          grep -q 'speaking-loop-smoke.js?v=1.22.1-b29.1' build-meta.js sw.js
          grep -q 'maxMoments: 2' speaking-loop-content.js
          grep -q 'Aucun faux score de prononciation' speaking-loop-content.js
          ! grep -E -q '([0-9]{1,3}[[:space:]]*%.*prononciation|prononciation.*[0-9]{1,3}[[:space:]]*%)' speaking-loop-content.js

      - name: Learner, voice, branding and durable data sanctuaries stay intact
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js data-recovery-core.js
          grep -q "french-tranquille:learning-memory:v1" data-recovery-core.js
          grep -q "french-tranquille:listening:v1" data-recovery-core.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Curriculum and content cardinality remain canonical
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          if(!app.includes("window.FrenchTranquilleCurriculum")) throw new Error('curriculum API missing');
          const loop=fs.readFileSync('speaking-loop-content.js','utf8');
          if(!loop.includes('selectionForLesson') || !loop.includes('coverage')) throw new Error('selection API missing');
          console.log('speaking-loop selection API present');
          NODE

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b291-http.log 2>&1 &
          echo $! >/tmp/ft-b291-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome desktop — real lesson gets teach + final speaking moments
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b291-desktop-$attempt"
            file="/tmp/b291-desktop-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 55s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=28000 --dump-dom \
              'http://127.0.0.1:4173/?debug=fr&b291Smoke=lesson' >"$file" || true
            ok=1
            grep -q 'data-b291-smoke-complete="1"' "$file" || ok=0
            grep -q 'data-b291-coverage-lessons="40"' "$file" || ok=0
            grep -q 'data-b291-coverage-covered="40"' "$file" || ok=0
            grep -q 'data-b291-coverage-max="2"' "$file" || ok=0
            grep -q 'data-b291-teach-ready="1"' "$file" || ok=0
            grep -q 'data-b291-challenge-ready="1"' "$file" || ok=0
            grep -q 'data-b291-no-pronunciation-score="1"' "$file" || ok=0
            grep -q 'speaking-loop-model' "$file" || ok=0
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then ok=0; fi
            if [ "$ok" = 1 ]; then passed=1; break; fi
            echo '=== Build 29.1 markers ==='
            grep -o 'data-b291-[^ >]*' "$file" | head -40 || true
          done
          test "$passed" = 1

      - name: Chrome mobile 390x844 — speaking loop stays tappable and overflow-free
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b291-mobile-$attempt"
            file="/tmp/b291-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 55s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=28000 --dump-dom \
              'http://127.0.0.1:4173/?b291Smoke=lesson' >"$file" || true
            ok=1
            grep -q 'data-b291-smoke-complete="1"' "$file" || ok=0
            grep -q 'data-b291-horizontal-overflow="0"' "$file" || ok=0
            target=$(grep -o 'data-b291-teach-min-target="[0-9]*"' "$file" | head -1 | cut -d'"' -f2)
            echo "Build29.1 mobile min target=${target:-0}px"
            [ "${target:-0}" -ge 44 ] || ok=0
            if [ "$ok" = 1 ]; then passed=1; break; fi
            grep -o 'data-b291-[^ >]*' "$file" | head -40 || true
          done
          test "$passed" = 1

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b291-server.pid ]; then kill "$(cat /tmp/ft-b291-server.pid)" || true; fi
