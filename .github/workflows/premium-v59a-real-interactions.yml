name: Premium V5.9A Real Interaction Ownership

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v59a-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static contracts and sanctuaries
        run: |
          set -euo pipefail
          test -s premium-v59-interactions.js
          test -s premium-v59-interactions.css
          test -s premium-v59-interactions-tribunal.html
          node --check premium-v59-interactions.js
          node --check theme-controller.js
          grep -q "const V59A='2.3.23-v59a1'" theme-controller.js
          grep -q 'premium-v59-interactions.css' theme-controller.js
          grep -q 'premium-v59-interactions.js' theme-controller.js
          grep -q 'ft-v59-speaking-owner' premium-v59-interactions.js premium-v59-interactions.css
          grep -q 'data-v55-about-toggle' premium-v59-interactions.js
          grep -q 'ft-v59-real-life-svg' premium-v59-interactions.js premium-v59-interactions.css
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object voice-replay.js)" = "a0dda64e61fa3cd5a788d9b19ebb3307f31ff29d"
          test "$(git hash-object speaking-loop-content.js)" = "beda16a5412c0fdc32ff90287d745eccb3568b03"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v59a-http.log 2>&1 &
          echo $! >/tmp/ft-v59a-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — focused interaction ownership tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 35s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=5000 --dump-dom \
            'http://127.0.0.1:4173/premium-v59-interactions-tribunal.html' >/tmp/v59a.html
          grep -q 'data-v59a="ok"' /tmp/v59a.html || { grep -o 'data-v59a-detail="[^"]*"' /tmp/v59a.html || true; exit 1; }

      - name: Chrome — real app actually loads V5.9A runtime
        run: |
          timeout --signal=TERM --kill-after=5s 45s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=16000 --dump-dom \
            'http://127.0.0.1:4173/?fieldNavV3=1' >/tmp/v59a-app.html
          grep -q 'data-v59-interactions="1"' /tmp/v59a-app.html
          ! grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/v59a-app.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v59a-server.pid ]; then kill "$(cat /tmp/ft-v59a-server.pid)" || true; fi
