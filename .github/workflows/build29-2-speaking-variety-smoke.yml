name: Build 29.2 Speaking variety + clarity smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  speaking-variety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, labels and contextual planner contract
        run: |
          node --check speaking-loop-content.js
          node --check speaking-loop-smoke.js
          node --check speaking-loop-variety-smoke.js
          node --check build-meta.js
          node --check sw.js
          grep -q "const META = { version:" build-meta.js
          grep -q 'speaking-loop-content.css?v=1.22.2-b29.2' build-meta.js sw.js
          grep -q 'speaking-loop-content.js?v=1.22.2-b29.2' build-meta.js sw.js
          grep -q 'speaking-loop-variety-smoke.js?v=1.22.2-b29.2' build-meta.js sw.js
          grep -q "T('↻ Ghi âm lại','↻ Enregistrer à nouveau')" speaking-loop-content.js
          grep -q "T('🔊 Nghe Tyffany','🔊 Écouter Tyffany')" speaking-loop-content.js
          grep -q 'FrenchTranquilleMemory?.summary' speaking-loop-content.js
          grep -q 'recentPhrases' speaking-loop-content.js
          grep -q "kind:'recap'" speaking-loop-content.js
          grep -q 'isNumericLike' speaking-loop-content.js
          ! grep -q 'localStorage.setItem' speaking-loop-content.js

      - name: Voice, branding, learner and data sanctuaries remain intact
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "const LEARNER_KEY = 'francais-avec-luc:learner:v1'" speaking-loop-content.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b292-http.log 2>&1 &
          echo $! >/tmp/ft-b292-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome desktop — Bài 7 is contextual, varied and not a 10-euros mantra
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b292-desktop-$attempt"
            file="/tmp/b292-desktop-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 60s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=34000 --dump-dom \
              'http://127.0.0.1:4173/?debug=fr&b292Smoke=1' >"$file" || true
            ok=1
            for marker in \
              'data-b292-smoke-complete="1"' \
              'data-b292-coverage-lessons="40"' \
              'data-b292-coverage-covered="40"' \
              'data-b292-coverage-distinct="40"' \
              'data-b292-coverage-max="2"' \
              'data-b292-l7-distinct="1"' \
              'data-b292-l7-no-ten-euros-loop="1"' \
              'data-b292-l7-contextual-recall="1"' \
              'data-b292-l7-recap-source="known"' \
              'data-b292-rotation-avoided="1"' \
              'data-b292-teach-ready="1"' \
              'data-b292-native-model="1"' \
              'data-b292-teach-model-owner="exercise"' \
              'data-b292-teach-duplicate-model="0"' \
              'data-b292-teach-model-explanation="1"' \
              'data-b292-recap-ready="1"' \
              'data-b292-recap-distinct="1"' \
              'data-b292-recap-model-count="1"' \
              'data-b292-legacy-challenge-card="0"' \
              'data-b292-no-pronunciation-score="1"' \
              'data-b292-horizontal-overflow="0"'; do
              grep -q "$marker" "$file" || ok=0
            done
            grep -q 'data-b292-l7-recap="Combien ça coûte ?"' "$file" || ok=0
            grep -q 'Écouter Tyffany' "$file" || ok=0
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then ok=0; fi
            if [ "$ok" = 1 ]; then passed=1; break; fi
            echo '=== Build 29.2 markers ==='
            grep -o 'data-b292-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Chrome mobile 390x844 — Vietnamese labels stay clear and touch-safe
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b292-mobile-$attempt"
            file="/tmp/b292-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 60s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=34000 --dump-dom \
              'http://127.0.0.1:4173/?b292Smoke=1' >"$file" || true
            ok=1
            grep -q 'data-b292-smoke-complete="1"' "$file" || ok=0
            grep -q 'data-b292-horizontal-overflow="0"' "$file" || ok=0
            grep -q 'data-b292-native-model="1"' "$file" || ok=0
            grep -q 'Nghe Tyffany' "$file" || ok=0
            target=$(grep -o 'data-b292-min-target="[0-9]*"' "$file" | head -1 | cut -d'"' -f2)
            echo "Build29.2 mobile min target=${target:-0}px"
            [ "${target:-0}" -ge 44 ] || ok=0
            if [ "$ok" = 1 ]; then passed=1; break; fi
            grep -o 'data-b292-[^ >]*' "$file" | head -80 || true
          done
          test "$passed" = 1

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b292-server.pid ]; then kill "$(cat /tmp/ft-b292-server.pid)" || true; fi
