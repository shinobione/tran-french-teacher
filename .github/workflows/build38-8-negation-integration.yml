name: Build 38.8 Learner-facing negation transfer

on:
  pull_request:
    branches: [main]
  push:
    branches: [build38/negation-learner-integration]

permissions:
  contents: read

jobs:
  negation-learner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax + 38.2 + 38.3 + 38.5 + 38.7 predecessors + 38.8 contract
        run: |
          set -euo pipefail
          node --check src/pedagogy/generalization-transfer-core.js
          node --check src/pedagogy/generalization-negation-core.js
          node --check src/pedagogy/generalization-futur-proche-core.js
          node --check src/pedagogy/generalization-number-core.js
          node --check src/pedagogy/generalization-transfer-lesson.js
          node --check src/core/build32-loader.js
          node --check sw.js
          node --check tools/test-build38-2-learner-integration.cjs
          node --check tools/test-build38-3-negation-transfer.cjs
          node --check tools/test-build38-5-futur-proche-integration.cjs
          node --check tools/test-build38-7-nominal-plural-integration.cjs
          node --check tools/test-build38-8-negation-integration.cjs
          node tools/test-build38-2-learner-integration.cjs
          node tools/test-build38-3-negation-transfer.cjs
          node tools/test-build38-5-futur-proche-integration.cjs
          node tools/test-build38-7-nominal-plural-integration.cjs
          node tools/test-build38-8-negation-integration.cjs

      - name: Shared renderer preserves 38.2 38.5 38.7 while adding lesson34 only
        run: |
          set -euo pipefail
          grep -q "const LESSON=33" src/pedagogy/generalization-transfer-lesson.js
          grep -q "EXERCISE_INDEXES=Object.freeze(\[0,2,5\])" src/pedagogy/generalization-transfer-lesson.js
          grep -q "const FUTURE_LESSON=35" src/pedagogy/generalization-transfer-lesson.js
          grep -q "FUTURE_EXERCISE_INDEXES=Object.freeze(\[0,1,3\])" src/pedagogy/generalization-transfer-lesson.js
          grep -q "const NUMBER_LESSON=13" src/pedagogy/generalization-transfer-lesson.js
          grep -q "NUMBER_EXERCISE_INDEXES=Object.freeze(\[0,2,3\])" src/pedagogy/generalization-transfer-lesson.js
          grep -q "const NEGATION_LESSON=34" src/pedagogy/generalization-transfer-lesson.js
          grep -q "NEGATION_EXERCISE_INDEXES=Object.freeze(\[0,1,2\])" src/pedagogy/generalization-transfer-lesson.js
          grep -q "negationIntegration:hasNegationCore?'38.8':null" src/pedagogy/generalization-transfer-lesson.js
          grep -q "negationLesson:hasNegationCore?NEGATION_LESSON:null" src/pedagogy/generalization-transfer-lesson.js
          grep -q "activeCore.verify(exercise,choice)" src/pedagogy/generalization-transfer-lesson.js
          grep -q "persistent:false" src/pedagogy/generalization-transfer-lesson.js
          grep -q "masteryClaim:false" src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'Math.random' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'localStorage.setItem' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'sessionStorage.setItem' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'indexedDB' src/pedagogy/generalization-transfer-lesson.js
          ! grep -q 'french-tranquille:memory-evidence:v2' src/pedagogy/generalization-transfer-lesson.js

      - name: Loader and installed-PWA negation dependency stay explicit
        run: |
          set -euo pipefail
          grep -q "const TRANSFER='2.4.0-b38.2'" src/core/build32-loader.js
          grep -q "const TRANSFER_NEGATION='2.4.0-b38.8'" src/core/build32-loader.js
          grep -q "const TRANSFER_FUTURE='2.4.0-b38.5'" src/core/build32-loader.js
          grep -q "const TRANSFER_NUMBER='2.4.0-b38.7'" src/core/build32-loader.js
          grep -q 'generalization-negation-core.js?v=${TRANSFER_NEGATION}' src/core/build32-loader.js
          grep -Fq 'generalization-transfer-lesson.js?v=${' src/core/build32-loader.js
          grep -q "const B388='2.4.0-b38.8'" sw.js
          grep -q 'generalization-negation-core.js?v=${B388}' sw.js
          grep -Fq 'generalization-transfer-lesson.js?v=${' sw.js
          python3 - <<'PY'
          loader=open('src/core/build32-loader.js',encoding='utf-8').read()
          order=[
            loader.index('foundations-pilot.js?v=${FOUNDATIONS}'),
            loader.index('generalization-transfer-core.js?v=${TRANSFER}'),
            loader.index('generalization-negation-core.js?v=${TRANSFER_NEGATION}'),
            loader.index('generalization-futur-proche-core.js?v=${TRANSFER_FUTURE}'),
            loader.index('generalization-number-core.js?v=${TRANSFER_NUMBER}'),
            loader.index('generalization-transfer-lesson.js?v=')
          ]
          assert min(order)>=0 and order==sorted(order), order
          print('38.8 loader order PASS',order)
          PY

      - name: Product curriculum Foundations and certified transfer cores stay untouched
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          changed="$(git diff --name-only origin/main...HEAD)"
          forbidden='^(app\.js|voice-ios\.js|free-voice\.js|index\.html|manifest\.webmanifest|src/core/data-recovery|src/core/memory-evidence-v2-runtime\.js|src/pedagogy/memory-evidence-v2-core\.js|src/pedagogy/curriculum-stage[234]\.js|src/pedagogy/learning-memory\.js|src/pedagogy/error-intelligence\.js|src/pedagogy/listening-engine\.js|src/pedagogy/scenario-engine\.js|src/pedagogy/mastery-engine\.js|src/pedagogy/learner-intelligence.*\.js|src/pedagogy/foundations-core\.js|src/pedagogy/foundations-capsule-engine\.js|src/pedagogy/generalization-transfer-core\.js|src/pedagogy/generalization-negation-core\.js|src/pedagogy/generalization-futur-proche-core\.js|src/pedagogy/generalization-number-core\.js|src/ui/|src/premium/|assets/LOGO\.png|assets/Favicon\.png)$'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo 'Build 38.8 may only wire the already-certified negation core through shared Transfer runtime/tests/docs' >&2
            exit 1
          fi

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b388-http.log 2>&1 &
          echo $! >/tmp/ft-b388-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — F05 predecessor remains exact on lesson34
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2; do
            profile="/tmp/ft-b388-f05-$attempt"; file="/tmp/b388-f05-$attempt.html"
            rm -rf "$profile" "$file"
            if timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 --virtual-time-budget=11000 --dump-dom \
              'http://127.0.0.1:4173/tests/browser/build37-5-foundations-subject-pronouns.html?debug=fr' >"$file" \
              && grep -q 'data-b375-done="1"' "$file" \
              && grep -q 'data-b375-f05="1"' "$file" \
              && grep -q 'data-b375-storage-unchanged="1"' "$file" \
              && ! grep -q 'data-b375-error=' "$file"; then passed=1; break; fi
          done
          test "$passed" -eq 1

      - name: Chrome — 38.8 lesson34 negation Transfer VI/FR desktop + iPhone
        run: |
          set -euo pipefail
          for spec in 'vi 1280 900' 'fr 1280 900' 'vi 390 844' 'fr 390 844'; do
            set -- $spec; locale="$1"; width="$2"; height="$3"; passed=0; file=''
            for attempt in 1 2; do
              profile="/tmp/ft-b388-${locale}-${width}-$attempt"; file="/tmp/b388-${locale}-${width}-$attempt.html"
              rm -rf "$profile" "$file"
              if timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
                --user-data-dir="$profile" --window-size="$width,$height" --virtual-time-budget=14000 --dump-dom \
                "http://127.0.0.1:4173/tests/browser/build38-8-negation-integration.html?debug=$locale" >"$file" \
                && grep -q 'data-b388-done="1"' "$file" \
                && grep -q "data-b388-locale=\"$locale\"" "$file" \
                && grep -q 'data-b388-family="affirmation-negation-regular-er-je"' "$file" \
                && grep -q 'data-b388-exercises="3"' "$file" \
                && grep -q 'data-b388-lesson="34"' "$file" \
                && grep -q 'data-b388-foundation-coexists="1"' "$file" \
                && grep -q 'data-b388-legacy-subject-route="1"' "$file" \
                && grep -q 'data-b388-legacy-future-route="1"' "$file" \
                && grep -q 'data-b388-legacy-number-route="1"' "$file" \
                && grep -q 'data-b388-routing="1"' "$file" \
                && grep -q 'data-b388-continued="1"' "$file" \
                && grep -q 'data-b388-storage-unchanged="1"' "$file" \
                && grep -q 'data-b388-no-overflow="1"' "$file" \
                && ! grep -q 'data-b388-error=' "$file"; then passed=1; break; fi
            done
            if [ "$passed" -ne 1 ]; then
              echo "38.8 tribunal failed for $locale ${width}x${height}" >&2
              grep -o 'data-b388-[^ >]*="[^"]*"' "$file" >&2 || true
              grep -o 'data-b388-error="[^"]*"' "$file" >&2 || true
              exit 1
            fi
          done

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b388-server.pid ]; then kill "$(cat /tmp/ft-b388-server.pid)" || true; fi