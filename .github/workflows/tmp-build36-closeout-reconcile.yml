```

Also preserve unless an explicitly scoped later build proves otherwise:

- six canonical learner source stores and their semantics;
- Evidence derived-shadow role;
- Recovery v3 compatibility with v1/v2/v3 backups;
- recognition ≠ pronunciation;
- Premium V5.10 field-accepted identities and navigation contracts.

## Canonical next action — Build 37

```text
Build 37 — Foundations Core

→ reread MASTER-ROADMAP + Build 33 foundations audit + Build 34 F01–F04 pilot
→ audit the current F01–F04 pilot against certified Build 36 storage boundaries
→ define the smallest Foundations Core slice
→ do not use Evidence as product truth unless a separate explicit future gate authorizes it
→ preserve Recovery v3 / seven-store rollback guarantees
→ preserve V5.10 accepted visual/runtime contracts
```

**Build 36 is CLOSED. Do not reopen it without a concrete regression.**
'''
          Path('PROJECT-STATE.md').write_text(state,encoding='utf-8')

          roadmap=Path('MASTER-ROADMAP.md').read_text(encoding='utf-8')
          start='<!-- CURRENT-CANONICAL-GATE:START -->'
          end='<!-- CURRENT-CANONICAL-GATE:END -->'
          roadmap=re.sub(re.escape(start)+r'.*?'+re.escape(end)+r'\n*','',roadmap,flags=re.S)
          gate=f'''{start}
## CURRENT CANONICAL GATE — 2026-08-16

- **Build 35 — Memory Evidence v2 / Migration Readiness: CLOSED.**
- **Build 36 — Memory Evidence v2 Derived-shadow Adoption: CLOSED.**
- Certified current main: `{main_sha}` — PR #170; {len(push)}/{len(push)} push workflows SUCCESS; Pages #{page['run_number']} SUCCESS.
- Live Recovery contract: **7 stores / backup v3**.
- Evidence v2 remains a **derived shadow**; the original six stores remain canonical product truth.
- **NEXT: Build 37 — Foundations Core.**

Any older Build-36 “NEXT/active” wording below is historical planning and is superseded by this gate.
{end}

'''
          first_nl=roadmap.find('\n')
          roadmap=roadmap[:first_nl+1]+'\n'+gate+roadmap[first_nl+1:]
          closeout='''

## Build 36 — Memory Evidence v2 Adoption — CLOSED (2026-08-16)

Certified sequence:

```text
36.1 Recovery v3 + seventh-store contract
→ 36.2 live Evidence derived-shadow adoption
→ 36.3 full durability tribunal
```

Build 36 permanently establishes seven-store Recovery / backup v3 while keeping the six historical source stores canonical for product behaviour. The seventh Evidence store is derived/rebuildable shadow state.

The final 36.3 tribunal certified fresh migration, same-profile reopen, corrupt-shadow boot recovery, v1/v2/v3 restore semantics, seven-store reset, injected partial-write rollback, and Service Worker/browser persistence with the origin server offline.

**Next canonical build: Build 37 — Foundations Core.**
'''
          if '## Build 36 — Memory Evidence v2 Adoption — CLOSED (2026-08-16)' not in roadmap:
            roadmap=roadmap.rstrip()+closeout+'\n'
          Path('MASTER-ROADMAP.md').write_text(roadmap,encoding='utf-8')
          PY

      - name: Commit reconciliation and remove temporary workflow
        run: |
          git config user.name 'French Trân’quille CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-build36-closeout-reconcile.yml
          git add PROJECT-STATE.md MASTER-ROADMAP.md
          git commit -m 'Docs: close Build 36 and open Build 37'
          git push origin HEAD:${{ github.head_ref }}
