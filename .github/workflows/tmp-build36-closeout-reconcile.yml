name: Temporary Build 36 closeout reconciler

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  reconcile:
    if: github.head_ref == 'docs/build36-closeout-build37'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify certified main and rewrite canonical handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          main_sha=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()

          def get(path):
            req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/{path}',
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'ftq-closeout'}
            )
            with urllib.request.urlopen(req,timeout=30) as response:
              return json.load(response)

          push=get(f'actions/runs?head_sha={main_sha}&event=push&per_page=100')['workflow_runs']
          push=[r for r in push if r.get('head_sha')==main_sha]
          assert push and all(r.get('status')=='completed' and r.get('conclusion')=='success' for r in push), 'main push matrix not fully green'

          pages=get(f'actions/workflows/pages.yml/runs?head_sha={main_sha}&per_page=10')['workflow_runs']
          page=next((r for r in pages if r.get('head_sha')==main_sha and r.get('status')=='completed' and r.get('conclusion')=='success'),None)
          assert page, 'Pages not green on exact main SHA'

          pr170=get('pulls/170')
          assert pr170.get('merged') is True and pr170.get('merge_commit_sha')==main_sha, 'PR #170 is not the current certified main'
          pr_head=pr170['head']['sha']
          pr_runs=get(f'actions/runs?head_sha={pr_head}&event=pull_request&per_page=100')['workflow_runs']
          pr_runs=[r for r in pr_runs if r.get('head_sha')==pr_head]
          assert pr_runs and all(r.get('status')=='completed' and r.get('conclusion')=='success' for r in pr_runs), 'PR #170 matrix not fully green'

          state=f'''# French Trân’quille — CURRENT PROJECT STATE

> **Short volatile handoff. Read this before `MASTER-ROADMAP.md`.**
>
> Always verify current GitHub / CI reality before acting.

## Last reconciliation

- Reconciled: **2026-08-16**
- Repository: `shinobione/tran-french-teacher`
- Default branch: `main`
- Current certified `main`: **`{main_sha}`** — PR **#170**, Build **36.3 Recovery v3 durability tribunal**.
- PR #170 final head: **{len(pr_runs)}/{len(pr_runs)} pull-request workflows SUCCESS, 0 failure**.
- Post-merge exact main: **{len(push)}/{len(push)} push workflows SUCCESS, 0 failure**.
- GitHub Pages **#{page['run_number']} SUCCESS** on exact SHA `{main_sha}`.
- Premium V5.10: **CLOSED / physical FIELD PASS**. Issue **#114 CLOSED**.
- **Build 35 CLOSED — Memory Evidence v2 / Migration Readiness.**
- **Build 36 CLOSED — Memory Evidence v2 Derived-shadow Adoption.**
- **Build 37 UNBLOCKED / NEXT — Foundations Core.**

## Current product / data baseline

| Area | State |
|---|---|
| Production pedagogy | **V2.3.0 · Build 34** |
| Migration readiness | **Build 35 CLOSED** |
| Evidence adoption | **Build 36 CLOSED** |
| Next canonical build | **Build 37 · Foundations Core** |
| Durable stores | **7** |
| Backup envelope | **v3** |
| Evidence key | `french-tranquille:memory-evidence:v2` |
| Evidence role | **derived-shadow** |
| Product truth | **original six source stores remain canonical** |
| Product read-path cutover to Evidence | **NONE** |
| Premium visual line | **V5.10 CLOSED · FIELD PASS** |

## Build 36 certified chain

```text
36.1 · PR #168
→ Recovery v3 + seventh-store pure contract
→ 47/47 PR workflows
→ main 9ea91e3cc03a7c4c1f2cd617b4485420debc5f86
→ 33/33 push workflows
→ Pages #221 SUCCESS

36.2 · PR #169
→ first live Evidence derived-shadow adoption
→ seven-store Recovery / backup v3
→ six product source stores remain canonical
→ full PR matrix SUCCESS
→ exact post-merge main + Pages certified before 36.3

36.3 · PR #170
→ QA-only durability tribunal; no runtime/product-owner changes
→ fresh six→seven adoption
→ existing seven-store reopen without remigration
→ corrupt Evidence boot quarantine + repair
→ v1 / v2 / v3 restore ownership
→ reset all seven
→ injected mid-restore write failure + exact rollback
→ same-profile Service Worker reopen with origin server offline
→ {len(pr_runs)}/{len(pr_runs)} PR workflows SUCCESS
→ main {main_sha}
→ {len(push)}/{len(push)} push workflows SUCCESS
→ Pages #{page['run_number']} SUCCESS
```

## Evidence v2 permanent semantics

Dimensions:

```text
retrieval
listening
scenario
text
recognition
construction
transfer
assistance
recency
repetition
recovery
```

States:

```text
exposure
assisted-success
autonomous-recall
contextual-reuse
concept-understanding
novel-construction-transfer
```

Permanent safety rules:

- `voice-unrecognized` = recognition-system evidence only, never pronunciation failure;
- model use proves assistance, not successful production by itself;
- construction/transfer/concept-understanding are never fabricated from insufficient history;
- history remains bounded and deterministic;
- historical unattributable aggregates remain explicit diagnostics.

## Seven-store ownership — LOCKED

```text
learner     → francais-avec-luc:learner:v1
memory      → french-tranquille:learning-memory:v1
errors      → french-tranquille:error-intelligence:v1
scenarios   → french-tranquille:scenarios:v1
listening   → french-tranquille:listening:v1
milestones  → french-tranquille:milestones:v1
                     ↓ deterministic projection
Evidence    → french-tranquille:memory-evidence:v2  [derived shadow]
```

The six source stores remain canonical for product behaviour. Build 36 does **not** authorize product reads from Evidence v2. A code rollback may ignore/rebuild the shadow without losing learner history.

Backup/restore contract:

```text
v3 → owns seven stores; Evidence/source coherence mandatory
v2 → owns historical six; Evidence rebuilt
v1 → owns learner+memory; preserve errors/scenarios/listening/milestones; Evidence rebuilt
```

## Build 36 durability proof — LOCKED

The certified browser tribunal proves:

- first six→seven migration owns a pre-migration snapshot;
- existing seven-store profiles reopen without remigration;
- malformed Evidence is quarantined and repaired at boot;
- v3 round-trip is exact;
- v2 replaces the six historical stores and rebuilds Evidence;
- v1 preserves the four stores it never owned and rebuilds Evidence;
- a one-shot write failure after partial restore rolls back exact pre-fault bytes;
- learner reset clears all seven stores and can restore coherently;
- same Chrome profile reopens from Service Worker cache with the origin HTTP server stopped;
- Build 36.3 itself changes no Recovery/Evidence runtime or product pedagogy owner.

## Protected boundaries

Do not silently change:

```text
