name: Build 37.7 F08 predecessor diagnostic

on:
  push:
    branches: [build37/f12-questions-core-v2]

permissions:
  contents: read

jobs:
  diagnose-f08-predecessor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/b377-diag-http.log 2>&1 &
          echo $! >/tmp/b377-diag-server.pid
          sleep 1
      - name: Run F08 predecessor and expose state
        run: |
          set -u
          for spec in 'fr 390 844' 'vi 1280 900'; do
            set -- $spec; locale="$1"; width="$2"; height="$3"
            profile="/tmp/b377-diag-${locale}-${width}"
            file="/tmp/b377-diag-${locale}-${width}.html"
            rm -rf "$profile" "$file"
            timeout --signal=TERM --kill-after=5s 45s google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size="$width,$height" --virtual-time-budget=12000 --dump-dom \
              "http://127.0.0.1:4173/tests/browser/build37-6-foundations-regular-er.html?debug=$locale" >"$file" || true
            echo "--- $locale ${width}x${height} ---"
            grep -o 'data-b376-[^ >]*="[^"]*"' "$file" || true
            grep -o 'data-b376-error="[^"]*"' "$file" || true
            grep -o 'data-foundation-capsule="[^"]*"' "$file" | tail -5 || true
            if ! grep -q 'data-b376-done="1"' "$file" || grep -q 'data-b376-error=' "$file"; then failed=1; else failed=0; fi
            if [ "$failed" -ne 0 ]; then exit 1; fi
          done
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/b377-diag-server.pid ]; then kill "$(cat /tmp/b377-diag-server.pid)" || true; fi
