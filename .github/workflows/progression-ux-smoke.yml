name: Build 25 Progression UX smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  progression-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and wiring
        run: |
          node --check progression-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'progression-ux.css?v=1.18.0-b25' index.html
          grep -q 'progression-ux.js?v=1.18.0-b25' index.html
          grep -q 'FrenchTranquilleProgressionUX' build-meta.js
          grep -q 'progression-ux.js' sw.js
          grep -q 'progression-ux.css' sw.js

      - name: Sanctuaries remain byte-identical
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-progress-http.log 2>&1 &
          echo $! >/tmp/ft-progress-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — compact Parcours preserves lesson-8 state
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=26000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&progressionSmoke=compact' >/tmp/progress-compact.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/progress-compact.html; then cat /tmp/progress-compact.html; exit 1; fi
          grep -q 'app-shell screen-progress' /tmp/progress-compact.html
          grep -q 'data-progress-ux-ready="1"' /tmp/progress-compact.html
          grep -q 'data-progression-smoke="compact"' /tmp/progress-compact.html
          grep -q 'data-progress-current-lesson="l8"' /tmp/progress-compact.html
          grep -q 'data-progress-completed="7"' /tmp/progress-compact.html
          grep -q 'data-progress-known="40"' /tmp/progress-compact.html
          grep -q 'data-progress-visible-rows="5"' /tmp/progress-compact.html
          grep -q 'data-progress-total-rows="40"' /tmp/progress-compact.html
          grep -q 'data-progress-expanded="0"' /tmp/progress-compact.html
          grep -q 'data-progress-details-open="0"' /tmp/progress-compact.html
          grep -E -q 'data-progress-detail-cards="[1-9][0-9]*"' /tmp/progress-compact.html
          grep -q 'progress-ux-overview' /tmp/progress-compact.html
          test "$(grep -o 'progress-ux-row-hidden' /tmp/progress-compact.html | wc -l)" -ge 30

      - name: Chrome — full 40-lesson path remains accessible
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=26000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&progressionSmoke=expanded' >/tmp/progress-expanded.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/progress-expanded.html; then cat /tmp/progress-expanded.html; exit 1; fi
          grep -q 'data-progression-smoke="expanded"' /tmp/progress-expanded.html
          grep -q 'data-progress-visible-rows="40"' /tmp/progress-expanded.html
          grep -q 'data-progress-total-rows="40"' /tmp/progress-expanded.html
          grep -q 'data-progress-expanded="1"' /tmp/progress-expanded.html
          grep -q 'data-progress-current-lesson="l8"' /tmp/progress-expanded.html

      - name: Chrome — detailed engines remain accessible on demand
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=26000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8&progressionSmoke=details' >/tmp/progress-details.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/progress-details.html; then cat /tmp/progress-details.html; exit 1; fi
          grep -q 'data-progression-smoke="details"' /tmp/progress-details.html
          grep -q 'data-progress-details-open="1"' /tmp/progress-details.html
          grep -E -q 'data-progress-detail-cards="[1-9][0-9]*"' /tmp/progress-details.html
          grep -q 'memory-progress-card' /tmp/progress-details.html
          grep -q 'mastery-progress-card' /tmp/progress-details.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-progress-server.pid ]; then kill "$(cat /tmp/ft-progress-server.pid)" || true; fi
