name: Build 26.5 Conversation exit + Layout repair smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conversation-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax, version, cache and wiring
        run: |
          node --check session-ux.js
          node --check progression-ux.js
          node --check build26-5-ux.js
          node --check build-meta.js
          node --check sw.js
          grep -q 'build26-5-ux.css?v=1.19.5-b26.5' index.html
          grep -q 'build26-5-ux.js?v=1.19.5-b26.5' index.html
          grep -q 'progression-ux.js?v=1.19.5-b26.5' index.html
          grep -q 'session-ux.js?v=1.19.5-b26.5' index.html
          grep -q 'build-meta.js?v=1.19.5-b26.5' index.html
          grep -q "version: '1.19.5', build: '26.5'" build-meta.js
          grep -q 'FrenchTranquilleBuild265UX' build-meta.js
          grep -q 'tran-french-teacher-v1.19.5-b26.5-conversation-layout-repair' index.html sw.js
          grep -q 'build26-5-ux.css' sw.js
          grep -q 'build26-5-ux.js' sw.js
          grep -q 'setPracticeMode' session-ux.js
          grep -q "progressComposition = 'independent-columns'" progression-ux.js

      - name: Learner, voice and branding sanctuaries remain byte-identical
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          grep -q "francais-avec-luc:learner:v1" app.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'slow: 0.65' build-meta.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-b265-http.log 2>&1 &
          echo $! >/tmp/ft-b265-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome desktop — Changer de pratique exits guided mode and layout is one column
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b265-conversation-profile-$attempt"
            file="/tmp/b265-conversation-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=32000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&debug=fr&b265Smoke=conversation' >"$file"; then
              echo "Conversation Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-conversation' "$file" \
              && grep -q 'data-b265-conversation-single-column="1"' "$file" \
              && grep -q 'data-b265-conversation-guided-visible="1"' "$file" \
              && grep -q 'data-b265-conversation-back-present="1"' "$file" \
              && grep -q 'data-b265-conversation-pointer-back="1"' "$file" \
              && grep -q 'data-b265-conversation-click-back="1"' "$file" \
              && grep -q 'data-b265-conversation-hub="1"' "$file" \
              && grep -q 'data-session-practice-mode="hub"' "$file" \
              && grep -q 'practice-session-hub' "$file"; then
              passed=1
              break
            fi
            echo "Conversation attempt $attempt missing markers"
            grep -o 'data-b265-[^ >]*' "$file" | head -30 || true
            grep -o 'data-session-practice-mode="[^"]*"' "$file" | head -5 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.5 Conversation exit/layout smoke failed after 3 bounded attempts'
            exit 1
          fi

      - name: Chrome desktop — Progress columns remain compact with long Mastery details
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b265-progress-profile-$attempt"
            file="/tmp/b265-progress-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=1280,900 \
              --virtual-time-budget=32000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&b265Smoke=progress' >"$file"; then
              echo "Progress Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-progress' "$file" \
              && grep -q 'data-b265-progress-composition="independent-columns"' "$file" \
              && grep -q 'data-b265-progress-details-direct="1"' "$file" \
              && grep -q 'data-b265-progress-curriculum-left="1"' "$file" \
              && grep -q 'data-b265-progress-compact-gap="1"' "$file" \
              && grep -q 'data-b265-progress-nested-scroll="0"' "$file" \
              && grep -q 'data-b265-progress-page-scrollable="1"' "$file" \
              && grep -q 'data-b265-progress-side-by-side="1"' "$file" \
              && grep -q 'data-progress-current-lesson="l8"' "$file" \
              && grep -q 'data-progress-completed="7"' "$file" \
              && grep -q 'data-progress-known="40"' "$file"; then
              passed=1
              break
            fi
            echo "Progress attempt $attempt missing markers"
            grep -o 'data-b265-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.5 Progress independent-column smoke failed after 3 bounded attempts'
            exit 1
          fi

      - name: Chrome mobile — Progress order stays summary, curriculum, collapsed Details
        run: |
          passed=0
          for attempt in 1 2 3; do
            profile="/tmp/ft-b265-mobile-profile-$attempt"
            file="/tmp/b265-mobile-$attempt.html"
            rm -rf "$profile" "$file"
            if ! timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="$profile" --window-size=390,844 \
              --virtual-time-budget=30000 --dump-dom \
              'http://127.0.0.1:4173/?uxSmoke=lesson8&b265Smoke=progress-mobile' >"$file"; then
              echo "Mobile Chrome attempt $attempt timed out or exited non-zero"
              continue
            fi
            if grep -E -q 'id="app"[^>]*><div class="boot-status error' "$file"; then continue; fi
            if grep -q 'app-shell screen-progress' "$file" \
              && grep -q 'data-b265-progress-composition="independent-columns"' "$file" \
              && grep -q 'data-b265-progress-details-direct="1"' "$file" \
              && grep -q 'data-b265-progress-curriculum-left="1"' "$file" \
              && grep -q 'data-b265-progress-mobile-order="1"' "$file" \
              && grep -q 'data-b265-progress-mobile-details-closed="1"' "$file" \
              && grep -q 'data-progress-visible-rows="5"' "$file" \
              && grep -q 'data-progress-total-rows="40"' "$file"; then
              passed=1
              break
            fi
            echo "Mobile attempt $attempt missing markers"
            grep -o 'data-b265-[^ >]*' "$file" | head -30 || true
          done
          if [ "$passed" -ne 1 ]; then
            echo 'Build 26.5 mobile Progress ordering smoke failed after 3 bounded attempts'
            exit 1
          fi

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-b265-server.pid ]; then kill "$(cat /tmp/ft-b265-server.pid)" || true; fi
