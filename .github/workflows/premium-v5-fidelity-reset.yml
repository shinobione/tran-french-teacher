name: Premium V5.5 Mockup Fidelity Reset

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mockup-fidelity-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static V5.5 contracts and sanctuaries
        run: |
          node --check premium-v5-fidelity-reset.js
          node --check theme-controller.js
          node --check sw.js
          grep -q -- '--pv55-ready:1' premium-v5-fidelity-reset.css
          grep -q -- '--pv55-refine-ready:1' premium-v5-fidelity-refine.css
          grep -q 'theme-aurora-paris.svg' premium-v5-fidelity-reset.css
          grep -q 'theme-sunset-paris.svg' premium-v5-fidelity-reset.css
          grep -q 'theme-jade-paris.svg' premium-v5-fidelity-reset.css
          grep -q 'eiffel-premium-mask.svg' premium-v5-fidelity-refine.css
          grep -q "content:'LUYỆN TẬP'" premium-v5-fidelity-refine.css
          grep -q 'ft-v55-subview-back' premium-v5-fidelity-reset.js
          grep -q 'ft-v55-level-route' premium-v5-fidelity-reset.js
          grep -q 'data-v55-about-toggle' premium-v5-fidelity-reset.js
          grep -q 'ft-v55-settings-gear' premium-v5-fidelity-refine.css
          grep -q 'premium-v5-fidelity-reset.css?v=2.3.20-v5fidelity1' premium-theme-polish.css
          grep -q 'premium-v5-fidelity-refine.css?v=2.3.20-v5fidelity2' premium-theme-polish.css
          grep -q 'premium-v5-fidelity-reset.js?v=2.3.20-v5fidelity1' theme-controller.js
          grep -q "const CACHE='tran-french-teacher-v2.3.20-b34.12-v5fidelity2'" sw.js
          grep -q "const V5F='2.3.20-v5fidelity1'" sw.js
          grep -q "const V5FR='2.3.20-v5fidelity2'" sw.js
          grep -q 'premium-v5-fidelity-reset.css?v=${V5F}' sw.js
          grep -q 'premium-v5-fidelity-refine.css?v=${V5FR}' sw.js
          grep -q 'premium-v5-fidelity-reset.js?v=${V5F}' sw.js
          grep -q './assets/theme-aurora-paris.svg' sw.js
          grep -q './assets/theme-sunset-paris.svg' sw.js
          grep -q './assets/theme-jade-paris.svg' sw.js
          grep -q './assets/eiffel-premium-mask.svg' sw.js
          grep -q "\['review','conversation','listening','real-life'\]" premium-v5-subview-chrome-tribunal.html
          test "$(tail -n 1 premium-theme-polish.css)" = "@import url('./premium-nav-geometry-hotfix.css?v=2.3.4-p0nav1');"
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v55-http.log 2>&1 &
          echo $! >/tmp/ft-v55-server.pid
          sleep 1
          google-chrome --version

      - name: Chrome — V5.5 structural fidelity tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 60s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=36000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-fidelity-reset-tribunal.html' > /tmp/v55.html
          grep -q 'data-premium-v55="ok"' /tmp/v55.html || { grep -o 'data-premium-v55-detail="[^"]*"' /tmp/v55.html || true; exit 1; }
          grep -q 'data-v55-scenes="aurora+sunset+jade"' /tmp/v55.html
          grep -q 'data-v55-controls="filled-circle"' /tmp/v55.html
          grep -q 'data-v55-progress="A0-line-A1"' /tmp/v55.html
          grep -q 'data-v55-settings="learner-first"' /tmp/v55.html
          grep -q 'data-v55-recovery="accessible"' /tmp/v55.html
          grep -q 'data-v55-about="credits-contained"' /tmp/v55.html
          grep -q 'data-v55-learner="unchanged"' /tmp/v55.html
          grep -q 'data-v55-overflow="0"' /tmp/v55.html
          grep -q 'data-v55-original="witness"' /tmp/v55.html

      - name: Chrome — all Practice children share one Back chrome
        run: |
          for case in review conversation listening real-life; do
            out="/tmp/v55-subview-${case}.html"
            timeout --signal=TERM --kill-after=5s 60s \
              google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --virtual-time-budget=36000 --dump-dom \
              "http://127.0.0.1:4173/premium-v5-subview-chrome-tribunal.html?case=${case}" > "$out"
            grep -q 'data-v55-subview="ok"' "$out" || { grep -o 'data-v55-subview-detail="[^"]*"' "$out" || true; exit 1; }
            grep -q "data-v55-subview-case=\"${case}\"" "$out"
            grep -q 'data-v55-subview-anchor="same"' "$out"
            grep -q 'data-v55-subview-return="practice"' "$out"
            grep -q 'data-v55-subview-overflow="0"' "$out"
            if [ "$case" = 'real-life' ]; then grep -q 'data-v55-subview-hierarchy="scenario-list-practice"' "$out"; fi
          done

      - name: Chrome — V5.5 reduced-motion tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 60s \
            google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=36000 --dump-dom \
            'http://127.0.0.1:4173/premium-v5-fidelity-reset-tribunal.html' > /tmp/v55-reduced.html
          grep -q 'data-premium-v55="ok"' /tmp/v55-reduced.html || { grep -o 'data-premium-v55-detail="[^"]*"' /tmp/v55-reduced.html || true; exit 1; }
          grep -q 'data-v55-learner="unchanged"' /tmp/v55-reduced.html

      - name: Capture V5.5 primary iPhone review matrix
        run: |
          mkdir -p artifacts/premium-v55-mobile
          capture() {
            theme="$1"; screen="$2"
            profile="/tmp/ft-v55-${theme}-${screen}"
            png="artifacts/premium-v55-mobile/iphone390-${theme}-${screen}.png"
            dom="/tmp/v55-${theme}-${screen}.html"
            target="http://127.0.0.1:4173/premium-v4-visual-capture.html?theme=${theme}&screen=${screen}"
            rm -rf "$profile" "$png" "$dom"
            timeout --signal=TERM --kill-after=5s 40s \
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --disable-background-timer-throttling --disable-renderer-backgrounding \
              --user-data-dir="$profile" --window-size="390,844" --virtual-time-budget=17000 \
              --screenshot="$png" --dump-dom "$target" >"$dom"
            test -s "$png"
            grep -q 'data-capture-ready="1"' "$dom" || { grep -o 'data-capture-error="[^"]*"' "$dom" || true; exit 1; }
            grep -q "data-capture-theme=\"${theme}\"" "$dom"
            grep -q "data-capture-screen=\"${screen}\"" "$dom"
          }
          for theme in aurora sunset jade; do
            for screen in home progress practice listening settings; do
              capture "$theme" "$screen"
            done
          done
          test "$(find artifacts/premium-v55-mobile -name '*.png' | wc -l)" -eq 15

      - name: Upload V5.5 iPhone visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-v55-mobile-visual-review
          path: artifacts/premium-v55-mobile/*.png
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v55-server.pid ]; then kill "$(cat /tmp/ft-v55-server.pid)" || true; fi
