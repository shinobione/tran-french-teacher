name: V5.10 Practice Pictograms V4 Materialize

on:
  push:
    branches: [agent/v510-practice-pictograms-v3]
    paths:
      - '.github/workflows/v510-practice-pictograms-v4-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v510-practice-pictograms-v3
      - name: Bump pictogram runtime URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='2.3.29-v510icons3'
          new='2.3.30-v510icons4'
          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          css=f'premium-v510-practice-icons.css?v={old}'
          js=f'premium-v510-practice-icons.js?v={old}'
          if css not in text or js not in text:
              raise SystemExit('index V3 pictogram runtime anchors missing')
          text=text.replace(css,f'premium-v510-practice-icons.css?v={new}',1)
          text=text.replace(js,f'premium-v510-practice-icons.js?v={new}',1)
          index.write_text(text,encoding='utf-8')
          sw=Path('sw.js')
          text=sw.read_text(encoding='utf-8')
          anchor=f"const V510ICONS='{old}';"
          if anchor not in text:
              raise SystemExit('sw V510ICONS V3 anchor missing')
          text=text.replace(anchor,f"const V510ICONS='{new}';",1)
          sw.write_text(text,encoding='utf-8')
          PY
          node --check sw.js
          git diff --check
      - name: Commit durable wiring only
        shell: bash
        run: |
          git config user.name 'ShinoBiWan'
          git config user.email 'shinobione@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V5.10 icons V4: wire expressive 3D pictograms and Home reuse'
          git push origin HEAD:agent/v510-practice-pictograms-v3
