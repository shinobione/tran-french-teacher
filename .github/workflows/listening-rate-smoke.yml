name: Build 25.1 Listening rate smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  listening-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static calibration contract
        run: |
          node --check build-meta.js
          node --check sw.js
          grep -q 'normal: 0.88' build-meta.js
          grep -q 'engineSlow: 0.68' build-meta.js
          grep -q 'slow: 0.65' build-meta.js
          grep -q 'LISTENING_RATES.slow' build-meta.js
          grep -q 'FrenchTranquilleListeningRates' build-meta.js
          grep -q 'build-meta.js?v=1.19.2-b26.2' index.html
          grep -q "n>=.65" voice-ios.js
      - name: Voice and branding remain sanctuarized
        run: |
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-listening-rate.log 2>&1 &
          echo $! >/tmp/ft-listening-rate.pid
          sleep 1
      - name: Chrome exposes effective rates
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=18000 --dump-dom 'http://127.0.0.1:4173/?uxSmoke=lesson8' >/tmp/listening-rate.html
          if grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/listening-rate.html; then cat /tmp/listening-rate.html; exit 1; fi
          grep -q 'data-listening-normal-rate="0.88"' /tmp/listening-rate.html
          grep -q 'data-listening-slow-rate="0.65"' /tmp/listening-rate.html
          grep -q 'data-listening-engine-slow-rate="0.68"' /tmp/listening-rate.html
          grep -q 'app-shell screen-home' /tmp/listening-rate.html
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-listening-rate.pid ]; then kill "$(cat /tmp/ft-listening-rate.pid)" || true; fi