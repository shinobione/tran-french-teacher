<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Premium V5.5 fidelity reset tribunal</title></head><body>
<script>
(() => {
  const root = document.documentElement;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const until = async (fn, limit=9000) => { for (let t=0;t<limit;t+=50){ const v=fn(); if(v) return v; await wait(50); } return fn(); };
  const fail = detail => { root.dataset.premiumV55='fail'; root.dataset.premiumV55Detail=detail; };
  const ok = detail => { root.dataset.premiumV55='ok'; root.dataset.premiumV55Detail=detail; };
  const rect = node => node?.getBoundingClientRect?.();
  const px = value => Number.parseFloat(value || '0') || 0;
  const visible = (w,node) => !!node && w.getComputedStyle(node).display !== 'none' && w.getComputedStyle(node).visibility !== 'hidden' && rect(node).width > 0 && rect(node).height > 0;
  const assertRight = (d,node,label) => { const gap=d.documentElement.clientWidth-rect(node).right; if(gap<8||gap>28) throw Error(`${label}-right-gap-${Math.round(gap)}`); };

  const frame = document.createElement('iframe');
  frame.style.width='390px'; frame.style.height='844px'; frame.style.border='0';
  frame.src='./index.html?uxSmoke=lesson8&fieldNavV3=1&v55Audit=1';
  document.body.appendChild(frame);

  frame.addEventListener('load', () => setTimeout(async () => {
    try {
      const w = frame.contentWindow, d = frame.contentDocument;
      w.localStorage.setItem('tran-french-teacher:debug-fr:v1','0');
      w.localStorage.setItem('french-tranquille:appearance-theme:v1','aurora');
      const themes = await until(() => w.FrenchTranquilleThemes);
      const fidelity = await until(() => w.FrenchTranquillePremiumV55);
      const nav = await until(() => w.FrenchTranquilleFieldNavigation);
      if (!themes || !fidelity || !nav) throw Error('runtime-missing');
      themes.apply('aurora'); fidelity.refresh(); await wait(220);

      const learnerKey = 'francais-avec-luc:learner:v1';
      const learnerBefore = w.localStorage.getItem(learnerKey);

      for (const [theme, asset] of [['aurora','theme-aurora-paris.svg'],['sunset','theme-sunset-paris.svg'],['jade','theme-jade-paris.svg']]) {
        themes.apply(theme); await wait(160);
        const bg = w.getComputedStyle(d.body).backgroundImage || '';
        if (!bg.includes(asset)) throw Error(`scene-${theme}`);
      }
      root.dataset.v55Scenes='aurora+sunset+jade';

      themes.apply('aurora'); await nav.go('home'); await wait(180);
      const gear = await until(() => d.querySelector('.b27-home [data-b27-settings].ft-v55-settings-gear'));
      if (!visible(w,gear)) throw Error('home-gear-missing');
      const gs = w.getComputedStyle(gear), gr = rect(gear);
      if (gr.width < 44 || gr.height < 44 || px(gs.borderRadius) < 20) throw Error('gear-grammar');
      assertRight(d,gear,'home-gear');
      root.dataset.v55Controls='filled-circle';

      await nav.go('progress'); await wait(180);
      const progress = await until(() => d.querySelector('.b27-progress-page'));
      if (!progress) throw Error('progress-route');
      const route = await until(() => progress.querySelector('.ft-v55-level-route'));
      const nodes = route?.querySelectorAll('.ft-v55-level-node');
      const track = route?.querySelector('.b27-level-track');
      if (!route || nodes?.length !== 2 || !track) throw Error('level-route-dom');
      const a0=rect(nodes[0]), tr=rect(track), a1=rect(nodes[1]);
      const cy = r => r.top + r.height/2;
      if (!(a0.left < tr.left && tr.right < a1.right && a0.right < a1.left)) throw Error('level-route-order');
      if (Math.max(Math.abs(cy(a0)-cy(tr)),Math.abs(cy(a1)-cy(tr))) > 4) throw Error('level-route-axis');
      root.dataset.v55Progress='A0-line-A1';

      const progressGear = progress.querySelector('[data-b27-settings]');
      if (!progressGear) throw Error('progress-settings');
      progressGear.click();
      const settings = await until(() => d.querySelector('#app .app-shell.screen-settings'));
      if (!settings) throw Error('settings-route');
      fidelity.refresh(); await wait(100);
      const close = await until(() => settings.querySelector('.topbar .ft-v55-settings-close'));
      if (!visible(w,close) || close.textContent.trim() !== '×') throw Error('settings-close');
      assertRight(d,close,'settings-close');

      const technical = [...settings.querySelectorAll('#debug-fr-card,.ft-v55-diagnostics-card,.ft-v55-technical-card')];
      if (technical.some(node => visible(w,node))) throw Error('settings-technical-visible');
      root.dataset.v55Settings='learner-first';

      const recovery = await until(() => settings.querySelector('.ft-v55-recovery-card,.memory-backup-card,.danger-zone'));
      if (!recovery || !visible(w,recovery)) throw Error('recovery-not-accessible');
      root.dataset.v55Recovery='accessible';

      const about = await until(() => settings.querySelector('#ft-settings-legal'));
      const aboutToggle = about?.querySelector('[data-v55-about-toggle]');
      if (!about || !aboutToggle || !about.textContent.includes('2026 ShinoBiWan')) throw Error('about-credits');
      if (w.getComputedStyle(about.querySelector('.ft-legal-grid')).display !== 'none') throw Error('about-not-collapsed');
      aboutToggle.click(); await wait(80);
      if (w.getComputedStyle(about.querySelector('.ft-legal-grid')).display === 'none') throw Error('about-open');
      root.dataset.v55About='credits-contained';

      if (d.documentElement.scrollWidth > d.documentElement.clientWidth + 1) throw Error('horizontal-overflow');
      if (w.localStorage.getItem(learnerKey) !== learnerBefore) throw Error('learner-mutated');
      root.dataset.v55Learner='unchanged';
      root.dataset.v55Overflow='0';

      themes.apply('original'); fidelity.refresh(); await wait(180);
      if ((w.getComputedStyle(d.body).backgroundImage || '').includes('theme-aurora-paris.svg')) throw Error('original-scene-leak');
      root.dataset.v55Original='witness';

      ok('scenes=3;controls=unified;progress=A0-line-A1;settings=learner-first;recovery=accessible;about=contained;learner=unchanged;original=witness');
    } catch (error) { fail(error?.message || String(error)); }
  }, 2400));

  setTimeout(() => { if (!root.dataset.premiumV55) fail('timeout'); }, 30000);
})();
</script>
</body></html>
