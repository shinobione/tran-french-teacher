name: Premium V5.9C Real Shared System

on:
  pull_request:
    branches:
      - main
      - agent/v59b-real-lesson-layout

permissions:
  contents: read

jobs:
  v59c-system:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static contracts and sanctuaries
        run: |
          set -euo pipefail
          test -s src/premium/premium-v59-system.js
          test -s src/premium/premium-v59-system.css
          test -s tests/browser/premium-v59-system-tribunal.html
          node --check src/premium/premium-v59-system.js
          node --check src/core/theme-controller.js
          grep -q "const V59C='2.3.25-v59c1'" src/core/theme-controller.js
          grep -q 'src/premium/premium-v59-system.css' src/core/theme-controller.js
          grep -q 'src/premium/premium-v59-system.js' src/core/theme-controller.js
          grep -q 'LONG_PRESS_MS = 820' src/premium/premium-v59-system.js
          grep -q "event.altKey && event.shiftKey && event.code === 'KeyD'" src/premium/premium-v59-system.js
          grep -q 'prefers-reduced-motion:reduce' src/premium/premium-v59-system.css
          ! grep -q 'francais-avec-luc:learner:v1' src/premium/premium-v59-system.js
          ! grep -q 'french-tranquille:learning-memory:v1' src/premium/premium-v59-system.js
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v59c-http.log 2>&1 &
          echo $! >/tmp/ft-v59c-server.pid
          sleep 1

      - name: Chrome — shared surfaces and hidden DEBUG tribunal
        run: |
          timeout --signal=TERM --kill-after=5s 35s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=6000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/premium-v59-system-tribunal.html' >/tmp/v59c.html
          grep -q 'data-v59c="ok"' /tmp/v59c.html || { grep -o 'data-v59c-detail="[^"]*"' /tmp/v59c.html || true; exit 1; }

      - name: Chrome — reduced motion remains functional
        run: |
          timeout --signal=TERM --kill-after=5s 35s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --force-prefers-reduced-motion --virtual-time-budget=6000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/premium-v59-system-tribunal.html' >/tmp/v59c-reduced.html
          grep -q 'data-v59c="ok"' /tmp/v59c-reduced.html

      - name: Chrome — real app loads A+B+C layers
        run: |
          timeout --signal=TERM --kill-after=5s 45s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=390,844 --virtual-time-budget=16000 --dump-dom \
            'http://127.0.0.1:4173/?fieldNavV3=1' >/tmp/v59c-app.html
          grep -q 'data-v59-interactions="1"' /tmp/v59c-app.html
          grep -q 'data-v59-lesson-layout="1"' /tmp/v59c-app.html
          grep -q 'data-v59-premium-system="1"' /tmp/v59c-app.html
          ! grep -E -q 'id="app"[^>]*><div class="boot-status error' /tmp/v59c-app.html

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v59c-server.pid ]; then kill "$(cat /tmp/ft-v59c-server.pid)" || true; fi
