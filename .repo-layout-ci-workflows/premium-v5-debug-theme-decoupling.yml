name: Premium V5.8 DEBUG FR Theme Decoupling

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-theme-decoupling:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static V5.8 contracts and sanctuaries
        run: |
          node --check src/core/debug-fr.js
          node --check src/core/theme-controller.js
          node --check sw.js
          grep -q "const VERSION='2.3.22-v58debug1'" src/core/debug-fr.js
          grep -q "const DEBUG_KEY='tran-french-teacher:debug-fr:v1'" src/core/debug-fr.js
          grep -q "const THEME_KEY='french-tranquille:appearance-theme:v1'" src/core/debug-fr.js
          grep -q 'FrenchTranquilleDebugFr' src/core/debug-fr.js
          grep -q 'src/core/debug-fr.js?v=2.3.22-v58debug1' index.html
          grep -q "const DEBUG='2.3.22-v58debug1'" sw.js
          grep -q 'src/core/debug-fr.js?v=${DEBUG}' sw.js
          ! grep -q 'francais-avec-luc:learner:v1' src/core/debug-fr.js
          test "$(git hash-object app.js)" = "600f094266c9f0c4c7b57efdbf61129909ebd9cb"
          test "$(git hash-object voice-ios.js)" = "38e97aa3ef62dd6dcda224901b435f0973618679"
          test "$(git hash-object free-voice.js)" = "b4c19b1936c788ee017eac9ba14e5a62c159e8d5"
          test "$(git hash-object assets/LOGO.png)" = "64eaa6ad9781c6a9075d4f68615fc44344c4e21c"
          test "$(git hash-object assets/Favicon.png)" = "c358672368a960bf7617e5532aff3e3319cddb3e"
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ft-v58-http.log 2>&1 &
          echo $! >/tmp/ft-v58-server.pid
          sleep 1
          google-chrome --version
      - name: Chrome — four themes by DEBUG OFF and ON
        run: |
          timeout --signal=TERM --kill-after=5s 55s \
            google-chrome --headless=new --no-sandbox --disable-gpu \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --virtual-time-budget=34000 --dump-dom \
            'http://127.0.0.1:4173/tests/browser/premium-v5-debug-theme-tribunal.html' >/tmp/v58.html
          grep -q 'data-premium-v58="ok"' /tmp/v58.html || { grep -o 'data-premium-v58-detail="[^"]*"' /tmp/v58.html || true; exit 1; }
      - name: Capture four-theme DEBUG matrix
        run: |
          mkdir -p artifacts/premium-v58-debug-theme
          for theme in original aurora sunset jade; do
            for debug in off on; do
              profile="/tmp/ft-v58-${theme}-${debug}"
              png="artifacts/premium-v58-debug-theme/${theme}-debug-${debug}-settings.png"
              dom="/tmp/v58-${theme}-${debug}.html"
              rm -rf "$profile" "$png" "$dom"
              timeout --signal=TERM --kill-after=5s 40s \
                google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --disable-background-timer-throttling --disable-renderer-backgrounding \
                --user-data-dir="$profile" --window-size=390,844 --virtual-time-budget=15000 \
                --screenshot="$png" --dump-dom \
                "http://127.0.0.1:4173/tests/browser/premium-v5-debug-theme-capture.html?theme=${theme}&debug=${debug}" >"$dom"
              test -s "$png"
              grep -q 'data-capture-ready="1"' "$dom"
              grep -q "data-capture-theme=\"${theme}\"" "$dom"
              grep -q "data-capture-debug=\"${debug}\"" "$dom"
            done
          done
          test "$(find artifacts/premium-v58-debug-theme -name '*.png' | wc -l)" -eq 8
      - name: Upload V5.8 visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: premium-v58-debug-theme-review
          path: artifacts/premium-v58-debug-theme/*.png
          retention-days: 14
      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/ft-v58-server.pid ]; then kill "$(cat /tmp/ft-v58-server.pid)" || true; fi
