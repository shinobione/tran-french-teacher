    #ft-theme-settings{display:none;position:fixed;z-index:1500;right:14px;bottom:14px;width:min(520px,calc(100% - 28px));border:1px solid var(--ux-border);border-radius:22px;background:var(--ux-panel);color:var(--ux-text);box-shadow:0 22px 70px rgba(0,0,0,.42);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden}

  <script>
    (()=>{
      const HOTFIX='2.3.15-b34.6-v4contrast1';
      const learnerKey='francais-avec-luc:learner:v1';
      const params=new URLSearchParams(location.search);const realLifeSmoke=params.get('realLifeSmoke');const legacySmoke=params.get('uxSmoke');
      const seedProfile=mode=>{const knownItems=['bonjour','merci','au-revoir','je-mappelle','svp','excusez-moi','je-comprends','je-ne-comprends-pas','repetez','plus-lentement','je-suis-vietnamienne','je-viens-vietnam','jhabite-hcm','et-vous','oui','non','je-voudrais','eau','cafe','the','addition','combien-ca-coute','jaime','je-naime-pas','beaucoup','un-peu','cest-bon','je-prefere','zero','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','euros'];let completedThrough=7,partialLesson='l8',partialStep=4;if(mode==='lesson15'){completedThrough=15;partialLesson='l16';partialStep=0}else if(mode==='lesson20'){completedThrough=20;partialLesson='l21';partialStep=0}else if(/^lesson(3[5-9]|40)$/.test(mode)){completedThrough=Number(mode.replace('lesson',''));partialLesson=completedThrough<40?`l${completedThrough+1}`:'l40';partialStep=0}const completedLessons=Array.from({length:completedThrough},(_,i)=>`l${i+1}`);const lessonProgress=Object.fromEntries(completedLessons.map(id=>[id,999]));if(partialStep)lessonProgress[partialLesson]=partialStep;localStorage.setItem(learnerKey,JSON.stringify({schemaVersion:2,learnerName:'Trân',level:'A0',lessonProgress,completedLessons,knownItems,reviewState:{bonjour:2,'je-voudrais':1},conversationWins:5,lastActivity:'2026-08-11T10:00:00.000Z',streak:{current:6,lastDate:'2026-08-11'}}))};
      if(legacySmoke==='lesson8')seedProfile('lesson8');if(['lesson8','lesson15','lesson20','lesson35','lesson36','lesson37','lesson38','lesson39','lesson40'].includes(realLifeSmoke))seedProfile(realLifeSmoke);
      const root=()=>document.getElementById('app');const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
      const fatal=(message,detail='')=>{const app=root();if(!app)return;app.innerHTML=`<div class="boot-status error"><strong>⚠️ French Trân’quille n’a pas démarré</strong><small>Ứng dụng gặp lỗi khi khởi động.<br>Build 29 affiche le diagnostic au lieu d’un écran vide.</small><code>${escapeHtml(message)}${detail?`\n${escapeHtml(detail)}`:''}</code></div>`};
      window.addEventListener('error',event=>fatal(event.message||'JavaScript error',`${event.filename||''}:${event.lineno||''}:${event.colno||''}`));window.addEventListener('unhandledrejection',event=>fatal('Unhandled promise rejection',event.reason?.stack||event.reason||''));
      try{if('caches'in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('tran-french-teacher-')&&k!==`tran-french-teacher-v${HOTFIX}`).map(k=>caches.delete(k)))).catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.update().catch(()=>{})))).catch(()=>{})}catch{}
      window.addEventListener('load',()=>setTimeout(()=>{const app=root(),boot=document.getElementById('boot-status');if(app&&boot&&app.contains(boot))fatal('Startup watchdog: app.js did not replace the boot screen within 3 seconds.')},3000));
    })();
  </script>
