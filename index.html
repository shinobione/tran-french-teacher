<body translate="no" class="notranslate">
  <div id="app" translate="no" class="notranslate">
    <div class="boot-status" id="boot-status"><strong>French Trân’quille</strong><small>Đang khởi động… • Démarrage…</small></div>
  </div>
  <script>
    (() => {
      const HOTFIX = '1.17.3-b24.3-premium-interaction';
      const learnerKey = 'francais-avec-luc:learner:v1';
      const params = new URLSearchParams(location.search);
      const realLifeSmoke = params.get('realLifeSmoke');
      const legacySmoke = params.get('uxSmoke');

      const seedProfile = mode => {
        const knownItems = [
          'bonjour','merci','au-revoir','je-mappelle',
          'svp','excusez-moi','je-comprends','je-ne-comprends-pas','repetez','plus-lentement',
          'je-suis-vietnamienne','je-viens-vietnam','jhabite-hcm','et-vous','oui','non',
          'je-voudrais','eau','cafe','the','addition','combien-ca-coute',
          'jaime','je-naime-pas','beaucoup','un-peu','cest-bon','je-prefere',
          'zero','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','euros'
        ];
        let completedThrough = 7;
        let partialLesson = 'l8';
        let partialStep = 4;
        if (mode === 'lesson15') { completedThrough = 15; partialLesson = 'l16'; partialStep = 0; }
        if (mode === 'lesson20') { completedThrough = 20; partialLesson = 'l21'; partialStep = 0; }
        const completedLessons = Array.from({length:completedThrough},(_,i)=>`l${i+1}`);
        const lessonProgress = Object.fromEntries(completedLessons.map(id=>[id,999]));
        if (partialStep) lessonProgress[partialLesson] = partialStep;
        localStorage.setItem(learnerKey, JSON.stringify({
          schemaVersion:2,learnerName:'Trân',level:'A0',lessonProgress,completedLessons,knownItems,
          reviewState:{bonjour:2,'je-voudrais':1},conversationWins:5,
          lastActivity:'2026-08-11T10:00:00.000Z',streak:{current:6,lastDate:'2026-08-11'}
        }));
      };

      if (legacySmoke === 'lesson8') seedProfile('lesson8');
      if (['lesson8','lesson15','lesson20'].includes(realLifeSmoke)) seedProfile(realLifeSmoke);

      const root = () => document.getElementById('app');
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const fatal = (message, detail='') => {
        const app = root(); if (!app) return;
        app.innerHTML = `<div class="boot-status error"><strong>⚠️ French Trân’quille n’a pas démarré</strong><small>Ứng dụng gặp lỗi khi khởi động.<br>Build 24.3 affiche le diagnostic au lieu d’un écran vide.</small>${detail ? `<code>${escapeHtml(message)}\n${escapeHtml(detail)}</code>` : `<code>${escapeHtml(message)}</code>`}</div>`;
      };
      window.addEventListener('error', event => fatal(event.message || 'JavaScript error', `${event.filename || ''}:${event.lineno || ''}:${event.colno || ''}`));
      window.addEventListener('unhandledrejection', event => fatal('Unhandled promise rejection', event.reason?.stack || event.reason || ''));
      try {
        if ('caches' in window) caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('tran-french-teacher-') && k !== `tran-french-teacher-v${HOTFIX}`).map(k => caches.delete(k)))).catch(()=>{});
        if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(regs => Promise.all(regs.map(r => r.update().catch(()=>{})))).catch(()=>{});
      } catch {}
      window.addEventListener('load', () => setTimeout(() => {
        const app = root();
        const boot = document.getElementById('boot-status');
        if (app && boot && app.contains(boot)) fatal('Startup watchdog: app.js did not replace the boot screen within 3 seconds.');
      }, 3000));
    })();
  </script>
