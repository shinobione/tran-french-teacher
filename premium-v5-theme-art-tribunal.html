<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Premium V5.7 theme art tribunal</title><style>body{margin:0}iframe{display:block;border:0}</style></head><body>
<iframe id="appframe" src="./index.html?uxSmoke=lesson8&fieldNavV3=1" style="width:390px;height:844px"></iframe>
<script>
(() => {
  'use strict';
  const root=document.documentElement,frame=document.getElementById('appframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));
  const sizes=[[390,844],[430,932],[768,1024],[1280,800],[1440,900]];
  const themes={
    original:{background:'premium/themes/original/background-v2.png',lesson:'premium/themes/original/lesson-eiffel-v2.png'},
    aurora:{background:'premium/themes/aurora/background.webp',lesson:'premium/themes/aurora/lesson-eiffel-v2.png'},
    sunset:{background:'premium/themes/sunset/background.webp',lesson:'premium/themes/sunset/lesson-eiffel-v2.png'},
    jade:{background:'premium/themes/nocturne/background.webp',lesson:'premium/themes/nocturne/lesson-eiffel-v2.png'}
  };
  const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:listening:v1','french-tranquille:milestones:v1'];
  const finish=(ok,detail)=>{root.dataset.premiumV57=ok?'ok':'fail';root.dataset.premiumV57Detail=detail};
  frame.addEventListener('load',()=>setTimeout(async()=>{try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w.FrenchTranquilleThemes||!w.FrenchTranquillePremiumV55)throw Error('runtime-missing');
    const stable=d.createElement('style');stable.textContent='*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}';d.head.appendChild(stable);
    const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
    for(const [width,height] of sizes){
      frame.style.width=`${width}px`;frame.style.height=`${height}px`;await wait(100);
      for(const [theme,assets] of Object.entries(themes)){
        w.FrenchTranquilleThemes.apply(theme);w.FrenchTranquillePremiumV55.refresh();await wait(140);
        const label=`${width}x${height}-${theme}`,card=d.querySelector('.b27-primary-card');
        if(d.documentElement.dataset.theme!==theme)throw Error(`${label}:theme`);
        if(w.getComputedStyle(d.documentElement).getPropertyValue('--pv55-ready').trim()!=='1')throw Error(`${label}:parity-marker`);
        const bodyImage=w.getComputedStyle(d.body).backgroundImage||'';
        if(!bodyImage.includes(assets.background))throw Error(`${label}:background`);
        if(!card)throw Error(`${label}:lesson-card`);
        const art=w.getComputedStyle(card,'::after'),artImage=art.backgroundImage||'';
        if(!artImage.includes(assets.lesson))throw Error(`${label}:lesson-art`);
        if(parseFloat(art.width)<100||parseFloat(art.height)<130||parseFloat(art.opacity)<.8)throw Error(`${label}:lesson-art-geometry`);
        if(d.documentElement.scrollWidth>d.documentElement.clientWidth+1)throw Error(`${label}:overflow`);
      }
    }
    for(const key of keys)if(before[key]!==w.localStorage.getItem(key))throw Error(`store-mutated:${key}`);
    finish(true,'viewports=5;themes=4;backgrounds=4;lesson-art=4;original=parity;overflow=0;stores=unchanged');
  }catch(error){finish(false,error?.message||String(error))}},3200),{once:true});
  setTimeout(()=>{if(!root.dataset.premiumV57)finish(false,'timeout')},42000);
})();
</script></body></html>
