<!doctype html><html><head><meta charset="utf-8"><title>Premium V5.2 utility tribunal</title><style>body{margin:0}iframe{display:block;border:0}</style></head><body><iframe id="f" src="./index.html?fieldNavV3=1&debug=fr" style="width:390px;height:844px"></iframe><script>
(()=>{'use strict';
const R=document.documentElement,F=document.getElementById('f'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=async(fn,limit=14000)=>{for(let t=0;t<limit;t+=50){try{const v=fn();if(v)return v}catch{}await wait(50)}try{return fn()}catch{return null}};
const sizes=[[390,844],[1440,900]],themes=['aurora','sunset','jade'];

const px=v=>Number.parseFloat(v)||0;
const visible=(w,n)=>{if(!n)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&r.width>1&&r.height>1};
const displayRules=(d,n)=>{const out=[];const scan=(rules,href)=>{for(const rule of [...(rules||[])]){try{if(rule.cssRules){scan(rule.cssRules,href);continue}if(!rule.selectorText||!rule.style?.display)continue;if(n.matches(rule.selectorText))out.push(`${href||'inline'}::${rule.selectorText}=>${rule.style.display}${rule.style.getPropertyPriority('display')?'!important':''}`)}catch{}}};for(const sheet of [...d.styleSheets]){try{scan(sheet.cssRules,sheet.href)}catch{}}return out.join('|')||'none'};
const assertSquare=(w,n,label)=>{if(!n)throw Error(`${label}:node-missing`);const s=w.getComputedStyle(n),r=n.getBoundingClientRect();if(!visible(w,n))throw Error(`${label}:not-visible:display=${s.display};visibility=${s.visibility};opacity=${s.opacity};rect=${Math.round(r.width)}x${Math.round(r.height)}@${Math.round(r.left)},${Math.round(r.top)};hidden=${n.hidden?1:0};parentHidden=${n.parentElement?.hidden?1:0};displayRules=${displayRules(w.document,n)}`);if(r.width<44||r.height<44)throw Error(`${label}:touch-${r.width}x${r.height}`);const rad=px(s.borderTopLeftRadius);if(rad<11||rad>20)throw Error(`${label}:radius-${rad}`);if(!s.backgroundImage||s.backgroundImage==='none')throw Error(`${label}:hollow`);if(!s.boxShadow||s.boxShadow==='none')throw Error(`${label}:flat`)};
const seed=async w=>{const c=w.FrenchTranquilleCurriculum,key=c.key||'francais-avec-luc:learner:v1';const known=['bonjour','merci','au-revoir','je-mappelle','svp','excusez-moi','je-comprends','je-ne-comprends-pas','repetez','plus-lentement'];w.localStorage.setItem(key,JSON.stringify({schemaVersion:2,learnerName:'Trân',level:'A0',lessonProgress:{},completedLessons:[],knownItems:known}));w.FrenchTranquilleBuild27Shell?.refresh?.();w.FrenchTranquilleBuild32Shell?.refresh?.();await wait(80)};
F.onload=()=>setTimeout(async()=>{try{
 const w=F.contentWindow,d=F.contentDocument;
 const ready=await waitFor(()=>w.FrenchTranquilleThemes&&w.FrenchTranquilleFieldNavigation&&w.FrenchTranquilleListening&&w.FrenchTranquilleCurriculum&&d.querySelector('.debug-fr-banner'));
 if(!ready)throw Error('api-or-debug-not-ready');
 await seed(w);
 const fixture=d.createElement('section');fixture.id='pv5-utility-fixture';fixture.style.cssText='position:fixed;left:12px;top:90px;z-index:13000;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(0,0,0,.2)';fixture.innerHTML='<button class="ux-close" aria-label="close">×</button><button class="scenario-close" aria-label="scenario close">×</button><button class="scenario-mic" aria-label="mic">🎙</button><div class="progress-detail-panel-head"><button aria-label="detail close">×</button></div><button class="scenario-listen">🔊 Écouter</button>';d.body.appendChild(fixture);
 w.FrenchTranquilleThemes.apply('original');await wait(60);
 if(w.getComputedStyle(d.documentElement).getPropertyValue('--pv5-utility-ready').trim())throw Error('original-utility-leak');
 for(const[width,height]of sizes){
  F.style.width=`${width}px`;F.style.height=`${height}px`;await wait(90);
  for(const theme of themes){
   w.FrenchTranquilleThemes.apply(theme);await wait(90);
   if(w.getComputedStyle(d.documentElement).getPropertyValue('--pv5-utility-ready').trim()!=='1')throw Error(`${width}-${theme}:marker`);
   assertSquare(w,fixture.querySelector('.ux-close'),`${width}-${theme}:ux-close`);
   assertSquare(w,fixture.querySelector('.scenario-close'),`${width}-${theme}:scenario-close`);
   assertSquare(w,fixture.querySelector('.scenario-mic'),`${width}-${theme}:scenario-mic`);
   assertSquare(w,fixture.querySelector('.progress-detail-panel-head button'),`${width}-${theme}:progress-detail-close`);
   const listen=fixture.querySelector('.scenario-listen'),ls=w.getComputedStyle(listen),lr=listen.getBoundingClientRect();if(lr.height<44||!ls.backgroundImage||ls.backgroundImage==='none')throw Error(`${width}-${theme}:scenario-listen`);
   fixture.hidden=true;
   w.FrenchTranquilleListening.open();await wait(140);w.FrenchTranquilleFieldNavigation.ensureListeningSettings();await wait(60);
   const banner=d.querySelector('.debug-fr-banner'),overlay=d.querySelector('body > .listening-overlay');if(!visible(w,banner)||!visible(w,overlay))throw Error(`${width}-${theme}:debug-listening-nodes`);
   const br=banner.getBoundingClientRect(),or=overlay.getBoundingClientRect(),bs=w.getComputedStyle(banner),os=w.getComputedStyle(overlay);if(bs.position!=='fixed')throw Error(`${width}-${theme}:debug-not-fixed`);if(Number.parseInt(bs.zIndex||'0',10)<10000)throw Error(`${width}-${theme}:debug-z`);if(or.top<br.bottom-1)throw Error(`${width}-${theme}:debug-overlap-${or.top}-${br.bottom}`);if(px(os.top)<br.height-1)throw Error(`${width}-${theme}:overlay-top-not-reserved`);
   assertSquare(w,d.querySelector('.listening-close'),`${width}-${theme}:listening-back`);assertSquare(w,d.querySelector('.listening-settings'),`${width}-${theme}:listening-settings`);
   d.querySelector('[data-listening-close]')?.click();await wait(80);fixture.hidden=false;
  }
 }
 fixture.remove();w.FrenchTranquilleThemes.apply('original');await wait(50);if(w.getComputedStyle(d.documentElement).getPropertyValue('--pv5-utility-ready').trim())throw Error('original-utility-leak-after');
 finish(true,'viewports=2;themes=3;legacy-utility=filled;touch=44plus;debug-rail=reserved;listening=no-overlap;original=witness');
}catch(e){finish(false,e.message)}},120);
setTimeout(()=>{if(!R.dataset.premiumV5Utility)finish(false,'timeout')},48000);
})();
</script></body></html>
