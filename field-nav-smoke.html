<!doctype html><html><body><script>
(()=>{const r=document.documentElement,f=document.createElement('iframe');f.src='./index.html?debug=fr&uxSmoke=lesson8';f.style='width:390px;height:844px;border:0';document.body.appendChild(f);const wait=ms=>new Promise(x=>setTimeout(x,ms));const done=(v,m)=>{r.dataset.fieldNavSmoke=v;r.dataset.fieldNavDetail=m};async function press(d,w,b){const x=b.getBoundingClientRect().x+20,y=b.getBoundingClientRect().y+20;b.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch',clientX:x,clientY:y}));b.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,clientX:x,clientY:y}));await wait(180)}f.onload=()=>setTimeout(async()=>{try{const d=f.contentDocument,w=f.contentWindow,before=w.localStorage.getItem('francais-avec-luc:learner:v1');for(let i=0;i<10;i++){await press(d,w,d.querySelector('[data-ux-nav="progress"]'));if(!d.querySelector('.screen-progress'))throw Error('progress'+i);w.FrenchTranquilleListening.open();await wait(80);if(!d.querySelector('.listening-overlay'))throw Error('listen'+i);await press(d,w,d.querySelector('[data-ux-nav="home"]'));if(d.querySelector('.listening-overlay')||d.documentElement.classList.contains('listening-open'))throw Error('overlay'+i);if(!d.querySelector('.screen-home'))throw Error('home'+i)}if(before!==w.localStorage.getItem('francais-avec-luc:learner:v1'))throw Error('learner');if(Number(d.documentElement.dataset.fieldNavPrecloseCount||0)<10)throw Error('count');done('ok','10x-single-home')}catch(e){done('fail',e.message)}},2200);setTimeout(()=>done('fail','timeout'),18000)})();
</script></body></html>
