(()=>{const root=document.documentElement,wait=ms=>new Promise(r=>setTimeout(r,ms)),finish=(ok,detail)=>{root.dataset.fieldAudioBrowserSmoke=ok?'ok':'fail';root.dataset.fieldAudioBrowserDetail=detail};window.addEventListener('load',()=>setTimeout(async()=>{try{const record=document.querySelector('[data-field-audio-record]');if(!record)throw Error('record-button');record.click();await wait(450);if(root.dataset.fieldAudioPhase!=='recording')throw Error(`phase-${root.dataset.fieldAudioPhase||'none'}`);const stop=document.querySelector('[data-field-audio-stop]');if(!stop)throw Error('stop-button');stop.click();await wait(30);const panel=document.querySelector('.speaking-loop-card');panel.querySelector('.field-speaking-audio')?.remove();panel.querySelector('.speaking-loop-actions').hidden=false;panel.querySelector('.speaking-loop-actions').innerHTML='<button data-speaking-record>legacy-after-rerender</button>';await wait(700);if(!window.FrenchTranquilleFieldAudioSession?.hasRecording?.())throw Error(`no-recording:${root.dataset.fieldAudioError||''}`);if(Number(root.dataset.fieldAudioBlobBytes||0)<=0)throw Error('zero-blob');if(!document.querySelector('[data-field-audio-play]'))throw Error('play-button');finish(true,`events=${root.dataset.fieldAudioEvents};bytes=${root.dataset.fieldAudioBlobBytes}`)}catch(e){finish(false,e.message)}},120));setTimeout(()=>{if(!root.dataset.fieldAudioBrowserSmoke)finish(false,'timeout')},5000)})();
