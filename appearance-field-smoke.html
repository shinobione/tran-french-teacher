<!doctype html><html><head><meta charset="utf-8"><title>Appearance field smoke</title></head><body><iframe id="appframe" src="./index.html?uxSmoke=lesson8" style="width:390px;height:844px;border:0"></iframe><script>
(()=>{const root=document.documentElement,frame=document.getElementById('appframe'),wait=ms=>new Promise(r=>setTimeout(r,ms)),finish=(ok,msg)=>{root.dataset.appearanceFieldSmoke=ok?'ok':'fail';root.dataset.appearanceFieldDetail=msg};frame.onload=()=>setTimeout(async()=>{try{const w=frame.contentWindow,d=frame.contentDocument;const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'],before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));if(!w.FrenchTranquilleThemes)throw Error('theme-api');for(const id of ['original','aurora','sunset','jade']){w.FrenchTranquilleThemes.apply(id);await wait(40);if(d.documentElement.dataset.theme!==id)throw Error(`theme-${id}`)}w.FrenchTranquilleThemes.apply('original');const logo=d.querySelector('.b27-home');if(!logo)throw Error('modern-home');const logoStyle=w.getComputedStyle(logo,'::before');if(!String(logoStyle.backgroundImage).includes('LOGO.png'))throw Error('home-logo');const listen=d.querySelector('[data-b27-action="listening"]');if(!listen||listen.disabled)throw Error('listening-unavailable');listen.click();await wait(350);const overlay=d.querySelector('.listening-overlay'),nav=d.querySelector('.ux-bottom-nav');if(!overlay||!nav)throw Error('listening-or-nav');if(+w.getComputedStyle(nav).zIndex<=+w.getComputedStyle(overlay).zIndex)throw Error('nav-under-listening');const rect=nav.getBoundingClientRect();if(rect.width<300||rect.height<50)throw Error('nav-hidden-listening');for(const k of keys)if(before[k]!==w.localStorage.getItem(k))throw Error(`store-mutated:${k}`);finish(true,'themes=4;home-logo=visible;listening-nav=above-overlay;learner-stores=unchanged')}catch(e){finish(false,e.message)}},3200);setTimeout(()=>{if(!root.dataset.appearanceFieldSmoke)finish(false,'timeout')},15000)})();
</script></body></html>
