<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>P0 navigation tribunal</title></head>
<body><script>
(()=>{
'use strict';
const R=document.documentElement;
R.dataset.p0NavigationStarted='1';
const frame=document.createElement('iframe');
frame.style.cssText='width:390px;height:844px;border:0;display:block';
frame.src='./index.html?uxSmoke=lesson8&fieldNavV3=1';
document.body.appendChild(frame);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const finish=(ok,detail)=>{R.dataset.p0NavigationTribunal=ok?'ok':'fail';R.dataset.p0NavigationDetail=detail};
let step='boot';
function visible(w,n){if(!n?.isConnected)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.05&&r.width>1&&r.height>1&&!n.classList.contains('b27-leaving')}
async function press(w,n,delay=560){if(!n)throw Error(`${step}:missing-control`);n.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true}));await wait(delay)}
function active(d){return [...d.querySelectorAll('.ux-bottom-nav [data-ux-nav].active')].map(n=>n.dataset.uxNav)}
function assertPrimary(w,d,id){const a=active(d);if(a.length!==1||a[0]!==id)throw Error(`${step}:active:${a.join(',')}`);const n=id==='home'?d.querySelector('.screen-home .b27-home'):id==='progress'?d.querySelector('.screen-progress .b27-progress-page'):d.querySelector('.b27-practice-page:not(.b27-leaving)');if(!visible(w,n))throw Error(`${step}:${id}-not-visible`);if(d.querySelector('.b27-page.b27-leaving'))throw Error(`${step}:stale-leaving`)}
function assertSettings(w,d,source){const shell=d.querySelector('#app .app-shell.screen-settings');if(!visible(w,shell))throw Error(`${step}:settings-not-visible`);if(d.documentElement.dataset.fieldSettingsReturn!==source)throw Error(`${step}:return:${d.documentElement.dataset.fieldSettingsReturn||'missing'}`);const nav=d.querySelector('.ux-bottom-nav');if(w.getComputedStyle(nav).display!=='none')throw Error(`${step}:nav-visible-in-settings`)}
function assertGeometry(w,d,theme,label){const nav=d.querySelector('.ux-bottom-nav');const s=w.getComputedStyle(nav),r=nav.getBoundingClientRect();if(s.display==='none'||!visible(w,nav))throw Error(`${step}:${label}:${theme}:nav-hidden`);const center=Math.abs((r.left+r.width/2)-w.innerWidth/2);if(center>1.5)throw Error(`${step}:${label}:${theme}:off-center:${center.toFixed(2)}`);if(r.left<-.6||r.right>w.innerWidth+.6)throw Error(`${step}:${label}:${theme}:viewport-clip:${r.left.toFixed(1)}:${r.right.toFixed(1)}`);if(r.width>721)throw Error(`${step}:${label}:${theme}:too-wide:${r.width.toFixed(1)}`);if(theme!=='original'&&w.innerWidth<760&&(r.left<9||w.innerWidth-r.right<9))throw Error(`${step}:${label}:${theme}:mobile-margin:${r.left.toFixed(1)}:${(w.innerWidth-r.right).toFixed(1)}`);if(theme!=='original'&&w.innerWidth>=760&&(r.left<13||w.innerWidth-r.right<13))throw Error(`${step}:${label}:${theme}:desktop-margin`);const buttons=[...nav.querySelectorAll('[data-ux-nav]')];if(buttons.length!==3)throw Error(`${step}:${label}:${theme}:button-count`);for(const b of buttons){const br=b.getBoundingClientRect();if(br.width<44||br.left<r.left-.6||br.right>r.right+.6)throw Error(`${step}:${label}:${theme}:button-clip:${b.dataset.uxNav}`)}}
frame.addEventListener('load',()=>setTimeout(async()=>{
 try{
  const w=frame.contentWindow,d=frame.contentDocument;
  const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'];
  const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
  step='home';assertPrimary(w,d,'home');

  /* Mandatory real-control path: Home → Practice → Progress → Settings → close → Listening → Home. */
  step='path-practice';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="practice"]'));assertPrimary(w,d,'practice');
  step='path-progress';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="progress"]'));assertPrimary(w,d,'progress');
  step='path-settings';await press(w,d.querySelector('.screen-progress [data-b27-settings]'));assertSettings(w,d,'progress');
  step='path-settings-close';await press(w,d.querySelector('.screen-settings [data-back]'));assertPrimary(w,d,'progress');
  step='path-listening-launcher';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="practice"]'),320);
  const listen=d.querySelector('.b27-practice-page [data-b27-practice-action="listening"]');
  if(!listen||listen.disabled)throw Error(`${step}:listening-unavailable`);
  step='path-listening';await press(w,listen,650);
  const overlay=d.querySelector('.listening-overlay');const nav=d.querySelector('.ux-bottom-nav');
  if(!visible(w,overlay)||!visible(w,nav))throw Error(`${step}:ownership`);
  if(Number(w.getComputedStyle(nav).zIndex)<=Number(w.getComputedStyle(overlay).zIndex))throw Error(`${step}:z-index`);
  step='path-home';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="home"]'),650);assertPrimary(w,d,'home');if(d.querySelector('.listening-overlay'))throw Error(`${step}:listening-stale`);

  /* Settings must also be truly global from Practice and return to Practice. */
  step='practice-settings-open-page';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="practice"]'));assertPrimary(w,d,'practice');
  const practiceGear=d.querySelector('.b27-practice-page [data-b27-settings]');if(!practiceGear)throw Error(`${step}:missing-settings-gear`);
  step='practice-settings-open';await press(w,practiceGear);assertSettings(w,d,'practice');
  step='practice-settings-return';await press(w,d.querySelector('.screen-settings [data-back]'));assertPrimary(w,d,'practice');
  step='practice-settings-home';await press(w,d.querySelector('.ux-bottom-nav [data-ux-nav="home"]'));assertPrimary(w,d,'home');

  const sizes=[[390,844,'iphone-390'],[430,932,'iphone-430'],[768,1024,'tablet-768'],[1280,800,'desktop-1280'],[1440,900,'desktop-1440']];
  const themes=['original','aurora','sunset','jade'];
  for(const [width,height,label] of sizes){
    frame.style.width=`${width}px`;frame.style.height=`${height}px`;await wait(170);
    await w.FrenchTranquilleFieldNavigation.go('home');await wait(180);
    for(const theme of themes){step=`geometry-${label}-${theme}`;w.FrenchTranquilleThemes.apply(theme);await wait(170);assertPrimary(w,d,'home');assertGeometry(w,d,theme,label)}
  }
  const after=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));for(const k of keys)if(before[k]!==after[k])throw Error(`store-mutated:${k}`);
  if(d.documentElement.dataset.fieldRouteError)throw Error(`route-error:${d.documentElement.dataset.fieldRouteError}`);
  finish(true,'global path + Practice Settings + Listening z-index + 4 themes x 5 viewports + learner byte-safety')
 }catch(e){finish(false,e.message)}
},3200),{once:true});
setTimeout(()=>{if(!R.dataset.p0NavigationTribunal)finish(false,'timeout')},30000)
})();
</script></body></html>
