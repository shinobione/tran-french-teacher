<!doctype html><html><body><script>
(()=>{
  const root=document.documentElement,frame=document.createElement('iframe');
  frame.src='./index.html?uxSmoke=lesson8&fieldNavV3=1';
  frame.style='width:390px;height:844px;border:0';
  document.body.appendChild(frame);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const finish=(ok,detail)=>{root.dataset.fieldNavigationV2Smoke=ok?'ok':'fail';root.dataset.fieldNavigationV2Detail=detail};
  async function press(w,button,delay=280){if(!button)throw Error('missing-button');button.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true}));await wait(delay)}
  function active(d){return [...d.querySelectorAll('.ux-bottom-nav [data-ux-nav].active')].map(x=>x.dataset.uxNav)}
  function visible(w,node){if(!node?.isConnected)return false;const s=w.getComputedStyle(node),r=node.getBoundingClientRect(),o=parseFloat(s.opacity||'1');return s.display!=='none'&&s.visibility!=='hidden'&&o>.05&&r.width>1&&r.height>1&&!node.classList.contains('b27-leaving')}
  function clean(d){return !d.querySelector('.listening-overlay,.b27-practice-page,.b27-journey-page,.ux-practice-overlay')}
  function assertDestination(w,d,id){
    const a=active(d);if(a.length!==1||a[0]!==id)throw Error(`active:${id}:${a.join(',')}`);
    if(id==='home'&&!visible(w,d.querySelector('.screen-home .b27-home')))throw Error('home-not-visible');
    if(id==='progress'&&!visible(w,d.querySelector('.screen-progress .b27-progress-page')))throw Error('progress-not-visible');
    if(id==='practice'&&!visible(w,d.querySelector('.b27-practice-page')))throw Error('practice-not-visible');
    if(id!=='practice'&&!clean(d))throw Error(`stale-overlay:${id}`);
    if(d.querySelector('.b27-page.b27-leaving'))throw Error(`persistent-leaving:${id}`);
  }
  frame.onload=()=>setTimeout(async()=>{
    try{
      const d=frame.contentDocument,w=frame.contentWindow;
      const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'];
      const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
      assertDestination(w,d,'home');

      // Reproduce the real invisible-home bug: Build 27 historically marked
      // Home b27-leaving before opening Listening, then left that class behind.
      const quickListen=d.querySelector('[data-b27-action="listening"]');
      if(!quickListen||quickListen.disabled)throw Error('home-listening-unavailable');
      await press(w,quickListen,360);
      if(!visible(w,d.querySelector('.listening-overlay')))throw Error('home-listening-not-visible');
      await press(w,d.querySelector('[data-listening-close]'),260);
      assertDestination(w,d,'home');

      for(let n=0;n<5;n++){
        await press(w,d.querySelector('[data-ux-nav="practice"]));assertDestination(w,d,'practice');
        await press(w,d.querySelector('[data-ux-nav="home"]'));assertDestination(w,d,'home');
        await press(w,d.querySelector('[data-ux-nav="progress"]'));assertDestination(w,d,'progress');
        await press(w,d.querySelector('[data-ux-nav="practice"]'));assertDestination(w,d,'practice');
        const listen=d.querySelector('[data-b27-practice-action="listening"]');if(!listen||listen.disabled)throw Error('practice-listening-unavailable');
        await press(w,listen,320);if(!visible(w,d.querySelector('.listening-overlay')))throw Error('practice-listening-not-visible');
        await press(w,d.querySelector('[data-ux-nav="home"]'));assertDestination(w,d,'home');
      }

      const after=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));
      for(const k of keys){if(before[k]!==after[k])throw Error(`store-mutated:${k}`)}
      if(Number(d.documentElement.dataset.fieldRouteCount||0)<25)throw Error('route-count');
      if(d.documentElement.dataset.fieldRouteError)throw Error(`route-error:${d.documentElement.dataset.fieldRouteError}`);
      finish(true,`visible-home-listening-close + 5x route cycle; recoveries=${d.documentElement.dataset.fieldRouteRecovery||0}`)
    }catch(e){finish(false,e.message)}
  },3200);
  setTimeout(()=>{if(!root.dataset.fieldNavigationV2Smoke)finish(false,'timeout')},32000)
})();
</script></body></html>
