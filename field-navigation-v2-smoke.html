<!doctype html><html><body><script>
(()=>{const root=document.documentElement,frame=document.createElement('iframe');frame.src='./index.html?uxSmoke=lesson8';frame.style='width:390px;height:844px;border:0';document.body.appendChild(frame);const wait=ms=>new Promise(r=>setTimeout(r,ms));const finish=(ok,detail)=>{root.dataset.fieldNavigationV2Smoke=ok?'ok':'fail';root.dataset.fieldNavigationV2Detail=detail};async function press(w,button){button.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true}));await wait(220)}function active(d){return [...d.querySelectorAll('.ux-bottom-nav [data-ux-nav].active')].map(x=>x.dataset.uxNav)}function clean(d){return !d.querySelector('.listening-overlay,.b27-practice-page,.b27-journey-page,.ux-practice-overlay')}function assertDestination(d,id){const a=active(d);if(a.length!==1||a[0]!==id)throw Error(`active:${id}:${a.join(',')}`);if(id==='home'&&!d.querySelector('.screen-home .b27-home'))throw Error('home-facade');if(id==='progress'&&!d.querySelector('.screen-progress .b27-progress-page'))throw Error('progress-facade');if(id==='practice'&&!d.querySelector('.b27-practice-page'))throw Error('practice-page');if(id!=='practice'&&!clean(d))throw Error(`stale-overlay:${id}`)}frame.onload=()=>setTimeout(async()=>{try{const d=frame.contentDocument,w=frame.contentWindow;const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:milestones:v1'];const before=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));assertDestination(d,'home');for(let n=0;n<4;n++){await press(w,d.querySelector('[data-ux-nav="practice"]'));assertDestination(d,'practice');const listen=d.querySelector('[data-b27-practice-action="listening"]');if(!listen||listen.disabled)throw Error('listening-unavailable');await press(w,listen);if(!d.querySelector('.listening-overlay'))throw Error('listening-not-open');await press(w,d.querySelector('[data-ux-nav="home"]'));assertDestination(d,'home');await press(w,d.querySelector('[data-ux-nav="progress"]'));assertDestination(d,'progress');await press(w,d.querySelector('[data-ux-nav="practice"]'));assertDestination(d,'practice');await press(w,d.querySelector('[data-ux-nav="home"]'));assertDestination(d,'home')}const after=Object.fromEntries(keys.map(k=>[k,w.localStorage.getItem(k)]));for(const k of keys){if(before[k]!==after[k])throw Error(`store-mutated:${k}`)}if(Number(d.documentElement.dataset.fieldRouteCount||0)<16)throw Error('route-count');finish(true,'4x practice-listening-home-progress-practice-home')}catch(e){finish(false,e.message)}},3000);setTimeout(()=>{if(!root.dataset.fieldNavigationV2Smoke)finish(false,'timeout')},22000)})();
</script></body></html>
