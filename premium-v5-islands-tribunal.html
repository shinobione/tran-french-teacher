<!doctype html><html><head><meta charset="utf-8"><title>Premium V5.3 pedagogical islands tribunal</title><style>body{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}iframe{display:block;border:0;width:390px;height:844px}</style></head><body><iframe id="visual" src="./premium-v5-islands-fixture.html?theme=original"></iframe><iframe id="app" src="./index.html?fieldNavV3=1&uxSmoke=lesson8"></iframe><script>
(()=>{'use strict';
const R=document.documentElement,V=document.getElementById('visual'),A=document.getElementById('app'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=async(fn,limit=18000)=>{for(let t=0;t<limit;t+=50){try{const v=fn();if(v)return v}catch{}await wait(50)}try{return fn()}catch{return null}};
const sizes=[[390,844],[1440,900]],themes=['aurora','sunset','jade'];
const keys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:listening:v1','french-tranquille:milestones:v1'];
const finish=(ok,msg)=>{R.dataset.premiumV5Islands=ok?'ok':'fail';R.dataset.premiumV5IslandsDetail=msg};
const px=v=>Number.parseFloat(v)||0;
const visible=(w,n)=>{if(!n)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)>0&&r.width>1&&r.height>1};
const nodeState=(w,n)=>{if(!n)return 'missing';const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return `present/visible=${visible(w,n)?1:0}/display=${s.display}/visibility=${s.visibility}/opacity=${s.opacity}/rect=${Math.round(r.width)}x${Math.round(r.height)}@${Math.round(r.left)},${Math.round(r.top)}/hidden=${n.hidden?1:0}/class=${String(n.className).replace(/\s+/g,'.')}`};
const assertPanel=(w,n,label,minRadius=16)=>{if(!visible(w,n))throw Error(`${label}:missing`);const s=w.getComputedStyle(n);if(px(s.borderTopLeftRadius)<minRadius)throw Error(`${label}:radius-${s.borderTopLeftRadius}`);if(!s.backgroundImage||s.backgroundImage==='none')throw Error(`${label}:flat-bg`);if(!s.boxShadow||s.boxShadow==='none')throw Error(`${label}:flat-shadow`)};
const assertButton=(w,n,label)=>{if(!visible(w,n))throw Error(`${label}:missing`);const s=w.getComputedStyle(n),r=n.getBoundingClientRect();if(r.height<43||r.width<43)throw Error(`${label}:touch-${Math.round(r.width)}x${Math.round(r.height)}`);if(px(s.borderTopLeftRadius)<11)throw Error(`${label}:radius`);if(!s.backgroundImage||s.backgroundImage==='none')throw Error(`${label}:flat-bg`)};
Promise.all([new Promise(resolve=>V.addEventListener('load',resolve,{once:true})),new Promise(resolve=>A.addEventListener('load',resolve,{once:true}))]).then(()=>setTimeout(async()=>{try{
  const vw=V.contentWindow,vd=V.contentDocument,aw=A.contentWindow,ad=A.contentDocument;
  const ready=await waitFor(()=>vd.documentElement.dataset.captureReady==='1'&&aw.FrenchTranquilleThemes&&aw.FrenchTranquilleScenarios&&aw.FrenchTranquilleCurriculum&&aw.FrenchTranquilleBuild27Shell);
  if(!ready)throw Error(`api-missing:fixture=${vd.documentElement.dataset.captureReady||0};themes=${!!aw.FrenchTranquilleThemes};scenario=${!!aw.FrenchTranquilleScenarios};b27=${!!aw.FrenchTranquilleBuild27Shell}`);
  if(vw.getComputedStyle(vd.documentElement).getPropertyValue('--pv53-islands-ready').trim())throw Error('original-islands-leak');

  aw.FrenchTranquilleBuild27Shell.openPractice();
  const realLife=await waitFor(()=>ad.querySelector('.b27-practice-page [data-b27-practice-action="real-life"]'),5000);
  if(!realLife)throw Error('modern-real-life-action-missing');
  realLife.click();
  const runnerReady=await waitFor(()=>visible(aw,ad.querySelector('.screen-conversation .scenario-lab-card'))&&visible(aw,ad.querySelector('.scenario-runner'))&&visible(aw,ad.querySelector('.scenario-npc'))&&visible(aw,ad.querySelector('.scenario-task'))&&visible(aw,ad.querySelector('.scenario-input-row input')),7000);
  if(!runnerReady){const lab=ad.querySelector('.scenario-lab-card'),runner=ad.querySelector('.scenario-runner'),npc=ad.querySelector('.scenario-npc'),task=ad.querySelector('.scenario-task'),input=ad.querySelector('.scenario-input-row input');throw Error(`modern-scenario-route-failed:conversation=${!!ad.querySelector('.screen-conversation .narrow')};lab=${nodeState(aw,lab)};runner=${nodeState(aw,runner)};npc=${nodeState(aw,npc)};task=${nodeState(aw,task)};input=${nodeState(aw,input)};practiceMode=${ad.documentElement.classList.contains('b27-practice-open')?1:0};screen=${ad.body.dataset.b27Screen||ad.body.dataset.uxScreen||'unknown'}`)}
  await wait(120);
  const before=Object.fromEntries(keys.map(k=>[k,aw.localStorage.getItem(k)]));

  for(const[width,height]of sizes){
    V.style.width=A.style.width=`${width}px`;V.style.height=A.style.height=`${height}px`;await wait(90);
    for(const theme of themes){
      vd.documentElement.dataset.theme=theme;aw.FrenchTranquilleThemes.apply(theme);await wait(100);
      if(vw.getComputedStyle(vd.documentElement).getPropertyValue('--pv53-islands-ready').trim()!=='1')throw Error(`${width}-${theme}:fixture-marker`);
      if(aw.getComputedStyle(ad.documentElement).getPropertyValue('--pv53-islands-ready').trim()!=='1')throw Error(`${width}-${theme}:app-marker`);
      assertPanel(vw,vd.querySelector('.speaking-loop-card'),`${width}-${theme}:speaking`,16);
      assertPanel(vw,vd.querySelector('.voice-replay-panel'),`${width}-${theme}:replay`,14);
      assertPanel(vw,vd.querySelector('.session-success'),`${width}-${theme}:success`,18);
      assertPanel(vw,vd.querySelector('.lesson-session-complete'),`${width}-${theme}:lesson-complete`,14);
      assertPanel(vw,vd.querySelector('.milestone-toast'),`${width}-${theme}:milestone`,14);
      assertButton(vw,vd.querySelector('.speaking-loop-model'),`${width}-${theme}:model`);
      assertButton(vw,vd.querySelector('.speaking-loop-actions button'),`${width}-${theme}:speaking-action`);
      assertButton(vw,vd.querySelector('.voice-replay-actions button'),`${width}-${theme}:replay-action`);

      const lab=ad.querySelector('.scenario-lab-card'),runner=ad.querySelector('.scenario-runner'),npc=ad.querySelector('.scenario-npc'),task=ad.querySelector('.scenario-task'),input=ad.querySelector('.scenario-input-row input');
      assertPanel(aw,lab,`${width}-${theme}:scenario-lab`,18);if(!visible(aw,runner)||!visible(aw,npc)||!visible(aw,task)||!visible(aw,input))throw Error(`${width}-${theme}:scenario-nodes`);
      const ns=aw.getComputedStyle(npc),ts=aw.getComputedStyle(task),is=aw.getComputedStyle(input);if((!ns.backgroundImage||ns.backgroundImage==='none')&&ns.backgroundColor==='rgba(0, 0, 0, 0)')throw Error(`${width}-${theme}:npc-empty`);if(!ts.backgroundImage||ts.backgroundImage==='none')throw Error(`${width}-${theme}:task-flat`);if(px(is.borderTopLeftRadius)<12)throw Error(`${width}-${theme}:input-radius`);
      assertButton(aw,ad.querySelector('.scenario-close'),`${width}-${theme}:scenario-close`);
      if(ad.documentElement.scrollWidth>ad.documentElement.clientWidth+1)throw Error(`${width}-${theme}:overflow`);
    }
  }
  for(const k of keys)if(before[k]!==aw.localStorage.getItem(k))throw Error(`store-mutated:${k}`);
  ad.querySelector('[data-scenario-close]')?.click();await wait(60);
  vd.documentElement.dataset.theme='original';aw.FrenchTranquilleThemes.apply('original');await wait(60);if(vw.getComputedStyle(vd.documentElement).getPropertyValue('--pv53-islands-ready').trim()||aw.getComputedStyle(ad.documentElement).getPropertyValue('--pv53-islands-ready').trim())throw Error('original-islands-leak-after');
  finish(true,'viewports=2;themes=3;speaking=themed;voice-replay=themed;session=themed;milestone=themed;scenario=real-runner-themed;touch=44plus;stores=unchanged;original=witness');
}catch(e){finish(false,e.message)}},120)).catch(e=>finish(false,e.message));
setTimeout(()=>{if(!R.dataset.premiumV5Islands)finish(false,'timeout')},65000);
})();
</script></body></html>
