<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>V5.10 Practice icon tribunal</title>
  <style>html,body{margin:0;background:#080b12;color:#fff;font-family:system-ui}iframe{position:absolute;left:-9999px;width:390px;height:844px;border:0}#result{padding:20px}</style>
</head>
<body>
  <div id="result" data-v510-practice-icons="pending">pending</div>
  <iframe id="app" src="./?uxSmoke=lesson8&debug=fr"></iframe>
  <script>
    (()=>{
      const result=document.getElementById('result');
      const frame=document.getElementById('app');
      const expected=['conversation','listening','review','real-life'];
      const themes=['original','aurora','sunset','jade'];
      const waitFor=async(fn,timeout=15000)=>{const start=performance.now();while(performance.now()-start<timeout){try{const value=fn();if(value)return value}catch{}await new Promise(r=>setTimeout(r,50))}throw new Error('timeout')};
      const fail=error=>{result.dataset.v510PracticeIcons='fail';result.textContent=`FAIL: ${error?.message||error}`;document.documentElement.dataset.v510PracticeIcons='fail'};
      const pass=()=>{result.dataset.v510PracticeIcons='ok';result.textContent='V5.10 practice icon system OK';document.documentElement.dataset.v510PracticeIcons='ok'};

      frame.addEventListener('load',async()=>{
        try{
          const w=frame.contentWindow;
          const d=frame.contentDocument;
          await waitFor(()=>w.FrenchTranquilleBuild27Shell?.openPractice&&w.FrenchTranquilleThemes?.apply&&w.FrenchTranquilleV510PracticeIcons?.refresh);
          for(const theme of themes){
            w.FrenchTranquilleThemes.apply(theme);
            w.FrenchTranquilleBuild27Shell.openPractice();
            w.FrenchTranquilleV510PracticeIcons.refresh();
            await waitFor(()=>d.querySelectorAll('.b27-practice-action .ft-v510-practice-glyph').length===4);
            if(d.documentElement.dataset.theme!==theme)throw new Error(`theme ${theme} did not apply`);
            const cards=[...d.querySelectorAll('.b27-practice-action[data-b27-practice-action]')];
            if(cards.length!==4)throw new Error(`theme ${theme}: expected 4 practice cards, got ${cards.length}`);
            const widths=[];
            const heights=[];
            for(const id of expected){
              const card=cards.find(node=>node.dataset.b27PracticeAction===id);
              if(!card)throw new Error(`theme ${theme}: missing ${id} card`);
              const host=card.querySelector('.b27-practice-icon');
              const glyph=host?.querySelector('.ft-v510-practice-glyph');
              if(!host||!glyph)throw new Error(`theme ${theme}: ${id} missing SVG glyph`);
              if(host.dataset.v510PracticeIcon!==id)throw new Error(`theme ${theme}: ${id} ownership marker missing`);
              if(host.textContent.trim())throw new Error(`theme ${theme}: ${id} still exposes text/emoji glyph content`);
              const hr=host.getBoundingClientRect();
              const gr=glyph.getBoundingClientRect();
              const dx=Math.abs((hr.left+hr.width/2)-(gr.left+gr.width/2));
              const dy=Math.abs((hr.top+hr.height/2)-(gr.top+gr.height/2));
              if(dx>0.75||dy>0.75)throw new Error(`theme ${theme}: ${id} not centered (${dx.toFixed(2)}, ${dy.toFixed(2)})`);
              const cs=w.getComputedStyle(glyph);
              const hs=w.getComputedStyle(host);
              if(hs.display!=='flex')throw new Error(`theme ${theme}: ${id} host is not flex-centered`);
              if(cs.stroke==='none')throw new Error(`theme ${theme}: ${id} has no line stroke`);
              widths.push(Math.round(gr.width*10)/10);
              heights.push(Math.round(gr.height*10)/10);
            }
            if(new Set(widths).size!==1||new Set(heights).size!==1)throw new Error(`theme ${theme}: inconsistent glyph geometry`);
          }
          pass();
        }catch(error){fail(error)}
      },{once:true});
      setTimeout(()=>{if(result.dataset.v510PracticeIcons==='pending')fail(new Error('tribunal watchdog'))},22000);
    })();
  </script>
</body>
</html>
