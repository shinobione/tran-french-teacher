<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Build 37.8 F13 adjective agreement tribunal</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111e;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;background:#20314a;border:1px solid #5f7595;border-radius:12px;padding:8px 12px}.primary{background:#315d74}.secondary{background:#253852}.muted{color:#9fb0c5}.screen-lesson{width:min(760px,calc(100% - 24px));margin:20px auto}.topbar{padding:10px 2px}.topbar h1{font-size:1.25rem}.lesson-step{padding:18px;border:1px solid #23364d;border-radius:20px;background:#0d1928}
  </style>
  <script>
    (()=>{
      const debug=new URLSearchParams(location.search).get('debug')==='fr';
      localStorage.clear();
      localStorage.setItem('tran-french-teacher:debug-fr:v1',debug?'1':'0');
      localStorage.setItem('b37.8:sentinel','unchanged');
      window.__b378Debug=debug;
      window.__b378StorageBefore=JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]));
    })();
  </script>
</head>
<body>
  <main id="app">
    <section class="screen-lesson">
      <div class="topbar"><h1>Bài 40 — Cảm xúc, nhu cầu &amp; Jerry</h1></div>
      <div class="lesson-step"><p data-existing-lesson>Existing lesson content</p></div>
    </section>
  </main>
  <script src="../../src/pedagogy/foundations-capsule-engine.js?v=2.4.0-b37.3"></script>
  <script src="../../src/pedagogy/foundations-capsules.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/foundations-pilot.js?v=2.4.0-b37.8"></script>
  <script>
    (()=>{
      const root=document.documentElement;
      const fail=message=>{root.dataset.b378Error=message;throw new Error(message)};
      const ok=(value,message)=>{if(!value)fail(message)};
      const text=selector=>document.querySelector(selector)?.textContent?.trim()||'';
      const texts=selector=>[...document.querySelectorAll(selector)].map(node=>node.textContent.trim());
      const click=selector=>{const node=document.querySelector(selector);ok(node,`missing ${selector}`);node.click();return node};
      const clickChoice=choice=>{const node=[...document.querySelectorAll('[data-foundation-choice]')].find(button=>button.textContent.trim()===choice);ok(node,`missing choice ${choice}`);node.click();return node};
      const expected=window.__b378Debug?{
        title:'L’adjectif avec Trân — forme féminine',
        entry:'Environ 5 minutes pour relier les formes féminines déjà utilisées quand Trân parle d’elle-même. Pas de règle magique « ajoute simplement -e ».',
        intro:'Tu utilises déjà « je suis + adjectif » pour dire que tu es prête, contente, inquiète ou fatiguée. On regarde maintenant la forme de l’adjectif quand il décrit Trân.',
        prompts:[
          'Trân dit « Je suis prête » : choisis la bonne forme.',
          'Trân dit qu’elle est contente : Je suis ___ .',
          'Trân dit qu’elle est très fatiguée : Je suis très ___ .',
          'Tu parles d’une femme française : Elle est ___ .',
          'Trân dit qu’elle est inquiète. Quelle phrase est correcte ?'
        ],
        conclusion:'Le réflexe : demande-toi d’abord « l’adjectif décrit qui ? ». Quand Trân parle d’elle-même, choisis la forme féminine déjà apprise : prête, contente, fatiguée, inquiète… Beaucoup de formes utilisent -e ou -ée, mais il n’existe pas une règle unique pour tous les mots. Apprends les adjectifs fréquents avec leurs formes. Un mini-check réussi ne signifie pas que la règle est « maîtrisée ».'
      }:{
        title:'Tính từ nói về Trân — dạng nữ',
        entry:'Khoảng 5 phút để nối các dạng tính từ nữ bạn đã dùng khi nói về chính mình. Không có quy tắc “chỉ thêm -e” cho mọi từ.',
        intro:'Bạn đã dùng “je suis + tính từ” để nói mình sẵn sàng, vui, lo hoặc mệt. Bây giờ ta nhìn vào hình thức của tính từ khi nó mô tả Trân.',
        prompts:[
          'Trân nói “Tôi sẵn sàng”: Je suis ___ .',
          'Trân nói mình vui: Je suis ___ .',
          'Trân nói mình rất mệt: Je suis rất ___ .'.replace('rất ___','très ___'),
          'Bạn nói về một phụ nữ Pháp: Elle est ___ .',
          'Trân nói mình lo lắng. Câu nào đúng?'
        ],
        conclusion:'Phản xạ cần giữ: trước tiên hỏi “tính từ đang mô tả ai?”. Khi Trân nói về mình, chọn dạng nữ đã học: prête, contente, fatiguée, inquiète… Nhiều mẫu có -e hoặc -ée, nhưng không có một quy tắc duy nhất cho mọi từ. Hãy học những tính từ thường dùng cùng với dạng của chúng. Một mini-check đúng chưa có nghĩa là đã “thành thạo”.'
      };
      const setLesson=number=>{
        document.querySelector('.topbar h1').textContent=`Bài ${number} — routing tribunal`;
        document.querySelector('.lesson-step').innerHTML='<p data-existing-lesson>Existing lesson content</p>';
        window.FrenchTranquilleFoundationsPilot.refresh();
      };
      try{
        ok(window.FrenchTranquilleFoundationsCapsules?.F13?.concepts?.join(',')==='F13','F13 capsule missing');
        ok(window.FrenchTranquilleFoundationsPilot?.adapter==='37.3','37.3 adapter ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.expansion==='37.4','F11 ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.consolidation==='37.5','F05 ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.verbPattern==='37.6','F08 ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.systematization==='37.7','F12 ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.agreement==='37.8','F13 agreement marker missing');
        ok(window.FrenchTranquilleFoundationsPilot?.persistent===false,'Foundations must remain ephemeral');
        ok(root.dataset.foundationsAgreement==='37.8','root F13 agreement marker missing');
        ok(document.querySelectorAll('[data-foundation-entry]').length===1,'F13 entry count must be 1');
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F13','lesson 40 must route to F13');
        ok(text('.ft-foundation-entry h3')==='prête • contente • fatiguée • française','F13 entry title mismatch');
        ok(text('.ft-foundation-entry p')===expected.entry,'F13 entry copy mismatch');
        click('[data-foundation-open]');
        ok(document.querySelector('.ft-foundation-dialog')?.dataset.foundationActiveCapsule==='F13','F13 dialog ownership missing');
        ok(text('.ft-foundation-top .ft-foundation-eyebrow')==='F13 • CORE','F13 label mismatch');
        ok(text('.ft-foundation-top h2')===expected.title,'F13 title mismatch');
        ok(text('.ft-foundation-copy strong')===expected.intro,'F13 intro mismatch');
        ok(JSON.stringify(texts('.ft-foundation-examples b'))===JSON.stringify(['Je suis prête.','Je suis contente.','Je suis très fatiguée.','Je suis stressée.','Elle est française.']),'F13 examples mismatch');
        click('[data-foundation-next]');
        const choices=[
          ['prête','prêt','prêtes'],
          ['contente','content','contents'],
          ['fatiguée','fatigué','fatigués'],
          ['française','français','françaises'],
          ['Je suis inquiète.','Je suis inquiet.','Je suis inquiètes.']
        ];
        const answers=['prête','contente','fatiguée','française','Je suis inquiète.'];
        for(let index=0;index<answers.length;index+=1){
          ok(text('.ft-foundation-q h3')===expected.prompts[index],`question ${index+1} prompt mismatch`);
          ok(JSON.stringify(texts('[data-foundation-choice]'))===JSON.stringify(choices[index]),`question ${index+1} choices mismatch`);
          clickChoice(answers[index]);
          const correct=[...document.querySelectorAll('[data-foundation-choice]')].find(button=>button.textContent.trim()===answers[index]);
          ok(correct?.classList.contains('ok'),`question ${index+1} correct marking missing`);
          click('[data-foundation-next]');
        }
        ok(text('.ft-foundation-done p')===expected.conclusion,'F13 conclusion mismatch');
        click('.ft-foundation-done [data-foundation-close]');
        ok(!document.querySelector('.ft-foundation-overlay'),'overlay must close');
        ok(document.activeElement?.matches('[data-foundation-open]'),'focus must return to F13 entry CTA');
        ok(document.querySelector('[data-existing-lesson]'),'lesson content must survive round trip');

        setLesson(39);
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule!=='F13','lesson 39 must not be owned by F13');
        setLesson(41);
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F12','lesson 41 must remain owned by F12');
        setLesson(32);
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','lesson 32 must remain owned by F08');
        setLesson(34);
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson 34 must remain owned by F05');
        setLesson(40);
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F13','lesson 40 must return to F13');

        ok(JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]))===window.__b378StorageBefore,'localStorage changed during F13 capsule');
        ok(document.documentElement.scrollWidth<=innerWidth+1,'horizontal overflow detected');
        ok(document.querySelector('[data-foundation-open]').getBoundingClientRect().height>=44,'entry target below 44px');
        root.dataset.b378Done='1';root.dataset.b378Locale=window.__b378Debug?'fr':'vi';root.dataset.b378F05='1';root.dataset.b378F08='1';root.dataset.b378F12='1';root.dataset.b378F13='1';root.dataset.b378Routing='1';root.dataset.b378StorageUnchanged='1';root.dataset.b378NoOverflow='1';
      }catch(error){
        if(!root.dataset.b378Error)root.dataset.b378Error=error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
