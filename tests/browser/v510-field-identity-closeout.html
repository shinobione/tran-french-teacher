<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>V5.10 field identity closeout tribunal</title>
  <style>html,body{margin:0;background:#080b12;color:#fff;font-family:system-ui}iframe{position:absolute;left:-9999px;border:0}#result{padding:20px}</style>
</head>
<body>
  <div id="result" data-v510-field-identity="pending">pending</div>
  <script>
    (()=>{
      const result=document.getElementById('result');
      const storeKeys=[
        'francais-avec-luc:learner:v1',
        'french-tranquille:learning-memory:v1',
        'french-tranquille:error-intelligence:v1',
        'french-tranquille:scenarios:v1',
        'french-tranquille:listening:v1',
        'french-tranquille:milestones:v1'
      ];
      const waitFor=async(fn,timeout=24000,label='condition')=>{const start=performance.now();while(performance.now()-start<timeout){try{const value=fn();if(value)return value}catch{}await new Promise(r=>setTimeout(r,50))}throw new Error(`timeout: ${label}`)};
      const pause=ms=>new Promise(r=>setTimeout(r,ms));
      const snapshot=w=>Object.fromEntries(storeKeys.map(key=>[key,w.localStorage.getItem(key)]));
      const same=(a,b)=>storeKeys.every(key=>a[key]===b[key]);
      const fail=error=>{result.dataset.v510FieldIdentity='fail';result.textContent=`FAIL: ${error?.message||error}`;document.documentElement.dataset.v510FieldIdentity='fail'};
      const pass=()=>{result.dataset.v510FieldIdentity='ok';result.textContent='V5.10 lesson identity + Listening/brand field closeout OK';document.documentElement.dataset.v510FieldIdentity='ok'};

      async function assertDecoratorStoreSafe(w,action,label){
        const before=snapshot(w);
        action();
        await pause(80);
        const after=snapshot(w);
        if(!same(before,after))throw new Error(`${label} visual decorator changed learner stores`);
      }

      async function openPracticeAndClick(w,d,id){
        d.querySelector('[data-b27-close-practice]')?.click();
        w.FrenchTranquilleListening?.close?.();
        await pause(150);
        w.FrenchTranquilleBuild27Shell.openPractice();
        const button=await waitFor(()=>d.querySelector(`.b27-practice-action[data-b27-practice-action="${id}"]`),24000,`Practice ${id}`);
        if(button.disabled)throw new Error(`Practice ${id} disabled`);
        button.click();
      }

      function assertHomeLessonIdentity(w,d){
        const card=d.querySelector('.b27-home .b27-primary-card[data-v510-lesson-identity="l8"]');
        const icon=card?.querySelector(':scope > .ft-v510-home-lesson-icon[data-v510-lesson-id="l8"]');
        if(!card||!icon)throw new Error('Home canonical lesson identity missing');
        if(icon.textContent.trim()!=='📍')throw new Error(`Home lesson icon is not curriculum l8 icon (${icon.textContent.trim()})`);
        if(w.getComputedStyle(icon).display==='none')throw new Error('Home canonical lesson icon is hidden');
        const pseudo=w.getComputedStyle(card,'::before');
        if(!['none','normal','""'].includes(pseudo.content))throw new Error(`legacy generic Home lesson pseudo icon survived (${pseudo.content})`);
      }

      function assertLessonIdentity(w,d){
        const line=d.querySelector('.screen-lesson .teacher-line[data-v510-lesson-identity="l8"]');
        const icon=line?.querySelector(':scope > .ft-v510-lesson-identity-icon[data-v510-lesson-id="l8"]');
        const legacy=line?.querySelector(':scope > .luc');
        const label=line?.querySelector(':scope > div > strong');
        if(!line||!icon||!legacy||!label)throw new Error('lesson canonical identity DOM incomplete');
        if(icon.textContent.trim()!=='📍')throw new Error(`lesson icon is not curriculum l8 icon (${icon.textContent.trim()})`);
        if(label.textContent.trim()!=='Hỏi đường & tìm địa điểm')throw new Error(`lesson identity label mismatch (${label.textContent.trim()})`);
        if(w.getComputedStyle(icon).display==='none')throw new Error('lesson canonical icon is hidden');
        if(w.getComputedStyle(legacy).display!=='none')throw new Error('legacy tutor/brain avatar still visible in lesson identity row');
        if(legacy.hasAttribute('data-v510-tyffany-avatar'))throw new Error('lesson identity still owned by Tyffany avatar decorator');
      }

      function assertProgressBrand(d){
        const img=d.querySelector('.b27-progress-page .b27-brandline > img[data-v510-brand-identity="goat-v1"]');
        if(!img)throw new Error('Progress canonical FTQ brand mark missing');
        if(img.getAttribute('src')!=='./assets/premium/brand/goat-app-icon-180.png')throw new Error(`Progress still uses wrong brand asset (${img.getAttribute('src')})`);
        if((img.getAttribute('src')||'').includes('Favicon.png'))throw new Error('legacy Favicon survived on Progress');
      }

      function assertListeningParity(w,d){
        const header=d.querySelector('.listening-top[data-v510-feature-header="listening"]');
        if(!header)throw new Error('Listening Feature Header missing');
        const identity=header.querySelector(':scope > .ft-v510-feature-identity');
        const title=identity?.querySelector('.ft-v510-feature-title');
        const score=header.querySelector(':scope > .listening-session-score');
        if(!identity||!title||!score)throw new Error('Listening identity/score DOM incomplete');
        if(title.textContent.trim()!=='Luyện nghe')throw new Error(`wrong Listening title (${title.textContent.trim()})`);
        if(w.getComputedStyle(score).display!=='none')throw new Error('mobile Listening 0/0 session pill still participates in header');
        const settings=header.querySelector(':scope > .listening-settings');
        if(settings){
          const ss=w.getComputedStyle(settings);
          if(ss.position!=='absolute')throw new Error(`Listening Settings still owns a grid column (${ss.position})`);
          const tr=title.getBoundingClientRect();
          const sr=settings.getBoundingClientRect();
          if(tr.right>sr.left-5)throw new Error('Listening title collides with floating Settings');
        }
        const columns=w.getComputedStyle(header).gridTemplateColumns.trim().split(/\s+/).filter(Boolean);
        if(columns.length!==2)throw new Error(`Listening mobile header still has ${columns.length} layout columns (${columns.join(' | ')})`);
        const art=identity.querySelector('.ft-v510-feature-art-host');
        if(!art||art.getBoundingClientRect().width<50)throw new Error('Listening feature artwork geometry regressed');
      }

      async function assertTyffanyButtonCentered(w,d){
        let button=d.querySelector('.screen-lesson .french-block .listen[data-speaking-model-owner="exercise"]');
        for(let i=0;!button&&i<8;i++){
          const prev=d.querySelector('.screen-lesson [data-prev]:not(:disabled)');
          if(!prev)break;
          prev.click();
          await pause(180);
          button=d.querySelector('.screen-lesson .french-block .listen[data-speaking-model-owner="exercise"]');
        }
        if(!button)return;
        const style=w.getComputedStyle(button);
        if(style.display!=='flex')throw new Error(`Nghe Tyffany button is not flex-centered (${style.display})`);
        if(style.alignItems!=='center')throw new Error(`Nghe Tyffany vertical alignment regressed (${style.alignItems})`);
        if(style.justifyContent!=='center')throw new Error(`Nghe Tyffany horizontal alignment regressed (${style.justifyContent})`);
      }

      async function run(){
        const frame=document.createElement('iframe');
        frame.width='430';frame.height='932';frame.style.width='430px';frame.style.height='932px';
        frame.src=`../../?uxSmoke=lesson8&v510FieldIdentity=${Date.now()}`;
        document.body.appendChild(frame);
        await new Promise((resolve,reject)=>{frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('app load timeout')),24000)});
        const w=frame.contentWindow,d=frame.contentDocument;
        await waitFor(()=>w.FrenchTranquilleBuild27Shell?.openPractice&&w.FrenchTranquilleThemes?.apply&&w.FrenchTranquilleV510PracticeIcons?.refresh,24000,'V5.10 APIs');
        w.FrenchTranquilleThemes.apply('jade');
        await waitFor(()=>d.documentElement.dataset.theme==='jade',5000,'Jade theme');

        await assertDecoratorStoreSafe(w,()=>w.FrenchTranquilleV510PracticeIcons.refreshLessonIdentities(),'Home lesson identity');
        await waitFor(()=>d.querySelector('.b27-home .ft-v510-home-lesson-icon[data-v510-lesson-id="l8"]'),5000,'Home lesson icon');
        assertHomeLessonIdentity(w,d);

        d.querySelector('.bottom-nav [data-go="progress"]')?.click();
        await waitFor(()=>d.querySelector('.b27-progress-page .b27-brandline > img'),24000,'Progress page');
        await assertDecoratorStoreSafe(w,()=>w.FrenchTranquilleV510PracticeIcons.refreshIdentityAssets(),'Progress identity');
        await waitFor(()=>d.querySelector('.b27-progress-page .b27-brandline > img[data-v510-brand-identity="goat-v1"]'),5000,'Progress brand decoration');
        assertProgressBrand(d);

        const lessonButton=await waitFor(()=>d.querySelector('.b27-progress-page [data-b27-open-lesson]'),10000,'Progress current lesson button');
        lessonButton.click();
        await waitFor(()=>d.querySelector('.screen-lesson .teacher-line'),24000,'lesson identity row');
        await assertDecoratorStoreSafe(w,()=>w.FrenchTranquilleV510PracticeIcons.refreshLessonIdentities(),'Lesson identity');
        await waitFor(()=>d.querySelector('.screen-lesson .teacher-line[data-v510-lesson-identity="l8"]'),5000,'canonical lesson identity');
        assertLessonIdentity(w,d);
        await assertTyffanyButtonCentered(w,d);

        await openPracticeAndClick(w,d,'listening');
        await waitFor(()=>d.querySelector('.listening-top[data-v510-feature-header="listening"]'),24000,'Listening header');
        await assertDecoratorStoreSafe(w,()=>w.FrenchTranquilleV510PracticeIcons.refreshFeatureHeaders(),'Listening Feature Header');
        await pause(170);
        assertListeningParity(w,d);
        w.FrenchTranquilleListening?.close?.();
        await pause(160);

        await openPracticeAndClick(w,d,'real-life');
        const real=await waitFor(()=>d.querySelector('.screen-conversation .topbar[data-v510-feature-header="real-life"]'),24000,'Real-Life header');
        await assertDecoratorStoreSafe(w,()=>w.FrenchTranquilleV510PracticeIcons.refreshFeatureHeaders(),'Real-Life Feature Header');
        const realHost=real.querySelector('.ft-v510-feature-art-host')?.getBoundingClientRect();
        if(!realHost||realHost.width<50)throw new Error('Real-Life comparison header missing');

        frame.remove();
      }

      run().then(pass).catch(fail);
      setTimeout(()=>{if(result.dataset.v510FieldIdentity==='pending')fail(new Error('tribunal watchdog'))},100000);
    })();
  </script>
</body>
</html>
