<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Build 38.2 learner-facing integration tribunal</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111e;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;background:#20314a;border:1px solid #5f7595;border-radius:12px;padding:8px 12px}.primary{background:#315d74}.secondary{background:#253852}.muted{color:#9fb0c5}.screen-lesson{width:min(760px,calc(100% - 24px));margin:20px auto}.topbar{padding:10px 2px}.topbar h1{font-size:1.25rem}.lesson-step{padding:18px;border:1px solid #23364d;border-radius:20px;background:#0d1928;display:grid;gap:12px}.lesson-step>p{margin:0}.lesson-step>[data-existing-continue]{min-height:48px;width:100%}
  </style>
  <script>
    (()=>{
      const debug=new URLSearchParams(location.search).get('debug')==='fr';
      localStorage.clear();
      localStorage.setItem('tran-french-teacher:debug-fr:v1',debug?'1':'0');
      localStorage.setItem('b38.2:sentinel','unchanged');
      window.__b382Debug=debug;
      window.__b382StorageBefore=JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]));
    })();
  </script>
</head>
<body>
  <main id="app">
    <section class="screen-lesson">
      <div class="topbar"><h1>Bài 33 — Il / elle ở hiện tại</h1></div>
      <div class="lesson-step">
        <p data-existing-lesson>Existing lesson 33 content</p>
        <button type="button" class="primary" data-existing-continue>Continuer</button>
      </div>
    </section>
  </main>
  <script src="../../src/pedagogy/foundations-capsule-engine.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/foundations-capsules.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/foundations-pilot.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/generalization-transfer-core.js?v=2.4.0-b38.1"></script>
  <script src="../../src/pedagogy/generalization-transfer-lesson.js?v=2.4.0-b38.2"></script>
  <script>
    (()=>{
      const root=document.documentElement;
      const fail=message=>{root.dataset.b382Error=message;throw new Error(message)};
      const ok=(value,message)=>{if(!value)fail(message)};
      const text=selector=>document.querySelector(selector)?.textContent?.trim()||'';
      const texts=selector=>[...document.querySelectorAll(selector)].map(node=>node.textContent.trim());
      const click=selector=>{const node=document.querySelector(selector);ok(node,`missing ${selector}`);node.click();return node};
      const clickChoice=choice=>{const node=[...document.querySelectorAll('[data-transfer-choice]')].find(button=>button.textContent.trim()===choice);ok(node,`missing transfer choice ${choice}`);node.click();return node};
      const expected=window.__b382Debug?{
        title:'Changer la personne, reconstruire la phrase',
        entry:'3 phrases courtes : change la personne, garde l’idée et le verbe, puis reconstruis toute la phrase. Facultatif pour continuer la leçon.',
        cta:'Essayer 3 phrases • ≈ 2 min',
        intro:'Garde l’idée et le verbe. Change la personne qui fait l’action, puis reconstruis la phrase.',
        cues:['Remplace « je » par « tu » et reconstruis la phrase.','Remplace « je » par « tu » et reconstruis la phrase.','Remplace « tu » par « elle » et reconstruis la phrase.']
      }:{
        title:'Đổi người, xây lại câu',
        entry:'3 câu ngắn: đổi người, giữ ý và động từ, rồi xây lại cả câu. Không bắt buộc để tiếp tục bài.',
        cta:'Thử 3 câu • khoảng 2 phút',
        intro:'Giữ ý chính và động từ. Đổi người làm hành động, rồi xây lại câu.',
        cues:['Đổi « je » thành « tu », rồi xây lại câu.','Đổi « je » thành « tu », rồi xây lại câu.','Đổi « tu » thành « elle », rồi xây lại câu.']
      };

      try{
        ok(window.FrenchTranquilleGeneralizationTransfer?.family?.id==='subject-substitution-regular-er','38.1 core missing');
        ok(window.FrenchTranquilleGeneralizationTransfer?.status==='pure-non-wired','38.1 core contract changed');
        ok(window.FrenchTranquilleTransferLesson?.slice==='38.2','38.2 adapter missing');
        ok(window.FrenchTranquilleTransferLesson?.lesson===33,'38.2 lesson owner mismatch');
        ok(window.FrenchTranquilleTransferLesson?.persistent===false,'38.2 must be ephemeral');
        ok(window.FrenchTranquilleTransferLesson?.masteryClaim===false,'38.2 must not claim mastery');
        ok(JSON.stringify(window.FrenchTranquilleTransferLesson?.exerciseIndexes)===JSON.stringify([0,2,5]),'38.2 fixed catalog selection changed');

        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','lesson 33 F08 owner missing');
        ok(document.querySelectorAll('[data-transfer-entry]').length===1,'lesson 33 needs exactly one transfer entry');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferFamily==='subject-substitution-regular-er','wrong transfer family');
        const foundationEntry=document.querySelector('[data-foundation-entry]');
        const transferEntry=document.querySelector('[data-transfer-entry]');
        ok(foundationEntry.compareDocumentPosition(transferEntry)&Node.DOCUMENT_POSITION_FOLLOWING,'transfer entry must follow Foundations entry');
        ok(text('.ft-transfer-entry h3')===expected.title,'transfer entry title mismatch');
        ok(text('.ft-transfer-entry p')===expected.entry,'transfer entry copy mismatch');
        ok(text('[data-transfer-open]').startsWith(expected.cta),'transfer CTA mismatch');

        click('[data-transfer-open]');
        ok(document.querySelector('.ft-transfer-dialog')?.dataset.transferActiveFamily==='subject-substitution-regular-er','transfer dialog family missing');
        ok(text('.ft-transfer-top h2')===expected.title,'transfer dialog title mismatch');
        ok(text('.ft-transfer-copy strong')===expected.intro,'transfer intro mismatch');
        click('[data-transfer-next]');

        const sources=['Je travaille.','J\'habite ici.','Tu aimes ça.'];
        const targets=['Tu travailles.','Tu habites ici.','Elle aime ça.'];
        const expectedChoices=[
          ['Tu travaille.','Je travaille.','Tu travailles.'],
          ["J'habite ici.",'Tu habites ici.','Tu habite ici.'],
          ['Elle aime ça.','Elle aimes ça.','Tu aimes ça.']
        ];
        for(let index=0;index<targets.length;index+=1){
          ok(text('.ft-transfer-q h3')===expected.cues[index],`transfer cue ${index+1} mismatch`);
          ok(text('.ft-transfer-source')===sources[index],`transfer source ${index+1} mismatch`);
          ok(JSON.stringify(texts('[data-transfer-choice]'))===JSON.stringify(expectedChoices[index]),`transfer choices ${index+1} mismatch`);
          clickChoice(targets[index]);
          const correct=[...document.querySelectorAll('[data-transfer-choice]')].find(button=>button.textContent.trim()===targets[index]);
          ok(correct?.classList.contains('ok'),`transfer ${index+1} correct marking missing`);
          click('[data-transfer-next]');
        }

        ok(document.querySelector('.ft-transfer-done'),'transfer completion missing');
        ok(!/maîtris|thành thạo/i.test(text('.ft-transfer-done h3')),'completion heading must not claim mastery');
        click('.ft-transfer-done [data-transfer-close]');
        ok(!document.querySelector('.ft-transfer-overlay'),'transfer overlay must close');
        ok(document.activeElement?.matches('[data-transfer-open]'),'focus must return to transfer CTA');
        ok(document.querySelector('[data-existing-lesson]'),'lesson content must survive transfer round trip');
        click('[data-existing-continue]');
        root.dataset.b382Continued='1';

        document.querySelector('.topbar h1').textContent='Bài 32 — Nói với “tu” ở hiện tại';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','lesson 32 must remain F08');
        ok(!document.querySelector('[data-transfer-entry]'),'lesson 32 must not expose 38.2 transfer');

        document.querySelector('.topbar h1').textContent='Bài 34 — Nous — nói “chúng ta”';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson 34 must remain F05');
        ok(!document.querySelector('[data-transfer-entry]'),'lesson 34 must not expose 38.2 transfer');

        ok(JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]))===window.__b382StorageBefore,'localStorage changed during 38.2');
        ok(document.documentElement.scrollWidth<=innerWidth+1,'horizontal overflow detected');

        document.querySelector('.topbar h1').textContent='Bài 33 — Il / elle ở hiện tại';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-transfer-open]').getBoundingClientRect().height>=44,'transfer entry target below 44px');

        root.dataset.b382Done='1';
        root.dataset.b382Locale=window.__b382Debug?'fr':'vi';
        root.dataset.b382Family='subject-substitution-regular-er';
        root.dataset.b382Exercises='3';
        root.dataset.b382Lesson='33';
        root.dataset.b382FoundationCoexists='1';
        root.dataset.b382Routing='1';
        root.dataset.b382StorageUnchanged='1';
        root.dataset.b382NoOverflow='1';
      }catch(error){
        if(!root.dataset.b382Error)root.dataset.b382Error=error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
