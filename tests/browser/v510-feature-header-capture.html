<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>V5.10 Feature Header capture</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050813}
    iframe{display:block;width:100%;height:100%;border:0;background:#050813}
    #status{position:fixed;inset:auto 8px 8px 8px;z-index:99;padding:8px 10px;border-radius:10px;background:#9f1d35;color:#fff;font:600 12px/1.35 system-ui;display:none}
    html[data-capture-state="fail"] #status{display:block}
  </style>
</head>
<body>
  <iframe id="app" title="French Trân’quille capture"></iframe>
  <div id="status"></div>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const feature=params.get('feature')||'listening';
      const theme=params.get('theme')||'aurora';
      const debugFr=params.get('debug')==='fr';
      const expected={review:'review',listening:'listening',speak:'speak','real-life':'real-life'};
      const app=document.getElementById('app');
      const status=document.getElementById('status');
      const pause=ms=>new Promise(r=>setTimeout(r,ms));
      const waitFor=async(fn,timeout=20000)=>{const start=performance.now();while(performance.now()-start<timeout){try{const value=fn();if(value)return value}catch{}await pause(50)}throw new Error(`timeout waiting for ${feature}`)};
      const fail=error=>{document.documentElement.dataset.captureState='fail';status.textContent=`CAPTURE FAIL · ${feature} · ${error?.message||error}`};
      const ready=()=>{document.documentElement.dataset.captureState='ready';document.documentElement.dataset.captureFeature=feature;document.documentElement.dataset.captureTheme=theme;document.documentElement.dataset.captureLanguage=debugFr?'fr':'vi'};

      async function openPracticeAndClick(w,d,id){
        d.querySelector('[data-b27-close-practice]')?.click();
        w.FrenchTranquilleListening?.close?.();
        await pause(120);
        w.FrenchTranquilleBuild27Shell.openPractice();
        const button=await waitFor(()=>d.querySelector(`.b27-practice-action[data-b27-practice-action="${id}"]`));
        button.click();
      }

      function titleMetrics(w,header){
        const title=header.querySelector('.ft-v510-feature-title');
        if(!title)throw new Error('Feature Header title missing');
        const style=w.getComputedStyle(title);
        const lineHeight=Number.parseFloat(style.lineHeight)||Number.parseFloat(style.fontSize)*1.1;
        const titleHeight=title.getBoundingClientRect().height;
        return {title,lineHeight,titleHeight,lines:titleHeight/Math.max(lineHeight,1)};
      }

      function assertDesktopFieldGeometry(w,d,header){
        if(w.innerWidth<1024)return;

        const painted=[d.body];
        if(feature==='listening'){
          const overlay=d.querySelector('.listening-overlay');
          if(overlay)painted.push(overlay);
        }
        for(const node of painted){
          const sizes=w.getComputedStyle(node).backgroundSize.split(',').map(value=>value.trim());
          if(sizes.length<2||sizes.some(value=>value!=='cover')){
            throw new Error(`split Premium scene survived (${sizes.join(' | ')})`);
          }
        }

        const shell=feature==='listening'
          ? d.querySelector('.listening-shell')
          : feature==='review'
            ? d.querySelector('.screen-review .narrow')
            : d.querySelector('.screen-conversation .narrow');
        if(!shell)throw new Error('feature shell missing');
        const shellWidth=shell.getBoundingClientRect().width;
        if(shellWidth<920||shellWidth>1005)throw new Error(`desktop feature shell width ${shellWidth.toFixed(1)}px`);

        const headerWidth=header.getBoundingClientRect().width;
        if(headerWidth<920||headerWidth>1005)throw new Error(`desktop Feature Header width ${headerWidth.toFixed(1)}px`);

        const {lineHeight,titleHeight}=titleMetrics(w,header);
        if(titleHeight>lineHeight*1.35)throw new Error(`desktop title wrapped (${titleHeight.toFixed(1)}px / ${lineHeight.toFixed(1)}px)`);

        document.documentElement.dataset.captureShellWidth=String(Math.round(shellWidth));
      }

      async function assertMobileFieldGeometry(w,d,header){
        if(w.innerWidth>520)return;
        const {title,lines}=titleMetrics(w,header);
        if(feature==='real-life'&&!debugFr&&lines>2.15){
          throw new Error(`Vietnamese Real-Life title still squeezed (${lines.toFixed(2)} lines)`);
        }
        if(feature==='real-life'&&!debugFr&&title.textContent.trim()!=='Tình huống thực tế'){
          throw new Error(`wrong Vietnamese Real-Life title (${title.textContent.trim()})`);
        }

        if(feature==='review'){
          w.FrenchTranquilleV510PracticeIcons?.refreshTyffanyIcons?.();
          const memory=await waitFor(()=>d.querySelector('.screen-review [data-v510-tyffany-icon="canonical-svg-v1"]'));
          const mark=memory.querySelector('.ft-v510-tyffany-mark');
          if(!mark)throw new Error('Tyffany SVG mark missing');
          if((memory.textContent||'').includes('🧠'))throw new Error('legacy Tyffany brain emoji survived');
          const mask=w.getComputedStyle(mark).webkitMaskImage||w.getComputedStyle(mark).maskImage||'';
          if(!mask.includes('tyffany-memory.svg'))throw new Error(`Tyffany SVG mask missing (${mask})`);
          if(w.FrenchTranquilleV510PracticeIcons?.tyffanyAsset!=='./assets/premium/brand/tyffany-memory.svg')throw new Error('Tyffany canonical asset marker mismatch');
        }

        document.documentElement.dataset.captureTitleLines=lines.toFixed(2);
      }

      async function route(w,d){
        w.FrenchTranquilleThemes.apply(theme);
        await waitFor(()=>d.documentElement.dataset.theme===theme);
        if(feature==='review') await openPracticeAndClick(w,d,'review');
        if(feature==='listening') await openPracticeAndClick(w,d,'listening');
        if(feature==='real-life') await openPracticeAndClick(w,d,'real-life');
        if(feature==='speak'){
          await openPracticeAndClick(w,d,'conversation');
          const voice=await waitFor(()=>d.querySelector('[data-session-practice-mode="voice"]'));
          voice.click();
          await waitFor(()=>d.documentElement.dataset.sessionPracticeMode==='voice');
        }
        const header=await waitFor(()=>{
          w.FrenchTranquilleV510PracticeIcons?.refreshFeatureHeaders?.();
          return d.querySelector(`[data-v510-feature-header="${expected[feature]}"]`);
        });
        await waitFor(()=>{
          const brand=header.querySelector('.ft-v510-feature-brand');
          const title=header.querySelector('.ft-v510-feature-title');
          if(!brand||!title)return false;
          const style=w.getComputedStyle(brand);
          const rect=brand.getBoundingClientRect();
          return style.display!=='none'&&style.visibility!=='hidden'&&Number.parseFloat(style.opacity)>0&&rect.width>0&&rect.height>0;
        });
        await pause(550);
        assertDesktopFieldGeometry(w,d,header);
        await assertMobileFieldGeometry(w,d,header);
      }

      const debugQuery=debugFr?'&debug=fr':'';
      app.src=`../../?uxSmoke=lesson8${debugQuery}&v510Capture=${encodeURIComponent(feature)}-${Date.now()}`;
      app.addEventListener('load',async()=>{
        try{
          const w=app.contentWindow,d=app.contentDocument;
          await waitFor(()=>w.FrenchTranquilleBuild27Shell?.openPractice&&w.FrenchTranquilleThemes?.apply&&w.FrenchTranquilleV510PracticeIcons?.refreshFeatureHeaders);
          await route(w,d);
          ready();
        }catch(error){fail(error)}
      },{once:true});
      setTimeout(()=>{if(!document.documentElement.dataset.captureState)fail(new Error('capture watchdog'))},26000);
    })();
  </script>
</body>
</html>
