<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build 36.3 Recovery v3 tribunal</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}iframe{display:block}</style></head>
<body><iframe id="app" title="French Tranquille Build 36.3 tribunal"></iframe>
<script>
(() => {
  'use strict';
  const root=document.documentElement, mode=new URLSearchParams(location.search).get('mode')||'adopt', frame=document.getElementById('app');
  let injected=false,timer=null,observer=null;
  function mirror(){
    try{
      const child=frame.contentDocument?.documentElement;
      if(!child)return false;
      [...child.attributes].forEach(attr=>{
        if(attr.name.startsWith('data-b36t-'))root.setAttribute(attr.name,attr.value);
      });
      const done=child.dataset.b36tDone;
      if(done!=='1'&&done!=='0')return false;
      root.dataset.b36HostDone=done;
      root.dataset.b36HostMode=mode;
      if(done==='1')delete root.dataset.b36HostError;
      return true;
    }catch(error){
      root.dataset.b36HostError=String(error?.message||error);
      return false;
    }
  }
  function stopPolling(){
    if(timer!==null){clearInterval(timer);timer=null}
    if(observer!==null){observer.disconnect();observer=null}
  }
  // Same-origin child reports completion synchronously when possible.
  window.__b36TribunalMirror=()=>{if(mirror())stopPolling()};
  function inject(){
    if(injected)return;
    const doc=frame.contentDocument;
    if(!doc?.body){root.dataset.b36HostInjection='waiting-body';return}
    injected=true;
    root.dataset.b36HostInjection='appended';
    const script=doc.createElement('script');
    script.src='./tests/smoke/build36-recovery-v3-tribunal-smoke.js?v=2.4.0-b36.3';
    script.onload=()=>{root.dataset.b36HostScript='loaded'};
    script.onerror=()=>{stopPolling();root.dataset.b36HostDone='0';root.dataset.b36HostError='tribunal-script-load-failed'};
    doc.body.appendChild(script);
  }
  frame.addEventListener('load',()=>{
    root.dataset.b36HostFrame='loaded';
    stopPolling();
    const childRoot=frame.contentDocument?.documentElement;
    if(childRoot){
      observer=new MutationObserver(()=>{if(mirror())stopPolling()});
      observer.observe(childRoot,{attributes:true});
    }
    inject();
    if(!mirror()){
      timer=setInterval(()=>{if(mirror())stopPolling()},50);
    }
    // Intentionally no earlier virtual-time watchdog: Chrome's --virtual-time-budget
    // and the workflow's real-time shell timeout bound execution. An internal 30s
    // virtual timer raced with the 32s budget and overwrote successful child results.
    // Missing completion still fails the CI's required host+child marker assertions.
  });
  frame.src=`../../?b36RecoveryTribunal=${encodeURIComponent(mode)}`;
})();
</script></body></html>
