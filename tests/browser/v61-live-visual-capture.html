<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6.1 live visual capture</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d20}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="ft" title="French Trân’quille V6.1" src="../../index.html?v61VisualReview=1"></iframe>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),theme=q.get('theme')||'aurora',screen=q.get('screen')||'home',largeText=q.get('largeText')==='1',f=document.getElementById('ft');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(fn,max=19000)=>{const start=Date.now();while(Date.now()-start<max){if(fn())return;await wait(130)}throw Error('timeout '+screen)};
f.addEventListener('load',async()=>{try{
 const w=f.contentWindow,d=f.contentDocument;
 await until(()=>w.FrenchTranquilleV61 && d.querySelector('.b27-home .b27-primary-card'));
 if(!w.FrenchTranquilleThemes?.apply)throw Error('theme API missing');
 w.FrenchTranquilleThemes.apply(theme);
 await wait(300);
 // Simulates 125% root-text scaling, not an actual iOS Dynamic Type field test.
 if(largeText)d.documentElement.style.fontSize='20px';
 if(screen==='practice'||screen==='practice-bottom'){
   const nav=d.querySelector('.ux-bottom-nav [data-ux-nav="practice"]');
   if(nav)nav.click();else w.FrenchTranquilleBuild27Shell?.openPractice?.();
   await until(()=>d.querySelectorAll('body > .b27-practice-page [data-b27-practice-action]').length>=4,6000);
 }else if(screen!=='home'&&screen!=='home-bottom'&&screen!=='home-cta')throw Error('unsupported surface');
 w.FrenchTranquilleV61.refresh();
 await wait(450);
 const homeScreen=screen==='home'||screen==='home-bottom'||screen==='home-cta';
 const target=homeScreen?d.querySelector('.b27-home .b27-primary-card'):d.querySelector('.b27-practice-page .b27-practice-list');
 if(!target)throw Error('target missing');
 // Stitch Export 4 must remain a CSS skin of the actual three-tab owner.
 const navButtons=[...d.querySelectorAll('.ux-bottom-nav [data-ux-nav]')];
 if(navButtons.length!==3)throw Error('Stitch skin changed real three-tab navigation');
 const visualAccent=w.getComputedStyle(d.documentElement).getPropertyValue('--v61-stitch-highlight').trim();
 if(!visualAccent)throw Error('Export4 themed visual treatment is missing');
 const title=homeScreen?d.querySelector('.b27-home .b27-welcome h1'):
   d.querySelector('.b27-practice-page .b27-practice-intro h2');
 if(!title)throw Error('original language headline missing');
 if(theme!=='aurora'&&!w.getComputedStyle(title).fontFamily.toLowerCase().includes('georgia'))
   throw Error('Export4 editorial local serif style missing: '+theme);
 if(homeScreen){
   const lessonTotal=w.FrenchTranquilleCurriculum?.lessons?.length;
   const badge=d.querySelector('.b27-home .b27-primary-card .b27-card-topline > span');
   if(lessonTotal!==52)throw Error('curriculum not fully extended: '+lessonTotal);
   if(!badge || !badge.textContent.trim().endsWith('/ '+lessonTotal))throw Error('home badge is stale: '+(badge?.textContent||'missing'));
   const cafe=d.querySelector('.b27-home .v61-cafe-scene');
   if(!cafe||cafe.querySelectorAll('img').length!==2)throw Error('hero cafe illustration missing');
 }
 if(screen==='practice'||screen==='practice-bottom'){
   const buttons=[...d.querySelectorAll('.b27-practice-list > [data-b27-practice-action]')];
   if(buttons.some(b=>!b.querySelector('.v61-card-kicker')||!b.querySelector('.v61-card-cta')))throw Error('V6.1 action composition missing');
   // On iPhone-width captures, bilingual captions must not shrink below 12 CSS px.
   // A disabled module must still be a disabled button with its lock CTA.
   for(const b of buttons){
     const caption=b.querySelector('small');
     if(caption&&parseFloat(w.getComputedStyle(caption).fontSize)<12)
       throw Error('Practice caption too small '+b.dataset.b27PracticeAction);
     if(b.disabled&&!b.querySelector('.v61-card-cta')?.textContent?.includes('Chưa mở'))
       throw Error('Practice locked state lost '+b.dataset.b27PracticeAction);
   }
 }
 if(homeScreen&&!w.getComputedStyle(target).backgroundImage.includes('gradient'))throw Error('hero style missing');
 if(screen==='practice'){
   const actions=[...target.querySelectorAll('[data-b27-practice-action]')];
   if(actions.length!==4)throw Error('expected 4 activities, got '+actions.length);
   const topLevel=[...d.querySelectorAll('.b27-practice-page .b27-practice-action')];
   if(topLevel.length!==4)throw Error('expected exactly four primary Practice button owners, got '+topLevel.length);
   if(actions.filter(a=>a.querySelector('img.ft-v510-practice-art')).length!==4)throw Error('missing approved 3D assets');
 }
 if(d.documentElement.scrollWidth>d.documentElement.clientWidth+3)throw Error('horizontal overflow '+d.documentElement.scrollWidth);
 for(const img of d.querySelectorAll('img.ft-v510-practice-art')){
   if(img.complete&&!img.naturalWidth)throw Error('asset failed '+img.src);
 }

 if(screen==='practice-bottom'){
   const scroller=d.querySelector('.b27-practice-page');
   if(!scroller)throw Error('Practice scroller missing');
   scroller.scrollTop=scroller.scrollHeight;
   await wait(200);
   const actions=[...d.querySelectorAll('.b27-practice-list > [data-b27-practice-action]')];
   for(const id of ['review','real-life']){
     const action=actions.find(a=>a.dataset.b27PracticeAction===id);
     const cta=action?.querySelector('.v61-card-cta');
     if(!cta)throw Error('lower action missing '+id);
     const rect=cta.getBoundingClientRect();
     if(rect.top<0||rect.bottom>d.documentElement.clientHeight-55)throw Error('lower CTA covered '+id+' '+rect.bottom);
     const target=d.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2);
     if(!action.contains(target))throw Error('lower CTA untappable '+id);
   }
 }else if(screen==='home-cta'){
   const cta=d.querySelector('.b27-home .b27-primary-card > .b27-primary-action');
   const nav=d.querySelector('.ux-bottom-nav');
   if(!cta||cta.disabled||!nav)throw Error('Home primary lesson CTA missing or disabled');
   cta.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'});
   await wait(250);
   const rect=cta.getBoundingClientRect(),navRect=nav.getBoundingClientRect();
   if(rect.top<0||rect.bottom>navRect.top-8||rect.width<44||rect.height<44)
     throw Error('Home primary CTA covered or too small: '+JSON.stringify({top:rect.top,bottom:rect.bottom,navTop:navRect.top}));
   const hit=d.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2);
   if(!cta.contains(hit)&&cta!==hit)throw Error('Home primary CTA untappable after scroll');
   document.body.dataset.v61CaptureHomeCta='1';
 }else if(screen==='home-bottom'){
   const side=d.querySelector('.b27-home .b27-home-side');
   const action=side?.querySelector('.v61-quick-conversation');
   const nav=d.querySelector('.ux-bottom-nav');
   const navHome=nav?.querySelector('[data-ux-nav="home"]');
   if(!action||action.disabled||!nav||!navHome)throw Error('Home quick action or bottom navigation missing');
   // Scroll in the actual nested learner scroll container. This exercises the
   // same touch-scroll geometry as installed PWA, rather than a static DOM check.
   action.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'});
   await wait(250);
   const rect=action.getBoundingClientRect(),navRect=nav.getBoundingClientRect();
   const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
   if(rect.top<0||rect.bottom>navRect.top-8||rect.width<44||rect.height<44)
     throw Error('Home quick CTA covered or too small: '+JSON.stringify({top:rect.top,bottom:rect.bottom,navTop:navRect.top}));
   const hit=d.elementFromPoint(x,y);
   if(!action.contains(hit)&&hit!==action)throw Error('Home quick CTA untappable');
   const homeNavRect=navHome.getBoundingClientRect();
   const navHit=d.elementFromPoint(homeNavRect.left+homeNavRect.width/2,homeNavRect.top+homeNavRect.height/2);
   if(!navHome.contains(navHit)&&navHit!==navHome)throw Error('Home tab untappable after scroll');
   document.body.dataset.v61CaptureHomeBottom='1';
 }else{
   d.scrollingElement.scrollTop=0;
 }
 document.body.dataset.v61CaptureReady='1';
 document.body.dataset.v61CaptureTheme=theme;
 document.body.dataset.v61CaptureScreen=screen;
 document.body.dataset.v61CaptureOwner=w.FrenchTranquilleV61.version;
 document.body.dataset.v61CaptureTextScale=largeText?'125':'100';
}catch(e){document.body.dataset.v61CaptureReady='0';document.body.dataset.v61CaptureError=String(e?.message||e)}},{once:true});
})();
</script></body></html>
