<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Premium V5.8 debug/theme decoupling tribunal</title><style>body{margin:0}iframe{display:block;border:0}</style></head><body>
<iframe id="appframe" src="../../index.html?fieldNavV3=1" style="width:390px;height:844px"></iframe><script>
(()=>{'use strict';
const R=document.documentElement,F=document.getElementById('appframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const waitFor=async(fn,limit=14000)=>{for(let t=0;t<limit;t+=50){try{const v=fn();if(v)return v}catch{}await wait(50)}return null};
const themes=['original','aurora','sunset','jade'];
const learnerKeys=['francais-avec-luc:learner:v1','french-tranquille:learning-memory:v1','french-tranquille:error-intelligence:v1','french-tranquille:scenarios:v1','french-tranquille:listening:v1','french-tranquille:milestones:v1'];
const visible=(w,n)=>{if(!n)return false;const s=w.getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&r.width>1&&r.height>1};
const finish=(ok,msg)=>{R.dataset.premiumV58=ok?'ok':'fail';R.dataset.premiumV58Detail=msg};
F.addEventListener('load',()=>setTimeout(async()=>{let oldTheme=null,oldDebug=null;try{
 const w=F.contentWindow,d=F.contentDocument,ready=await waitFor(()=>w.FrenchTranquilleThemes&&w.FrenchTranquilleDebugFr&&w.FrenchTranquilleFieldNavigation);
 if(!ready)throw Error('api-missing');
 const themeKey=w.FrenchTranquilleThemes.key,debugKey=w.FrenchTranquilleDebugFr.key;
 oldTheme=w.localStorage.getItem(themeKey);oldDebug=w.localStorage.getItem(debugKey);
 const before=Object.fromEntries(learnerKeys.map(k=>[k,w.localStorage.getItem(k)]));
 await w.FrenchTranquilleFieldNavigation.go('home');await wait(120);d.querySelector('.b27-home [data-b27-settings]')?.click();await wait(260);
 for(const theme of themes){
   w.FrenchTranquilleThemes.apply(theme);w.FrenchTranquilleDebugFr.apply(false);await wait(100);
   if(d.documentElement.dataset.theme!==theme||w.localStorage.getItem(themeKey)!==theme)throw Error(`${theme}:off-theme`);
   if(w.FrenchTranquilleDebugFr.current()||d.documentElement.classList.contains('ux-debug-mode')||d.documentElement.dataset.debugFr!=='off')throw Error(`${theme}:off-state`);
   if(visible(w,d.querySelector('.debug-fr-banner'))||visible(w,d.querySelector('#debug-fr-card')))throw Error(`${theme}:normal-debug-leak`);
 }
 for(const theme of themes){
   w.FrenchTranquilleThemes.apply(theme);w.FrenchTranquilleDebugFr.apply(true);await wait(120);
   if(d.documentElement.dataset.theme!==theme||w.localStorage.getItem(themeKey)!==theme)throw Error(`${theme}:on-theme`);
   if(!w.FrenchTranquilleDebugFr.current()||!d.documentElement.classList.contains('ux-debug-mode')||d.documentElement.dataset.debugFr!=='on')throw Error(`${theme}:on-state`);
   if(!visible(w,d.querySelector('.debug-fr-banner'))||!visible(w,d.querySelector('#debug-fr-card')))throw Error(`${theme}:debug-ui`);
   w.FrenchTranquilleThemes.apply(themes[(themes.indexOf(theme)+1)%themes.length]);await wait(80);
   if(!w.FrenchTranquilleDebugFr.current())throw Error(`${theme}:theme-switch-exited-debug`);
   w.FrenchTranquilleThemes.apply(theme);
 }
 w.FrenchTranquilleThemes.apply('sunset');w.FrenchTranquilleDebugFr.apply(false);await wait(80);
 if(d.documentElement.dataset.theme!=='sunset'||w.localStorage.getItem(themeKey)!=='sunset')throw Error('debug-switch-reset-theme');
 if(visible(w,d.querySelector('.debug-fr-banner'))||visible(w,d.querySelector('#debug-fr-card')))throw Error('normal-mode-not-clean-after');
 for(const k of learnerKeys)if(before[k]!==w.localStorage.getItem(k))throw Error(`store-mutated:${k}`);
 if(oldTheme===null)w.localStorage.removeItem(themeKey);else w.localStorage.setItem(themeKey,oldTheme);
 if(oldDebug===null)w.localStorage.removeItem(debugKey);else w.localStorage.setItem(debugKey,oldDebug);
 finish(true,'themes=4;debug=off+on;theme-persists=1;debug-persists=1;normal=clean;stores=6-unchanged');
 }catch(e){finish(false,e.message)}},3000),{once:true});
setTimeout(()=>{if(!R.dataset.premiumV58)finish(false,'timeout')},30000);
})();
</script></body></html>
