<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Build 38.8 negation learner integration tribunal</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111e;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;background:#20314a;border:1px solid #5f7595;border-radius:12px;padding:8px 12px}.primary{background:#315d74}.secondary{background:#253852}.muted{color:#9fb0c5}.screen-lesson{width:min(760px,calc(100% - 24px));margin:20px auto}.topbar{padding:10px 2px}.topbar h1{font-size:1.25rem}.lesson-step{padding:18px;border:1px solid #23364d;border-radius:20px;background:#0d1928;display:grid;gap:12px}.lesson-step>p{margin:0}.lesson-step>[data-existing-continue]{min-height:48px;width:100%}
  </style>
  <script>
    (()=>{
      const debug=new URLSearchParams(location.search).get('debug')==='fr';
      localStorage.clear();
      localStorage.setItem('tran-french-teacher:debug-fr:v1',debug?'1':'0');
      localStorage.setItem('b38.8:sentinel','unchanged');
      window.__b388Debug=debug;
      window.__b388StorageBefore=JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]));
    })();
  </script>
</head>
<body>
  <main id="app">
    <section class="screen-lesson">
      <div class="topbar"><h1>Bài 34 — Nous — nói “chúng ta”</h1></div>
      <div class="lesson-step">
        <p data-existing-lesson>Existing lesson 34 content</p>
        <button type="button" class="primary" data-existing-continue>Continuer</button>
      </div>
    </section>
  </main>
  <script src="../../src/pedagogy/foundations-capsule-engine.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/foundations-capsules.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/foundations-pilot.js?v=2.4.0-b37.8"></script>
  <script src="../../src/pedagogy/generalization-transfer-core.js?v=2.4.0-b38.1"></script>
  <script src="../../src/pedagogy/generalization-negation-core.js?v=2.4.0-b38.8"></script>
  <script src="../../src/pedagogy/generalization-futur-proche-core.js?v=2.4.0-b38.5"></script>
  <script src="../../src/pedagogy/generalization-number-core.js?v=2.4.0-b38.7"></script>
  <script src="../../src/pedagogy/generalization-transfer-lesson.js?v=2.4.0-b38.2"></script>
  <script>
    (()=>{
      const root=document.documentElement;
      const fail=message=>{root.dataset.b388Error=message;throw new Error(message)};
      const ok=(value,message)=>{if(!value)fail(message)};
      const text=selector=>document.querySelector(selector)?.textContent?.trim()||'';
      const texts=selector=>[...document.querySelectorAll(selector)].map(node=>node.textContent.trim());
      const click=selector=>{const node=document.querySelector(selector);ok(node,`missing ${selector}`);node.click();return node};
      const clickChoice=choice=>{const node=[...document.querySelectorAll('[data-transfer-choice]')].find(button=>button.textContent.trim()===choice);ok(node,`missing transfer choice ${choice}`);node.click();return node};
      const expected=window.__b388Debug?{
        title:'Passer de l’affirmation à la négation',
        entry:'3 phrases déjà rencontrées : garde la même personne, le même verbe et la même idée, puis passe à la négation complète avec ne / n’ ... pas. Facultatif pour continuer la leçon.',
        cta:'Essayer 3 phrases • ≈ 2 min',
        intro:'Garde la même personne, le même verbe et la même idée. Transforme seulement la phrase affirmative en négation complète avec ne / n’ ... pas.',
        cues:[
          'Mets « Je travaille. » à la forme négative.',
          'Mets « J\'habite ici. » à la forme négative.',
          'Mets « J\'aime ça. » à la forme négative.'
        ]
      }:{
        title:'Từ khẳng định sang phủ định',
        entry:'3 câu đã gặp: giữ cùng người, động từ và ý chính, rồi chuyển sang phủ định đầy đủ với ne / n’ ... pas. Không bắt buộc để tiếp tục bài.',
        cta:'Thử 3 câu • khoảng 2 phút',
        intro:'Giữ cùng người, động từ và ý chính. Chỉ biến câu khẳng định thành câu phủ định đầy đủ với ne / n’ ... pas.',
        cues:[
          'Đổi “Je travaille.” sang câu phủ định.',
          'Đổi “J\'habite ici.” sang câu phủ định.',
          'Đổi “J\'aime ça.” sang câu phủ định.'
        ]
      };

      try{
        ok(window.FrenchTranquilleGeneralizationNegation?.family?.id==='affirmation-negation-regular-er-je','38.3 negation core missing');
        ok(window.FrenchTranquilleGeneralizationNegation?.status==='pure-non-wired','38.3 core contract changed');
        ok(window.FrenchTranquilleTransferLesson?.slice==='38.2','historical adapter owner changed');
        ok(window.FrenchTranquilleTransferLesson?.lesson===33,'legacy lesson33 owner changed');
        ok(JSON.stringify(window.FrenchTranquilleTransferLesson?.exerciseIndexes)===JSON.stringify([0,2,5]),'legacy 38.2 selection changed');
        ok(window.FrenchTranquilleTransferLesson?.integration==='38.5','38.5 integration marker changed');
        ok(window.FrenchTranquilleTransferLesson?.futureLesson===35,'future lesson owner changed');
        ok(window.FrenchTranquilleTransferLesson?.numberIntegration==='38.7','38.7 integration marker changed');
        ok(window.FrenchTranquilleTransferLesson?.numberLesson===13,'number lesson owner changed');
        ok(window.FrenchTranquilleTransferLesson?.negationIntegration==='38.8','38.8 integration marker missing');
        ok(window.FrenchTranquilleTransferLesson?.negationLesson===34,'negation lesson owner mismatch');
        ok(JSON.stringify(window.FrenchTranquilleTransferLesson?.negationExerciseIndexes)===JSON.stringify([0,1,2]),'negation selection mismatch');
        ok(window.FrenchTranquilleTransferLesson?.persistent===false,'Transfer must remain ephemeral');
        ok(window.FrenchTranquilleTransferLesson?.masteryClaim===false,'Transfer must not claim mastery');

        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson34 F05 owner missing');
        ok(document.querySelectorAll('[data-transfer-entry]').length===1,'lesson34 needs exactly one Transfer entry');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferFamily==='affirmation-negation-regular-er-je','wrong lesson34 Transfer family');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferLesson==='34','wrong lesson34 Transfer marker');
        const foundationEntry=document.querySelector('[data-foundation-entry]');
        const transferEntry=document.querySelector('[data-transfer-entry]');
        ok(foundationEntry.compareDocumentPosition(transferEntry)&Node.DOCUMENT_POSITION_FOLLOWING,'negation Transfer must follow F05');
        ok(text('.ft-transfer-entry h3')===expected.title,'negation entry title mismatch');
        ok(text('.ft-transfer-entry p')===expected.entry,'negation entry copy mismatch');
        ok(text('[data-transfer-open]').startsWith(expected.cta),'negation CTA mismatch');

        click('[data-transfer-open]');
        ok(document.querySelector('.ft-transfer-dialog')?.dataset.transferActiveFamily==='affirmation-negation-regular-er-je','negation dialog family missing');
        ok(document.querySelector('.ft-transfer-dialog')?.dataset.transferActiveLesson==='34','negation dialog lesson marker missing');
        ok(text('.ft-transfer-top h2')===expected.title,'negation dialog title mismatch');
        ok(text('.ft-transfer-copy strong')===expected.intro,'negation intro mismatch');
        click('[data-transfer-next]');

        const sources=['Je travaille.',"J'habite ici.","J'aime ça."];
        const targets=['Je ne travaille pas.',"Je n'habite pas ici.","Je n'aime pas ça."];
        const expectedChoices=[
          ['Je ne travaille.','Je travaille.','Je ne travaille pas.'],
          ["J'habite ici.","Je n'habite pas ici.",'Je ne habite pas ici.'],
          ["Je n'aime pas ça.",'Je ne aime pas ça.',"J'aime ça."]
        ];
        for(let index=0;index<targets.length;index+=1){
          ok(text('.ft-transfer-q h3')===expected.cues[index],`negation cue ${index+1} mismatch`);
          ok(text('.ft-transfer-source')===sources[index],`negation source ${index+1} mismatch`);
          ok(JSON.stringify(texts('[data-transfer-choice]'))===JSON.stringify(expectedChoices[index]),`negation choices ${index+1} mismatch`);
          ok([...document.querySelectorAll('[data-transfer-choice]')].every(button=>button.getBoundingClientRect().height>=44),`negation target ${index+1} below 44px`);
          clickChoice(targets[index]);
          const correct=[...document.querySelectorAll('[data-transfer-choice]')].find(button=>button.textContent.trim()===targets[index]);
          ok(correct?.classList.contains('ok'),`negation ${index+1} correct marking missing`);
          click('[data-transfer-next]');
        }

        ok(document.querySelector('.ft-transfer-done'),'negation completion missing');
        ok(!/maîtris|thành thạo/i.test(text('.ft-transfer-done h3')),'negation completion must not claim mastery');
        click('.ft-transfer-done [data-transfer-close]');
        ok(!document.querySelector('.ft-transfer-overlay'),'negation overlay must close');
        ok(document.activeElement?.matches('[data-transfer-open]'),'focus must return to negation Transfer CTA');
        ok(document.querySelector('[data-existing-lesson]'),'lesson34 content must survive round trip');
        click('[data-existing-continue]');
        root.dataset.b388Continued='1';

        document.querySelector('.topbar h1').textContent='Bài 33 — Il / elle ở hiện tại';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','lesson33 must remain F08');
        ok(document.querySelectorAll('[data-transfer-entry]').length===1,'lesson33 must have exactly one Transfer');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferFamily==='subject-substitution-regular-er','lesson33 legacy family changed');

        document.querySelector('.topbar h1').textContent='Bài 35 — Futur proche — sắp làm gì';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson35 must remain F05');
        ok(document.querySelectorAll('[data-transfer-entry]').length===1,'lesson35 must have exactly one Transfer');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferFamily==='present-futur-proche-travailler-singular','lesson35 future family changed');

        document.querySelector('.topbar h1').textContent='Bài 13 — Ôn tập địa điểm & hướng đi';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F01_F04','lesson13 must remain F01-F04');
        ok(document.querySelectorAll('[data-transfer-entry]').length===1,'lesson13 must have exactly one Transfer');
        ok(document.querySelector('[data-transfer-entry]')?.dataset.transferFamily==='singular-plural-regular-noun-phrases','lesson13 number family changed');

        document.querySelector('.topbar h1').textContent='Bài 36 — Venir de';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson36 must remain F05');
        ok(!document.querySelector('[data-transfer-entry]'),'lesson36 must not expose 38.8 negation Transfer');

        document.querySelector('.topbar h1').textContent='Bài 34 — Nous — nói “chúng ta”';
        window.FrenchTranquilleFoundationsPilot.refresh();
        window.FrenchTranquilleTransferLesson.refresh();
        ok(document.querySelector('[data-transfer-open]').getBoundingClientRect().height>=44,'negation Transfer entry target below 44px');
        ok(JSON.stringify(Object.keys(localStorage).sort().map(key=>[key,localStorage.getItem(key)]))===window.__b388StorageBefore,'localStorage changed during 38.8');
        ok(document.documentElement.scrollWidth<=innerWidth+1,'horizontal overflow detected');

        root.dataset.b388Done='1';
        root.dataset.b388Locale=window.__b388Debug?'fr':'vi';
        root.dataset.b388Family='affirmation-negation-regular-er-je';
        root.dataset.b388Exercises='3';
        root.dataset.b388Lesson='34';
        root.dataset.b388FoundationCoexists='1';
        root.dataset.b388LegacySubjectRoute='1';
        root.dataset.b388LegacyFutureRoute='1';
        root.dataset.b388LegacyNumberRoute='1';
        root.dataset.b388Routing='1';
        root.dataset.b388StorageUnchanged='1';
        root.dataset.b388NoOverflow='1';
      }catch(error){
        if(!root.dataset.b388Error)root.dataset.b388Error=error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
