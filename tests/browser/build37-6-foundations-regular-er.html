<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Build 37.6 F08 regular -er tribunal</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111e;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;background:#20314a;border:1px solid #5f7595;border-radius:12px;padding:8px 12px}.primary{background:#315d74}.secondary{background:#253852}.muted{color:#9fb0c5}.screen-lesson{width:min(760px,calc(100% - 24px));margin:20px auto}.topbar{padding:10px 2px}.topbar h1{font-size:1.25rem}.lesson-step{padding:18px;border:1px solid #23364d;border-radius:20px;background:#0d1928}
  </style>
  <script>
    (()=>{
      const debug=new URLSearchParams(location.search).get('debug')==='fr';
      localStorage.clear();
      localStorage.setItem('tran-french-teacher:debug-fr:v1',debug?'1':'0');
      localStorage.setItem('b37.6:sentinel','unchanged');
      window.__b376Debug=debug;
      window.__b376StorageBefore=JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]));
    })();
  </script>
</head>
<body>
  <main id="app">
    <section class="screen-lesson">
      <div class="topbar"><h1>Bài 32 — Nói với “tu” ở hiện tại</h1></div>
      <div class="lesson-step"><p data-existing-lesson>Existing lesson content</p></div>
    </section>
  </main>
  <script src="../../src/pedagogy/foundations-capsule-engine.js?v=2.4.0-b37.3"></script>
  <script src="../../src/pedagogy/foundations-capsules.js?v=2.4.0-b37.6"></script>
  <script src="../../src/pedagogy/foundations-pilot.js?v=2.4.0-b37.6"></script>
  <script>
    (()=>{
      const root=document.documentElement;
      const fail=message=>{root.dataset.b376Error=message;throw new Error(message)};
      const ok=(value,message)=>{if(!value)fail(message)};
      const text=selector=>document.querySelector(selector)?.textContent?.trim()||'';
      const texts=selector=>[...document.querySelectorAll(selector)].map(node=>node.textContent.trim());
      const click=selector=>{const node=document.querySelector(selector);ok(node,`missing ${selector}`);node.click();return node};
      const clickChoice=choice=>{const node=[...document.querySelectorAll('[data-foundation-choice]')].find(button=>button.textContent.trim()===choice);ok(node,`missing choice ${choice}`);node.click();return node};
      const expected=window.__b376Debug?{
        title:'Le présent régulier en -er : je • tu • il/elle',
        entry:'Environ 5 minutes pour relier un modèle écrit en -er déjà rencontré : je = -e, tu = -es, il/elle = -e. Pas de tableau complet de conjugaison.',
        intro:'Tu as déjà rencontré « travaille », « habite » et « aime » dans plusieurs phrases. On relie maintenant ces formes avec un petit modèle écrit.',
        prompts:['Trân parle d’elle-même : Je travaill___ .','Tu demandes à Jerry : Tu travaill___ ?','Tu parles d’une femme : Elle travaill___ .','Choisis la bonne phrase pour demander à Jerry où il habite :','Quelle phrase garde une forme particulière et ne suit pas ce petit modèle en -er ?'],
        conclusion:'Le réflexe écrit : pour beaucoup de verbes en -er, je = -e, tu = -es, il/elle = -e. À l’oral, ces formes sonnent souvent pareil : écoute aussi le pronom. C’est un modèle utile, pas une règle pour tous les verbes. Un mini-check réussi ne signifie pas que la règle est « maîtrisée ».'
      }:{
        title:'Hiện tại với động từ -er: je • tu • il/elle',
        entry:'Khoảng 5 phút để nối một mẫu viết -er đã gặp trong bài: je = -e, tu = -es, il/elle = -e. Không học cả bảng chia động từ.',
        intro:'Bạn đã gặp “travaille”, “habite” và “aime” trong nhiều câu. Bây giờ ta nối chúng thành một mẫu viết đơn giản.',
        prompts:['Trân nói về mình: Je travaill___ .','Bạn hỏi Jerry: Tu travaill___ ?','Bạn nói về một phụ nữ: Elle travaill___ .','Chọn câu đúng để hỏi Jerry sống ở đâu:','Câu nào giữ dạng riêng và không dùng mẫu -er này?'],
        conclusion:'Phản xạ viết cần giữ: với nhiều động từ -er, je = -e, tu = -es, il/elle = -e. Khi nói, các dạng này thường nghe giống nhau, vì vậy hãy nghe cả đại từ. Đây là một mẫu hữu ích, không phải quy tắc cho mọi động từ. Một mini-check đúng chưa có nghĩa là đã “thành thạo”.'
      };
      const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      (async()=>{
        await nextFrame();
        ok(window.FrenchTranquilleFoundationsCapsules?.F08?.concepts?.join(',')==='F08','F08 capsule missing');
        ok(window.FrenchTranquilleFoundationsPilot?.adapter==='37.3','37.3 adapter must remain owner');
        ok(window.FrenchTranquilleFoundationsPilot?.expansion==='37.4','F11 37.4 expansion ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.consolidation==='37.5','F05 37.5 consolidation ownership changed');
        ok(window.FrenchTranquilleFoundationsPilot?.verbPattern==='37.6','37.6 verb-pattern marker missing');
        ok(window.FrenchTranquilleFoundationsPilot?.persistent===false,'Foundations must remain ephemeral');
        ok(root.dataset.foundationsExpansion==='37.4','root F11 expansion marker changed');
        ok(root.dataset.foundationsConsolidation==='37.5','root F05 consolidation marker changed');
        ok(root.dataset.foundationsVerbPattern==='37.6','root F08 marker missing');
        ok(document.querySelectorAll('[data-foundation-entry]').length===1,'F08 entry count must be 1');
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','wrong lesson/capsule routing');
        ok(text('.ft-foundation-entry h3')==='je travaille • tu travailles • elle travaille','entry title mismatch');
        ok(text('.ft-foundation-entry p')===expected.entry,'entry copy mismatch');
        click('[data-foundation-open]');
        ok(document.querySelector('.ft-foundation-dialog')?.dataset.foundationActiveCapsule==='F08','F08 dialog ownership missing');
        ok(text('.ft-foundation-top .ft-foundation-eyebrow')==='F08 • CONSOLIDATION','F08 label mismatch');
        ok(text('.ft-foundation-top h2')===expected.title,'F08 title mismatch');
        ok(text('.ft-foundation-copy strong')===expected.intro,'F08 intro mismatch');
        ok(JSON.stringify(texts('.ft-foundation-examples b'))===JSON.stringify(['Je travaille.','Tu travailles ?','Elle travaille.','J’habite ici.','Tu habites où ?']),'F08 examples mismatch');
        click('[data-foundation-next]');
        const choices=[['e','es','ent'],['e','es','ons'],['e','es','ent'],['Tu habites où ?','Tu habite où ?','Tu habiter où ?'],['Tu vas où ?','Tu travailles ?','Tu habites où ?']];
        const answers=['e','es','e','Tu habites où ?','Tu vas où ?'];
        for(let index=0;index<answers.length;index+=1){
          ok(text('.ft-foundation-q h3')===expected.prompts[index],`question ${index+1} prompt mismatch`);
          ok(JSON.stringify(texts('[data-foundation-choice]'))===JSON.stringify(choices[index]),`question ${index+1} choices mismatch`);
          clickChoice(answers[index]);
          const correct=[...document.querySelectorAll('[data-foundation-choice]')].find(button=>button.textContent.trim()===answers[index]);
          ok(correct?.classList.contains('ok'),`question ${index+1} correct marking missing`);
          click('[data-foundation-next]');
        }
        ok(text('.ft-foundation-done p')===expected.conclusion,'F08 conclusion mismatch');
        click('.ft-foundation-done [data-foundation-close]');
        ok(!document.querySelector('.ft-foundation-overlay'),'overlay must close');
        ok(document.activeElement?.matches('[data-foundation-open]'),'focus must return to F08 entry CTA');
        ok(document.querySelector('[data-existing-lesson]'),'lesson content must survive round trip');

        document.querySelector('.topbar h1').textContent='Bài 33 — Il / elle ở hiện tại';
        window.FrenchTranquilleFoundationsPilot.refresh();
        await nextFrame();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F08','lesson 33 must remain F08');

        document.querySelector('.topbar h1').textContent='Bài 34 — Nous — nói “chúng ta”';
        window.FrenchTranquilleFoundationsPilot.refresh();
        await nextFrame();
        ok(document.querySelector('[data-foundation-entry]')?.dataset.foundationCapsule==='F05','lesson 34 must remain owned by F05');

        ok(JSON.stringify(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]))===window.__b376StorageBefore,'localStorage changed during F08 capsule');
        ok(document.documentElement.scrollWidth<=innerWidth+1,'horizontal overflow detected');
        ok(document.querySelector('[data-foundation-open]').getBoundingClientRect().height>=44,'entry target below 44px');
        root.dataset.b376Done='1';root.dataset.b376Locale=window.__b376Debug?'fr':'vi';root.dataset.b376F08='1';root.dataset.b376Routing='1';root.dataset.b376StorageUnchanged='1';root.dataset.b376NoOverflow='1';
      })().catch(error=>{root.dataset.b376Error=error.message;console.error(error)});
    })();
  </script>
</body>
</html>
